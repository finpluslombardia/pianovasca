                <button onClick={() => { setSpostaPartIdx(menuAzioniPart.idx); setRicercaDestSposta(''); setMenuAzioniPart(null); }} className="w-full px-4 py-2 text-sm text-left hover:bg-slate-50 text-slate-700 font-medium flex items-center gap-2"><ChevronRightIcon size={16}/> Sposta in un altro corso…</button>
                <div className="h-px bg-slate-200 my-1"></div>
                <button onClick={() => { const i = menuAzioniPart.idx; setMenuAzioniPart(null); rimuoviPartecipante(i); }} className="w-full px-4 py-2 text-sm text-left hover:bg-red-50 text-red-600 font-medium flex items-center gap-2"><Trash2Icon size={16}/> Rimuovi da questo corso</button>
              </div>
            </div>
          )}

          {/* --- SPOSTA ISCRITTO IN UN ALTRO CORSO --- */}
          {editModal && spostaPartIdx !== null && editModal.partecipanti[spostaPartIdx] && (() => {
            const persona = editModal.partecipanti[spostaPartIdx];
            const chiaviOrigine = new Set((editModal.corsoOriginale && editModal.corsoOriginale.keys) || []);
            const q = ricercaDestSposta.trim().toLowerCase();
            const giorniAbb = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
            const destinazioni = tuttiCorsiSelect
              .filter(c => !c.keys.some(k => chiaviOrigine.has(k)))
              .map(c => {
                const info = attivita.find(a => a.id === c.data.id);
                const lab = chiaveELabelCorso(c.data);
                const attivi = (c.data.partecipanti || []).filter(x => isAttivoInSettimana(x, inizioSettimana)).length;
                return { c, info, livello: lab ? lab.label : '', attivi, max: Number(c.data.maxUtenti) || 0, testo: `${info ? info.name : ''} ${lab ? lab.label : ''} ${giorniAbb[c.giorno]} ${c.oraInizio} ${c.data.istruttore || ''}`.toLowerCase() };
              })
              .filter(d => !q || d.testo.includes(q));
            const gruppi = [];
            destinazioni.forEach(d => { const nome = d.info ? d.info.name : 'Altro'; let g = gruppi.find(x => x.nome === nome); if (!g) { g = { nome, info: d.info, righe: [] }; gruppi.push(g); } g.righe.push(d); });
            return (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[70] flex items-center justify-center p-4" onClick={() => setSpostaPartIdx(null)}>
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden flex flex-col h-[80vh] max-h-[720px]" onClick={e => e.stopPropagation()}>
                  <div className="px-5 py-4 bg-[#1e3a5f] text-white flex justify-between items-center">
                    <h3 className="font-bold text-lg">Sposta {persona.nome} in un altro corso</h3>
                    <button onClick={() => setSpostaPartIdx(null)} className="hover:bg-white/20 p-1 rounded-full transition-colors"><XIcon size={20}/></button>
                  </div>
                  <div className="p-4 border-b border-slate-200 bg-slate-50">
                    <input type="text" autoFocus value={ricercaDestSposta} onChange={e => setRicercaDestSposta(e.target.value)} placeholder="Cerca per attività, livello, giorno, istruttore..." className="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-300" />
                  </div>
                  <div className="flex-1 overflow-y-auto bg-slate-50 p-4 flex flex-col gap-4">
                    {gruppi.length === 0 && <p className="text-sm text-slate-500 text-center py-6">Nessun corso trovato.</p>}
                    {gruppi.map(g => (
                      <div key={g.nome} className="shrink-0">
                        <div className="mb-1.5"><span className={`px-2.5 py-1 rounded-md text-xs font-bold border ${g.info ? g.info.color + ' ' + g.info.border : 'bg-slate-200'}`}>{g.nome}</span></div>
                        <div className="flex flex-col gap-1">
                          {g.righe.map((d, i) => (
                            <button key={i} onClick={() => spostaPartecipante(spostaPartIdx, d.c)} className="flex items-center justify-between gap-3 bg-white hover:bg-blue-50 border border-slate-200 rounded-lg px-3 py-2 text-sm text-left transition-colors">
                              <span className="min-w-0">
                                <b className="text-slate-800">{giorniAbb[d.c.giorno]} {d.c.oraInizio}</b>
                                <span className="text-slate-500"> · {d.c.vasca === 'esterna' ? 'Esterna' : 'Interna'}</span>
                                {d.livello && <span className="text-slate-700"> · {d.livello}</span>}
                                {d.c.data.istruttore && <span className="text-slate-400"> · {d.c.data.istruttore}</span>}
                              </span>
                              <span className={`shrink-0 text-xs font-bold ${d.max > 0 && d.attivi >= d.max ? 'text-red-600' : 'text-slate-500'}`}>{d.attivi}{d.max ? `/${d.max}` : ''} iscritti</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="px-6 py-3 border-t border-slate-200 flex justify-end bg-white">
                    <button onClick={() => setSpostaPartIdx(null)} className="px-4 py-2 rounded-lg font-bold text-slate-600 hover:bg-slate-200 transition-colors">Annulla</button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* --- MODALE DISPONIBILITÀ CORSI --- */}
          {isDisponibilitaOpen && (() => {
            const giorniAbb = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
            const totPosti = disponibilita.reduce((t, k) => t + k.posti, 0);
            const totLiberi = disponibilita.reduce((t, k) => t + k.liberi, 0);
            const colLiberi = (n) => n === 0 ? 'text-red-600' : n <= 2 ? 'text-amber-600' : 'text-emerald-600';
            // Stima netta: dai posti liberi si tolgono le persone in lista d'attesa compatibili con il periodo mostrato.
            const periodoVista = periodoDisp === 'settimana' ? (intervalliDisp.settimana.inizio <= intervalliDisp.primo.fine ? 'primo' : 'secondo') : periodoDisp;
            const attesaCompat = (c) => { const pr = c.periodoRichiesto || ''; return !pr || pr === 'annuale' || periodoVista === 'annuale' || pr === periodoVista; };
            return (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setIsDisponibilitaOpen(false)}>
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-6xl overflow-hidden animate-in fade-in zoom-in duration-200 flex flex-col h-[85vh] max-h-[800px]" onClick={e => e.stopPropagation()}>
                  <div className="px-2 pt-2 flex flex-col bg-[#1e3a5f] text-white">
                    <div className="flex justify-between items-center px-3 pb-3 pt-1 mb-1 border-b border-white/20">
                      <h3 className="font-bold text-xl flex items-center gap-2"><UsersIcon size={24}/> Disponibilità corsi</h3>
                      <div className="flex items-center gap-3">
                        <span className="text-sm font-medium text-white/80">Stagione {stagioneSelezionata}</span>
                        <button onClick={() => setIsDisponibilitaOpen(false)} className="hover:bg-white/20 p-1 rounded-full transition-colors"><XIcon size={22}/></button>
                      </div>
                    </div>
                    <div className="flex">
                      {['settimana', 'primo', 'secondo', 'annuale', 'rinnovi'].map(id => (
                        <button key={id} onClick={() => setPeriodoDisp(id)} className={`flex-1 py-2 text-sm font-bold transition-all border-b-4 border-transparent leading-tight ${periodoDisp === id ? 'bg-white/20' : 'opacity-80 hover:bg-white/5'}`}>
                          {id === 'rinnovi' ? <>Rinnovi {statoRinnovi.daRinnovare.length > 0 && <span className="ml-1 bg-amber-400 text-slate-900 text-[11px] px-1.5 py-0.5 rounded-full">{statoRinnovi.daRinnovare.length}</span>}</> : intervalliDisp[id].label}
                          <div className="text-[11px] font-medium text-white/75">{id === 'rinnovi' ? 'Primo → secondo periodo' : `${formatDate(intervalliDisp[id].inizio)} - ${formatDate(intervalliDisp[id].fine)}`}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                  {periodoDisp === 'rinnovi' ? (
                  <div className="flex-1 overflow-y-auto bg-slate-50 p-5 flex flex-col gap-3">
                    <p className="shrink-0 text-xs text-slate-500">Persone con il <b>primo periodo</b> ({formatDate(intervalliDisp.primo.inizio)} - {formatDate(intervalliDisp.primo.fine)}) da ricontattare per il <b>secondo</b> ({formatDate(intervalliDisp.secondo.inizio)} - {formatDate(intervalliDisp.secondo.fine)}). Chi ha già un periodo oltre il {formatDate(intervalliDisp.primo.fine)} risulta "Già rinnovato". La spunta verde (messaggio inviato) viene salvata.</p>
                    {(soloDaRinnovare ? statoRinnovi.daRinnovare : statoRinnovi.lista).length === 0 ? (
                      <div className="p-8 text-center text-slate-400">{statoRinnovi.lista.length === 0 ? 'Nessuna persona con il primo periodo in questa stagione.' : 'Tutti hanno già rinnovato.'}</div>
                    ) : (
                      <ul className="shrink-0 bg-white border border-slate-200 rounded-xl divide-y divide-slate-100 overflow-hidden">
                        {(soloDaRinnovare ? statoRinnovi.daRinnovare : statoRinnovi.lista).map(r => renderRigaRinnovo(r))}
                      </ul>
                    )}
                  </div>
                  ) : (
                  <div className="flex-1 overflow-y-auto bg-slate-50 p-5 flex flex-col gap-3">
                    {disponibilita.length === 0 && <p className="text-sm text-slate-500">Nessun corso con un numero massimo di partecipanti attivo in questo periodo.</p>}
                    {periodoDisp !== 'settimana' && disponibilita.length > 0 && <p className="shrink-0 text-xs text-slate-500">Per i periodi, gli iscritti sono il <b>picco</b> di presenze nelle settimane del periodo: i posti liberi sono quelli rimasti per chi si iscrive per tutto il periodo. Contano solo i corsi attivi in quelle date.</p>}
                    {disponibilita.map(k => {
                      const aperta = catDispEspansa === k.info.id;
                      const perc = k.posti ? Math.min(100, Math.round(k.iscritti / k.posti * 100)) : 0;
                      const attesaCat = contattiAttesaAttivi.filter(c => c.motivazione === 'corso' && c.corsoRichiesto === k.info.id && attesaCompat(c)); // solo chi è interessato a questo periodo
                      const nCompatCat = attesaCat.filter(attesaCompat).length;
                      return (
                        <div key={k.info.id} className="shrink-0 bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                          <button onClick={() => setCatDispEspansa(aperta ? null : k.info.id)} className="w-full flex items-center gap-4 px-4 py-3 text-left hover:bg-slate-50 transition-colors">
                            <ChevronRightIcon size={18} className={`shrink-0 text-slate-400 transition-transform ${aperta ? 'rotate-90' : ''}`} />
                            <span className={`shrink-0 px-3 py-1 rounded-md text-sm font-bold border ${k.info.color} ${k.info.border}`}>{k.info.name}</span>
                            <div className="flex-1 min-w-0">
                              <div className="h-2 rounded-full bg-slate-100 overflow-hidden"><div className={`h-full rounded-full ${perc >= 100 ? 'bg-red-400' : perc >= 85 ? 'bg-amber-400' : 'bg-emerald-400'}`} style={{ width: perc + '%' }}></div></div>
                              <div className="text-xs text-slate-500 mt-1">{k.iscritti} iscritti su {k.posti} posti · {k.corsi} {k.corsi === 1 ? 'corso' : 'corsi'}{k.senzaLimite > 0 ? ` (+${k.senzaLimite} senza limite)` : ''}
                                {attesaCat.length > 0 && <span className={`ml-2 px-2 py-0.5 rounded-full font-bold ${k.liberi > 0 ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'}`}>⏳ {attesaCat.length} in lista d'attesa{k.liberi > 0 ? ' · posti disponibili!' : ''}</span>}
                              </div>
                            </div>
                            <div className="shrink-0 text-right w-28">
                              <div className={`text-2xl font-bold leading-none ${colLiberi(k.liberi)}`}>{k.liberi}</div>
                              <div className="text-[11px] font-bold uppercase tracking-wide text-slate-400 mt-1">{k.liberi === 1 ? 'posto libero' : 'posti liberi'}</div>
                              {nCompatCat > 0 && <div className="text-[11px] font-bold text-amber-700 mt-0.5">≈ {Math.max(0, k.liberi - nCompatCat)} netti</div>}
                            </div>
                          </button>
                          {aperta && (
                            <div className="border-t border-slate-100 px-4 py-3 bg-slate-50/60 flex flex-col gap-3">
                              {attesaCat.length > 0 && (
                                <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
                                  <div className="text-xs font-bold text-amber-800 uppercase tracking-wide mb-1">In lista d'attesa per {k.info.name} ({attesaCat.length}){k.liberi > 0 ? ' · avvisali: ci sono posti' : ''}</div>
                                  <div className="flex flex-col gap-1">
                                    {attesaCat.map((c, ci) => {
                                      const num = numeroPerWhatsapp(c.telefono);
                                      const testoA = c.nomeGenitore
                                        ? `Buongiorno ${soloNomeProprio(c.nomeGenitore)}, dal Centro Federale Lampugnano: si è liberato un posto nei corsi di ${k.info.name} per ${soloNomeProprio(c.nome)}. Siete ancora interessati? Fateci sapere 🏊`
                                        : `Ciao ${soloNomeProprio(c.nome)}! Dal Centro Federale Lampugnano: si è liberato un posto nei corsi di ${k.info.name}. Sei ancora interessato/a? Fammi sapere 🏊`;
                                      return (
                                        <div key={ci} className="flex items-center justify-between gap-2 text-sm">
                                          <span className="text-slate-700"><b>{c.nome}</b>{c.eta ? ` · ${c.eta} anni` : ''}{extraCorsoAttesa(c) ? <span className="text-amber-800"> · {extraCorsoAttesa(c)}</span> : null}{c.dataCreazione ? <span className="text-slate-400"> · dal {formatDate(c.dataCreazione)}</span> : null}</span>
                                          {num
                                            ? <a href={`whatsapp://send?phone=${num}&text=${encodeURIComponent(testoA)}`} title="Avvisa su WhatsApp" className="shrink-0 p-1.5 rounded-md text-[#25D366] bg-white hover:bg-green-100"><WhatsAppIcon size={16}/></a>
                                            : <span title="Numero mancante" className="shrink-0 p-1.5 rounded-md text-slate-300 bg-slate-100"><WhatsAppIcon size={16}/></span>}
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>
                              )}
                              {k.livelli.map(L => {
                                const righe = soloConPosti ? L.elenco.filter(r => r.liberi > 0) : L.elenco;
                                if (righe.length === 0) return null;
                                return (
                                  <div key={L.etichetta}>
                                    <div className="flex items-center justify-between mb-1.5">
                                      <span className="text-sm font-bold text-slate-700">{L.etichetta}</span>
                                      <span className={`text-sm font-bold ${colLiberi(L.liberi)}`}>{L.liberi} {L.liberi === 1 ? 'libero' : 'liberi'} <span className="text-xs font-medium text-slate-400">su {L.posti}</span>{(() => { const nL = attesaCat.filter(c => c.livelloRichiesto && c.livelloRichiesto === L.ordine && attesaCompat(c)).length; return nL > 0 ? <span className="ml-2 text-xs font-bold text-amber-700">· {nL} in attesa → ≈ {Math.max(0, L.liberi - nL)} netti</span> : null; })()}</span>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-1.5">
                                      {[...righe].sort((a, b) => a.giorno - b.giorno || a.ora.localeCompare(b.ora)).map((r, i) => (
                                        <div key={i} className="flex items-center justify-between bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-sm">
                                          <div className="min-w-0">
                                            <span className="font-bold text-slate-700">{giorniAbb[r.giorno]} {r.ora}</span>
                                            <span className="text-slate-400"> · {r.vasca === 'esterna' ? 'Esterna' : 'Interna'}</span>
                                            {r.istruttore && <span className="text-slate-500"> · {r.istruttore}</span>}
                                          </div>
                                          <div className={`shrink-0 font-bold ${colLiberi(r.liberi)}`}>{r.liberi}<span className="text-xs font-medium text-slate-400"> ({r.attivi}/{r.max})</span></div>
                                        </div>
                                      ))}
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                  )}
                  <div className="px-6 py-3 border-t border-slate-200 flex items-center justify-between bg-white">
                    {periodoDisp === 'rinnovi' ? (
                    <label className="flex items-center gap-2 text-sm font-medium text-slate-600 cursor-pointer select-none">
                      <input type="checkbox" checked={soloDaRinnovare} onChange={e => setSoloDaRinnovare(e.target.checked)} className="w-4 h-4 accent-[#1e3a5f]" />
                      Mostra solo chi è da rinnovare
                    </label>
                    ) : (
                    <label className="flex items-center gap-2 text-sm font-medium text-slate-600 cursor-pointer select-none">
                      <input type="checkbox" checked={soloConPosti} onChange={e => setSoloConPosti(e.target.checked)} className="w-4 h-4 accent-[#1e3a5f]" />
                      Nel dettaglio mostra solo i corsi con posti liberi
                    </label>
                    )}
                    <div className="flex items-center gap-4">
                      {periodoDisp === 'rinnovi'
                        ? <span className="text-sm font-bold text-slate-600">Da rinnovare: <span className="text-amber-600">{statoRinnovi.daRinnovare.length}</span> · Già rinnovati: <span className="text-emerald-600">{statoRinnovi.rinnovati.length}</span></span>
                        : <span className="text-sm font-bold text-slate-600">Totale: <span className={colLiberi(totLiberi)}>{totLiberi}</span> posti liberi su {totPosti}</span>}
                      <button onClick={() => setIsDisponibilitaOpen(false)} className="px-5 py-2.5 bg-[#1e3a5f] hover:bg-[#2a4d7c] text-white rounded-lg font-bold shadow-md transition-all">Chiudi</button>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* --- MODALE ISCRITTI GIORNO --- */}
          {isIscrittiGiornoOpen && (() => {
            const nomiGiorni = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
            return (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setIsIscrittiGiornoOpen(false)}>
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-6xl overflow-hidden animate-in fade-in zoom-in duration-200 flex flex-col h-[85vh] max-h-[800px]" onClick={e => e.stopPropagation()}>
                  <div className="px-2 pt-2 flex flex-col bg-[#1e3a5f] text-white">
                    <div className="flex justify-between items-center px-3 pb-3 pt-1 mb-1 border-b border-white/20">
                      <h3 className="font-bold text-xl flex items-center gap-2 flex-wrap"><UsersIcon size={24}/> Iscritti giorno
                        <span className="bg-white/20 px-3 py-1 rounded-full text-sm font-bold">{nomiGiorni[giornoIscritti]} {iscrittiGiorno.data}</span>
                        <span className="bg-white/20 px-3 py-1 rounded-full text-sm font-bold">{iscrittiGiorno.totale} persone</span>
                      </h3>
                      <div className="flex items-center gap-3">
                        <span className="text-sm font-medium text-white/80">Stagione {stagioneSelezionata}</span>
                        <button onClick={() => setIsIscrittiGiornoOpen(false)} className="hover:bg-white/20 p-1 rounded-full transition-colors"><XIcon size={22}/></button>
                      </div>
                    </div>
                    <div className="flex">
                      {[['primo', 'Primo periodo'], ['secondo', 'Secondo periodo'], ['annuale', 'Annuale'], ['giorno', 'Giorno']].map(([id, lab]) => {
                        const attiva = id === 'giorno' ? isIscrittiGiornoOpen : iscrittiPeriodo === id;
                        return (
                          <button key={id} onClick={() => { if (id === 'giorno') { setIscrittiPeriodo(null); setIsIscrittiGiornoOpen(true); } else { setIsIscrittiGiornoOpen(false); setRicercaIscrittiPeriodo(''); setIscrittiPeriodo(id); } }} className={`flex-1 py-2 text-sm font-bold transition-all border-b-4 border-transparent leading-tight ${attiva ? 'bg-white/20' : 'opacity-80 hover:bg-white/5'}`}>
                            {lab}
                            <div className="text-[11px] font-medium text-white/75">{id === 'giorno' ? 'Scegli il giorno' : `${formatDate(intervalliDisp[id].inizio)} - ${formatDate(intervalliDisp[id].fine)}`}</div>
                          </button>
                        );
                      })}
                    </div>
                    <div className="flex bg-black/15 mt-0">
                      {nomiGiorni.map((g, i) => (
                        <button key={g} onClick={() => setGiornoIscritti(i)} className={`flex-1 py-2.5 text-sm font-bold transition-all border-b-4 border-transparent ${giornoIscritti === i ? 'bg-white/20' : 'opacity-80 hover:bg-white/5'}`}>{g.slice(0, 3)}</button>
                      ))}
                    </div>
                  </div>
                  <div className="flex-1 overflow-y-auto bg-slate-50 p-5 flex flex-col gap-3">
                    {iscrittiGiorno.corsi.length === 0 && <p className="text-sm text-slate-500 text-center py-6">Nessun corso in questo giorno nella settimana visualizzata.</p>}
                    {iscrittiGiorno.corsi.map((c, idx) => (
                      <div key={idx} className="shrink-0 bg-white border border-slate-200 rounded-xl overflow-hidden">
                        <div className="px-4 py-2 bg-slate-100 border-b border-slate-200 flex items-center gap-3 flex-wrap text-sm">
                          <span className="font-bold text-slate-800">{c.ora}</span>
                          <span className="font-semibold text-slate-700">{c.titolo}</span>
                          <span className="text-slate-500">{c.vasca === 'interna' ? 'Interna' : c.vasca === 'esterna' ? 'Esterna' : c.vasca}{c.istruttore ? ` · ${c.istruttore}` : ''}</span>
                          <span className="ml-auto text-xs font-bold text-slate-600">{c.partecipanti.length}{c.max ? `/${c.max}` : ''} iscritti</span>
                        </div>
                        {c.partecipanti.length === 0 ? (
                          <div className="px-4 py-2 text-sm text-slate-400">Nessun iscritto attivo</div>
                        ) : (
                          <div className="px-4 py-2 grid grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-1 text-sm text-slate-700">
                            {c.partecipanti.map((pp, j) => <div key={j}>{pp.nome}</div>)}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                  <div className="px-6 py-3 border-t border-slate-200 flex justify-between items-center bg-slate-50">
                    <span className="text-xs text-slate-500">Settimana visualizzata nel calendario · solo iscritti attivi in quella settimana</span>

<input

                const nPrivScad = lezioniPrivate.filter(x => statoPacchetto(x, oggiB).inScadenza).length;
                const COL = { blu: 'bg-cyan-100 hover:bg-cyan-200 text-cyan-800 border-cyan-300', indaco: 'bg-violet-100 hover:bg-violet-200 text-violet-800 border-violet-300', rosa: 'bg-pink-100 hover:bg-pink-200 text-pink-800 border-pink-300', verde: 'bg-lime-100 hover:bg-lime-200 text-lime-800 border-lime-300', ambra: 'bg-slate-100 hover:bg-slate-200 text-slate-800 border-slate-300', arancio: 'bg-orange-100 hover:bg-orange-200 text-orange-800 border-orange-300' };
                const btn = (c) => `relative flex items-center gap-2 px-3 py-2 border rounded-md text-sm font-medium transition-colors ${COL[c]}`;
                const bd = (n, col, t) => n > 0 ? <span title={t} className={`absolute -top-2 -right-2 min-w-[20px] h-5 px-1 rounded-full ${col} text-white text-[11px] font-bold flex items-center justify-center border-2 border-white`}>{n}</span> : null;
                const grp = (titolo, figli) => <div className="flex flex-col gap-1"><div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-0.5">{titolo}</div><div className="flex items-center gap-2">{figli}</div></div>;
                const sep = <div className="w-px self-stretch bg-slate-200 mx-1"></div>;
                return (<>
                  <div className="flex items-stretch gap-3 mr-auto">
                    {grp('Piano vasca', <button onClick={() => setIsLiberoOpen(true)} className={btn('arancio')} title="Periodi, giorni e orari del nuoto libero (sfondo nel piano vasca)"><ClockIcon size={16} /> Nuoto libero</button>)}
                  </div>
                  <div className="flex items-stretch gap-3 flex-wrap">
                    {grp('Iscritti', <>
                      <button onClick={() => { setCatDispEspansa(null); setIsDisponibilitaOpen(true); }} className={btn('blu')} title="Posti liberi per ogni categoria di corso"><UsersIcon size={16} /> Disponibilità corsi</button>
                      <button onClick={() => { setRicercaIscrittiPeriodo(''); setIscrittiPeriodo('primo'); setIsIscrittiGiornoOpen(false); }} className={btn('indaco')} title="Elenco iscritti per periodo o per giorno"><UsersIcon size={16} /> Iscritti per periodo</button>
                    </>)}
                    {sep}
                    {grp('Attività', <>
                      <button onClick={() => setIsPrivateOpen(true)} className={btn('rosa')} title="Pacchetti di lezioni private da 5 o 10 lezioni"><UsersIcon size={16} /> Lezioni private{bd(nPrivScad, 'bg-amber-500', nPrivScad + ' pacchetti in scadenza entro 30 giorni')}</button>
                      <button onClick={() => setIsTirocinantiOpen(true)} className={btn('verde')} title="Calendario e ore dei tirocinanti"><CalendarIcon size={16} /> Tirocinanti</button>
                    </>)}
                    {sep}
                    {grp('Avvisi', <>
                      <button onClick={() => { setChiusuraDaAprire(null); setIsChiusureOpen(true); }} className={btn('ambra')} title="Chiusure della vasca e avvisi agli iscritti"><BanIcon size={16} /> Chiusure{bd(nChiusure, 'bg-red-500', nChiusure + ' chiusure in corso o future')}</button>
                    </>)}
                  </div>
                </>);
              })()}
            </div>
            <div className="shrink-0 flex items-center gap-3 flex-wrap">
              <button onClick={handleLogout} className="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 rounded-md transition-colors" title="Esci dal gestionale"><LogOutIcon size={13} /> Esci</button>
              <div className="w-px h-6 bg-slate-300"></div>
                    {/* MENU ESPORTAZIONE */}
                    <div className="relative">
                      <button onClick={() => setIsExportMenuOpen(!isExportMenuOpen)} className="flex items-center gap-2 px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-md text-sm font-medium transition-colors" title="Esporta / Importa">
                        <DownloadIcon size={16} /> Esporta / Importa
                      </button>
                      {isExportMenuOpen && (
                        <>
                        <div className="fixed inset-0 z-40" onClick={() => setIsExportMenuOpen(false)}></div>
                        <div className="absolute bottom-full mb-2 left-0 bg-white border border-slate-200 shadow-xl rounded-xl p-2 z-50 w-[340px] flex flex-col">
                            <div className="px-3 pt-2 pb-1 text-[11px] font-bold tracking-wider text-slate-400 uppercase">Esporta sul computer</div>
                            <button onClick={() => { setIsExportMenuOpen(false); esportaExcel(); }} className="w-full px-3 py-2 text-left hover:bg-slate-50 rounded-md flex items-start gap-3 cursor-pointer">
                              <span className="mt-0.5 text-[#1e3a5f] shrink-0"><Icon size={18}><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></Icon></span>
                              <span className="flex flex-col"><span className="text-sm font-bold text-slate-800">Excel / Fogli</span><span className="text-xs text-slate-500">Tabella da aprire in Excel o Fogli Google</span></span>
                            </button>
                            <button onClick={esportaDati} className="w-full px-3 py-2 text-left hover:bg-slate-50 rounded-md flex items-start gap-3 cursor-pointer">
                              <span className="mt-0.5 text-[#1e3a5f] shrink-0"><DownloadIcon size={18} /></span>
                              <span className="flex flex-col"><span className="text-sm font-bold text-slate-800">File di backup completo</span><span className="text-xs text-slate-500">Scarica una copia di tutti i dati (JSON)</span></span>
                            </button>
                            <div className="h-px bg-slate-200 my-1.5"></div>
                            <div className="px-3 pt-2 pb-1 text-[11px] font-bold tracking-wider text-slate-400 uppercase">Importa dal computer</div>
                            <label className="w-full px-3 py-2 text-left hover:bg-slate-50 rounded-md flex items-start gap-3 cursor-pointer">
                              <span className="mt-0.5 text-[#1e3a5f] shrink-0"><UploadIcon size={18} /></span>
                              <span className="flex flex-col"><span className="text-sm font-bold text-slate-800">Importa soci</span><span className="text-xs text-slate-500">Da un file Excel o CSV</span></span>
                              <input type="file" accept=".xlsx,.xls,.csv" onChange={(e) => { setIsExportMenuOpen(false); gestisciFileSoci(e); }} className="hidden" />
                            </label>
                            <label className="w-full px-3 py-2 text-left hover:bg-slate-50 rounded-md flex items-start gap-3 cursor-pointer">
                              <span className="mt-0.5 text-[#1e3a5f] shrink-0"><UploadIcon size={18} /></span>
                              <span className="flex flex-col"><span className="text-sm font-bold text-slate-800">Ripristina da file</span><span className="text-xs text-slate-500">Carica un backup JSON scaricato in precedenza</span></span>
                              <input type="file" accept=".json" onChange={(e) => { importaDati(e); setIsExportMenuOpen(false); }} className="hidden" />
                            </label>
                            <div className="h-px bg-slate-200 my-1.5"></div>
                            <div className="px-3 pt-2 pb-1 text-[11px] font-bold tracking-wider text-slate-400 uppercase">Backup sul cloud</div>
                            <button onClick={() => { setIsExportMenuOpen(false); creaBackupManuale(); }} className="w-full px-3 py-2 text-left hover:bg-slate-50 rounded-md flex items-start gap-3 cursor-pointer">
                              <span className="mt-0.5 text-[#1e3a5f] shrink-0"><Icon size={18}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></Icon></span>
                              <span className="flex flex-col"><span className="text-sm font-bold text-slate-800">Crea backup ora</span><span className="text-xs text-slate-500">Salva subito una copia di sicurezza online</span></span>
                            </button>
                            <button onClick={() => { setIsExportMenuOpen(false); apriBackupCloud(); }} className="w-full px-3 py-2 text-left hover:bg-slate-50 rounded-md flex items-start gap-3 cursor-pointer">
                              <span className="mt-0.5 text-[#1e3a5f] shrink-0"><Icon size={18}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon></span>
                              <span className="flex flex-col"><span className="text-sm font-bold text-slate-800">Elenco backup e ripristino</span><span className="text-xs text-slate-500">Backup automatici (ultimi 30 giorni) e manuali</span></span>
                            </button>
                        </div>
                        </>
                      )}
                    </div>
                    {(() => {
                      if (!ultimoBackupAt) return <button onClick={apriBackupCloud} className="text-xs text-slate-400 hover:text-slate-600" title="Apri l'elenco dei backup">Ultimo backup: nessuno / in verifica</button>;
                      const d = new Date(ultimoBackupAt);
                      const ore = (Date.now() - d.getTime()) / 3600000;
                      const hhmm = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
                      const oggiY = toYMD(new Date()), ieriD = new Date(); ieriD.setDate(ieriD.getDate() - 1);
                      const giornoY = toYMD(d);
                      const quando = giornoY === oggiY ? 'oggi' : giornoY === toYMD(ieriD) ? 'ieri' : d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
                      const stato = ore < 30 ? 'text-green-700 bg-green-50 border-green-200' : ore < 72 ? 'text-amber-700 bg-amber-50 border-amber-200' : 'text-red-700 bg-red-50 border-red-200';
                      return <button onClick={apriBackupCloud} className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-md border text-xs font-semibold ${stato}`} title="Apri l'elenco dei backup sul cloud"><span className="w-2 h-2 rounded-full bg-current"></span>Ultimo backup: {quando} {hhmm}</button>;
                    })()}

            </div>

          </main>

          {/* DATALIST PER AUTOSUGGERIMENTO UTENTI */}
          <datalist id="utenti-list">
            {listaAutocompletamentoSoci.map((u, idx) => <option key={idx} value={u.nome} />)}
          </datalist>

          {/* AVVISO DI SALVATAGGIO CLOUD FALLITO (compare solo in caso di errore: il successo
              è già comunicato dal popup in alto a destra) */}
          {statoSalvataggio === 'error' && (
            <div className="fixed bottom-4 right-4 z-[200] px-3 py-2 rounded-lg shadow-lg text-xs font-bold text-white bg-red-600 pointer-events-none">
              ⚠ NON SALVATO — riprovo tra poco
            </div>
          )}

          {/* POPUP DI CONFERMA (TOAST) */}
          <div className="fixed top-4 right-4 z-[200] flex flex-col gap-2 items-end pointer-events-none">
            {toasts.map(t => (
              <div
                key={t.id}
                className={`toast-enter pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-sm font-semibold text-white max-w-xs ${t.tipo === 'error' ? 'bg-red-600' : 'bg-green-600'}`}
              >
                {t.tipo === 'error' ? <InfoIcon size={18} className="shrink-0" /> : <CheckIcon size={18} className="shrink-0" />}
                <span>{t.messaggio}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
