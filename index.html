    const WhatsAppIcon = ({ size = 16, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>

    const MessageCircleIcon = (p) => <Icon {...p}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></Icon>;
    const CopyIcon = (p) => <Icon {...p}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Icon>;

    // --- UTILITY DATE PER PARTECIPANTI E CALENDARIO ---
    // BUGFIX: confrontiamo giorno contro giorno (entrambe le date normalizzate a mezzanotte),
    // non data contro ora esatta corrente. Prima, un certificato con scadenza "oggi" risultava
    // già scaduto appena passata la mezzanotte del giorno stesso, in contrasto con il pannello
    // Scadenze (che già usava questo confronto corretto) — un certificato in scadenza oggi resta
    // valido fino alla fine della giornata odierna.
    const isScaduto = (dateStr) => {
      if (!dateStr) return false;
      const data = new Date(dateStr);
      data.setHours(0, 0, 0, 0);
      const oggi = new Date();
      oggi.setHours(0, 0, 0, 0);
      return data < oggi;
    };
    const formatDate = (dateStr) => {
      if (!dateStr) return '-';
      const [y, m, d] = dateStr.split('-');
      return `${d}/${m}/${y}`;
    };
    // Data di nascita completa (AAAA-MM-GG). Il campo "anno" resta come valore derivato (l'anno
    // della data), così tutta la logica esistente basata sull'età continua a funzionare. Le
    // persone inserite in passato con il solo anno mostrano l'anno finché non si completa la data.
    const annoDaDataNascita = (d) => (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) ? d.slice(0, 4) : '';
    const etichettaNascita = (p) => (p && p.dataNascita) ? formatDate(p.dataNascita) : ((p && p.anno) || '-');
    // Sotto i 6 anni il certificato medico non è obbligatorio: quindi anche se assente o con data
    // passata non va segnalato come scaduto/mancante. L'età viene calcolata rispetto all'anno di
    // inizio della stagione selezionata (così resta coerente per tutta la stagione), con fallback
    // sull'anno solare corrente se non disponibile.
    // Se è nota la data di nascita completa, si usa l'età reale di OGGI (il certificato diventa
    // obbligatorio dal giorno del sesto compleanno). Per chi ha solo l'anno resta il vecchio calcolo.
    const certificatoObbligatorio = (annoNascita, annoRiferimento, dataNascita) => {
      if (dataNascita && /^\d{4}-\d{2}-\d{2}$/.test(dataNascita)) {
        const [by, bm, bd] = dataNascita.split('-').map(Number);
        const oggi = new Date();
        let eta = oggi.getFullYear() - by;
        if (oggi.getMonth() + 1 < bm || (oggi.getMonth() + 1 === bm && oggi.getDate() < bd)) eta--;
        return eta >= 6;
      }
      if (!annoNascita) return true; // età sconosciuta: per prudenza continuiamo a segnalarlo
      const rif = annoRiferimento || new Date().getFullYear();
      return (rif - Number(annoNascita)) >= 6;
    };

    // --- ARCHIVIO SOCI PERMANENTE ---
    // Costruisce l'archivio soci unendo tutti i partecipanti già presenti in TUTTE le stagioni
    // salvate. Usata come migrazione automatica la prima volta (quando l'archivio non esiste
    // ancora su Firestore), così i nomi già inseriti in passato non vanno ridigitati da capo.
    // --- SALVATAGGIO A BLOCCHI (formato v2) ---
    // Invece di un unico documento enorme, i dati sono divisi in blocchi piccoli: uno per ogni
    // stagione/vasca/giorno, alcuni per l'archivio soci, uno per la lista d'attesa e uno di
    // intestazione (elenco stagioni). Si riscrivono solo i blocchi che cambiano.
    const stableStringify = (v) => JSON.stringify(v, (k, val) => (val && typeof val === 'object' && !Array.isArray(val)) ? Object.keys(val).sort().reduce((o, key) => { o[key] = val[key]; return o; }, {}) : val);
    const idStagione = (n) => String(n).replace(/[\/\s.]/g, '_');
    const N_BLOCCHI_ARCHIVIO = 12;
    const hashBlocco = (str) => { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h % N_BLOCCHI_ARCHIVIO; };
    const statoToDocs = ({ tuttiPiani, stagioni, stagionePredefinita, archivioSoci, listaAttesa, tirocinanti, chiusure, lezioniPrivate, nuotoLibero }) => {
      const docs = {};
      docs['v2_meta'] = { formato: 'v2', stagioni: stagioni || [], stagionePredefinita: stagionePredefinita || '' };
      docs['v2_attesa'] = { listaAttesa: listaAttesa || [] };
      docs['v2_tirocinanti'] = { tirocinanti: tirocinanti || [] };
      docs['v2_chiusure'] = { chiusure: chiusure || [] };
      docs['v2_private'] = { pacchetti: lezioniPrivate || [] };
      docs['v2_libero'] = { periodi: nuotoLibero || [] };
      const blocchiArc = {};
      Object.keys(archivioSoci || {}).forEach(k => { const b = hashBlocco(k); (blocchiArc[b] = blocchiArc[b] || {})[k] = archivioSoci[k]; });
      Object.keys(blocchiArc).forEach(b => { docs['v2_arc_' + String(b).padStart(2, '0')] = { archivioSoci: blocchiArc[b] }; });
      Object.keys(tuttiPiani || {}).forEach(nome => {
        const gruppi = {};
        Object.keys(tuttiPiani[nome] || {}).forEach(k => {
          const parti = k.split('-');
          const g = (parti[0] || 'x') + '__' + (parti[1] || 'x');
          (gruppi[g] = gruppi[g] || {})[k] = tuttiPiani[nome][k];
        });
        Object.keys(gruppi).forEach(g => { docs['v2_piano__' + idStagione(nome) + '__' + g] = { stagione: nome, celle: gruppi[g] }; });
      });
      return docs;
    };
    const stateFromDocs = (m) => {
      const meta = m['v2_meta'] || {};
      const tuttiPiani = {};
      (meta.stagioni || []).forEach(st => { tuttiPiani[st] = {}; });
      const archivioSoci = {};
      let listaAttesa = [];
      let tirocinanti = [];
      let chiusure = [];
      let lezioniPrivate = [];
      let nuotoLibero = [];
      Object.keys(m).forEach(id => {
        const d = m[id] || {};
        if (id.startsWith('v2_piano__')) { const n = d.stagione; if (n !== undefined) { tuttiPiani[n] = tuttiPiani[n] || {}; Object.assign(tuttiPiani[n], d.celle || {}); } }
        else if (id.startsWith('v2_arc_')) Object.assign(archivioSoci, d.archivioSoci || {});
        else if (id === 'v2_attesa') listaAttesa = d.listaAttesa || [];
        else if (id === 'v2_tirocinanti') tirocinanti = d.tirocinanti || [];
        else if (id === 'v2_chiusure') chiusure = d.chiusure || [];
        else if (id === 'v2_private') lezioniPrivate = d.pacchetti || [];
        else if (id === 'v2_libero') nuotoLibero = d.periodi || [];
      });
      return { tuttiPiani, stagioni: (meta.stagioni && meta.stagioni.length) ? meta.stagioni : Object.keys(tuttiPiani), stagionePredefinita: meta.stagionePredefinita || '', archivioSoci, listaAttesa, tirocinanti, chiusure, lezioniPrivate, nuotoLibero, updatedAt: meta.updatedAt || null };
    };

    // --- CALENDARIO TIROCINANTI (dati in un documento cloud separato: v2_tirocinanti) ---
    const ORE_TIROCINIO = { 'Assistente bagnanti': 30, 'Istruttore': 70, 'Aiuto Allenatore': 50 };
    const COLORI_TIROCINIO = {
      'Assistente bagnanti': { chip: 'bg-sky-100 text-sky-800 border-sky-200', barra: 'bg-sky-500', badge: 'bg-sky-100 text-sky-800' },
      'Istruttore': { chip: 'bg-emerald-100 text-emerald-800 border-emerald-200', barra: 'bg-emerald-500', badge: 'bg-emerald-100 text-emerald-800' },
      'Aiuto Allenatore': { chip: 'bg-amber-100 text-amber-800 border-amber-200', barra: 'bg-amber-500', badge: 'bg-amber-100 text-amber-800' },
    };
    const fmtOre = (n) => String(Math.round((Number(n) || 0) * 100) / 100).replace('.', ',');
    const MESI_TIRO = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
    const oreFatte = (p) => (p.presenze || []).reduce((t, x) => t + (Number(x.ore) || 0), 0);
    const MAX_CONTEMPORANEI = 2;
    const minDaOra = (t) => { if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
    const oreDaOrari = (ini, fin) => { const a = minDaOra(ini), b = minDaOra(fin); if (a === null || b === null || b <= a) return 0; return Math.round((b - a) / 60 * 100) / 100; };
    // Restituisce l'insieme degli id di presenza coinvolti in un momento con più di 2 persone insieme.
    const trovaConflitti = (elenco) => {
      const perData = {};
      elenco.forEach(p => (p.presenze || []).forEach(x => {
        const a = minDaOra(x.inizio), b = minDaOra(x.fine);
        if (a === null || b === null || b <= a) return;
        (perData[x.data] = perData[x.data] || []).push({ id: x.id, a, b, pid: p.id });
      }));
      const out = new Set();
      Object.keys(perData).forEach(d => {
        const ev = perData[d];
        ev.forEach(e => {
          // controlliamo ogni istante di inizio all'interno dell'intervallo di e
          const punti = [e.a, ...ev.filter(o => o.a > e.a && o.a < e.b).map(o => o.a)];
          punti.forEach(t => {
            const dentro = ev.filter(o => o.a <= t && t < o.b);
            if (new Set(dentro.map(o => o.pid)).size > MAX_CONTEMPORANEI) dentro.forEach(o => out.add(o.id));
          });
        });
      });
      return out;
    };
    const nomeTiro = (p) => `${p.cognome || ''} ${p.nome || ''}`.trim();

    const TirocinantiModal = ({ tirocinanti, setTirocinanti, onClose, mostraToast, numeroPerWhatsapp }) => {
      const oggiYMD = toYMD(new Date());
      const [mese, setMese] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
      const [selId, setSelId] = useState(null);
      const [giorno, setGiorno] = useState(null);
      const [formP, setFormP] = useState(null); // {id?, nome, cognome, attivita}
      const [formTurno, setFormTurno] = useState(null); // {id?, data, personaIds, inizio, fine, nota}
      const [ultimiOrari, setUltimiOrari] = useState({ inizio: '18:00', fine: '19:00' });
      const [tabElenco, setTabElenco] = useState('corso');
      const [vista, setVista] = useState('calendario');
      const [filtroAtt, setFiltroAtt] = useState('');

      const ordinati = useMemo(() => [...tirocinanti].sort((a, b) => nomeTiro(a).localeCompare(nomeTiro(b), 'it')), [tirocinanti]);
      const visibili = ordinati.filter(p => !filtroAtt || p.attivita === filtroAtt);
      const sel = tirocinanti.find(p => p.id === selId) || null;
      const completati = visibili.filter(p => ORE_TIROCINIO[p.attivita] && oreFatte(p) >= ORE_TIROCINIO[p.attivita]);
      const inCorso = visibili.filter(p => !completati.includes(p));
      const elencoMostrato = tabElenco === 'completati' ? completati : inCorso;
      const nCompletatiTot = ordinati.filter(p => ORE_TIROCINIO[p.attivita] && oreFatte(p) >= ORE_TIROCINIO[p.attivita]).length;
      const conflitti = useMemo(() => trovaConflitti(tirocinanti), [tirocinanti]);
      const ultimaData = (p) => (p.presenze || []).reduce((m, x) => x.data > m ? x.data : m, '');

      const perGiorno = useMemo(() => {
        const m = {};
        tirocinanti.forEach(p => {
          if (selId && p.id !== selId) return;
          (p.presenze || []).forEach(x => { (m[x.data] = m[x.data] || []).push({ p, x }); });
        });
        return m;
      }, [tirocinanti, selId]);

      const anno = mese.getFullYear(), mm = mese.getMonth();
      const offset = (new Date(anno, mm, 1).getDay() + 6) % 7;
      const nGiorni = new Date(anno, mm + 1, 0).getDate();
      const celle = [];
      for (let i = 0; i < offset; i++) celle.push(null);
      for (let d = 1; d <= nGiorni; d++) celle.push(toYMD(new Date(anno, mm, d)));
      while (celle.length % 7 !== 0) celle.push(null);

      const salvaPersona = () => {
        const nome = (formP.nome || '').trim(), cognome = (formP.cognome || '').trim();
        if (!nome || !cognome) { mostraToast('Inserisci nome e cognome.', 'error'); return; }
        const cap = (t) => t.replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
        if (formP.id) setTirocinanti(prev => prev.map(p => p.id === formP.id ? { ...p, nome: cap(nome), cognome: cap(cognome), attivita: formP.attivita, telefono: (formP.telefono || '').trim() } : p));
        else {
          const id = 't' + Date.now() + Math.random().toString(36).slice(2, 6);
          setTirocinanti(prev => [...prev, { id, nome: cap(nome), cognome: cap(cognome), attivita: formP.attivita, telefono: (formP.telefono || '').trim(), presenze: [] }]);
          setSelId(id);
        }
        setFormP(null);
      };
      const eliminaPersona = (p) => {
        if (!window.confirm(`Eliminare ${nomeTiro(p)} e tutte le sue ${(p.presenze || []).length} presenze?`)) return;
        setTirocinanti(prev => prev.filter(x => x.id !== p.id));
        if (selId === p.id) setSelId(null);
      };
      const apriTurno = (data, presenza, persona) => {
        if (presenza) setFormTurno({ id: presenza.id, data: presenza.data, personaIds: [persona.id], inizio: presenza.inizio || ultimiOrari.inizio, fine: presenza.fine || ultimiOrari.fine, nota: presenza.nota || '' });
        else setFormTurno({ data: data || giorno || oggiYMD, personaIds: selId && tirocinanti.some(p => p.id === selId) ? [selId] : [], inizio: ultimiOrari.inizio, fine: ultimiOrari.fine, nota: '' });
      };
      const oreForm = formTurno ? oreDaOrari(formTurno.inizio, formTurno.fine) : 0;
      // chi è già impegnato (turno sovrapposto) nella stessa data/orario
      const occupati = useMemo(() => {
        const set = new Set();
        if (!formTurno || !oreForm) return set;
        const a = minDaOra(formTurno.inizio), b = minDaOra(formTurno.fine);
        tirocinanti.forEach(p => (p.presenze || []).forEach(x => {
          if (x.id === formTurno.id || x.data !== formTurno.data) return;
          const xa = minDaOra(x.inizio), xb = minDaOra(x.fine);
          if (xa !== null && xb !== null && xa < b && a < xb) set.add(p.id);
        }));
        return set;
      }, [tirocinanti, formTurno, oreForm]);
      const personeSelezionabili = formTurno && formTurno.id ? ordinati.filter(p => formTurno.personaIds.includes(p.id)) : ordinati.filter(p => !(ORE_TIROCINIO[p.attivita] && oreFatte(p) >= ORE_TIROCINIO[p.attivita]));
      const conflittoForm = useMemo(() => {
        if (!formTurno || !oreForm || !formTurno.personaIds.length) return false;
        const prova = tirocinanti.map(p => {
          const base = (p.presenze || []).filter(x => x.id !== formTurno.id);
          return formTurno.personaIds.includes(p.id) ? { ...p, presenze: [...base, { id: '__n' + p.id, data: formTurno.data, inizio: formTurno.inizio, fine: formTurno.fine }] } : { ...p, presenze: base };
        });
        const c = trovaConflitti(prova);
        return formTurno.personaIds.some(id => c.has('__n' + id));
      }, [tirocinanti, formTurno, oreForm]);
      const salvaTurno = () => {
        if (!formTurno.data) { mostraToast('Scegli la data.', 'error'); return; }
        if (!formTurno.personaIds.length) { mostraToast('Seleziona almeno un tirocinante.', 'error'); return; }
        if (!oreForm) { mostraToast("L'orario di fine deve essere dopo quello di inizio.", 'error'); return; }
        const base = { data: formTurno.data, inizio: formTurno.inizio, fine: formTurno.fine, ore: oreForm, nota: (formTurno.nota || '').trim() };
        if (formTurno.id) {
          setTirocinanti(prev => prev.map(p => p.id === formTurno.personaIds[0] ? { ...p, presenze: (p.presenze || []).map(x => x.id === formTurno.id ? { ...base, id: x.id } : x) } : p));
        } else {
          setTirocinanti(prev => prev.map(p => formTurno.personaIds.includes(p.id) ? { ...p, presenze: [...(p.presenze || []), { ...base, id: 'p' + Date.now() + Math.random().toString(36).slice(2, 5) }] } : p));
        }
        setUltimiOrari({ inizio: formTurno.inizio, fine: formTurno.fine });
        setGiorno(formTurno.data);
        const [y, m] = formTurno.data.split('-').map(Number); setMese(new Date(y, m - 1, 1));
        mostraToast(formTurno.id ? 'Turno aggiornato.' : `Turno aggiunto (${formTurno.personaIds.length} ${formTurno.personaIds.length === 1 ? 'persona' : 'persone'}, ${fmtOre(oreForm)} h ciascuna).`);
        setFormTurno(null);
      };
      const aggiungiAFine = (minuti) => {
        const a = minDaOra(formTurno.inizio); if (a === null) return;
        const b = Math.min(a + minuti, 23 * 60 + 59);
        setFormTurno(f => ({ ...f, fine: String(Math.floor(b / 60)).padStart(2, '0') + ':' + String(b % 60).padStart(2, '0') }));
      };
      const togglePersonaTurno = (id) => setFormTurno(f => ({ ...f, personaIds: f.personaIds.includes(id) ? f.personaIds.filter(x => x !== id) : [...f.personaIds, id] }));
      const eliminaPresenza = (pid, xid) => setTirocinanti(prev => prev.map(p => p.id === pid ? { ...p, presenze: (p.presenze || []).filter(x => x.id !== xid) } : p));

      const scarica = () => {
        const dati = JSON.stringify({ formato: 'pianovasca-tirocinanti-v1', esportatoIl: new Date().toISOString(), tirocinanti }, null, 2);
        const url = URL.createObjectURL(new Blob([dati], { type: 'application/json' }));
        const a = document.createElement('a'); a.href = url; a.download = `tirocinanti_${toYMD(new Date())}.json`; a.click();
        URL.revokeObjectURL(url);
        mostraToast(`File tirocinanti scaricato (${tirocinanti.length} persone).`);
      };
      const apriGiorno = (g) => { setGiorno(g); };
      const dellGiorno = giorno ? (perGiorno[giorno] || []) : [];
      const fmtGiornoLungo = (g) => { const d = new Date(g + 'T00:00:00'); return d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-xl w-full max-w-6xl overflow-hidden flex flex-col h-[85vh] max-h-[800px]" onClick={e => e.stopPropagation()}>
            <div className="px-2 pt-2 flex flex-col bg-[#1e3a5f] text-white">
              <div className="flex justify-between items-center px-3 pb-3 pt-1 mb-1 border-b border-white/20">
                <h3 className="font-bold text-xl flex items-center gap-2"><CalendarIcon size={24}/> Tirocinanti</h3>
                <div className="flex items-center gap-2">
                  <button onClick={scarica} className="flex items-center gap-1.5 px-3 py-1.5 bg-white/15 hover:bg-white/25 rounded-md text-sm font-semibold" title="Scarica un file separato con solo i tirocinanti"><DownloadIcon size={15}/> Scarica file</button>
                  <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full transition-colors ml-1"><XIcon size={22}/></button>
                </div>
              </div>
              <div className="flex">
                {[['calendario', 'Calendario', null], ['tirocinanti', 'Tirocinanti', tirocinanti.length]].map(([id, label, n]) => (
                  <button key={id} onClick={() => setVista(id)} className={`flex-1 py-2.5 text-sm font-bold transition-all border-b-4 border-transparent leading-tight ${vista === id ? 'bg-white/20' : 'opacity-80 hover:bg-white/5'}`}>{label}{n !== null && <span className="ml-1.5 bg-white/25 text-[11px] px-1.5 py-0.5 rounded-full">{n}</span>}</button>
                ))}
              </div>
            </div>
            {vista === 'calendario' ? (
              <div className="flex-1 flex flex-col min-w-0 min-h-0 bg-white">
                <div className="flex flex-wrap items-center justify-between gap-2 px-4 py-2.5 border-b border-slate-200">
                  <div className="flex items-center gap-2">
                    <button onClick={() => setMese(new Date(anno, mm - 1, 1))} className="p-1.5 rounded-md hover:bg-slate-100"><ChevronLeftIcon size={18}/></button>
                    <div className="font-bold text-lg text-slate-800 w-44 text-center">{MESI_TIRO[mm]} {anno}</div>
                    <button onClick={() => setMese(new Date(anno, mm + 1, 1))} className="p-1.5 rounded-md hover:bg-slate-100"><ChevronRightIcon size={18}/></button>
                    <button onClick={() => { const d = new Date(); setMese(new Date(d.getFullYear(), d.getMonth(), 1)); }} className="ml-1 px-2.5 py-1 text-xs font-semibold border border-slate-300 rounded-md hover:bg-slate-100">Oggi</button>
                  </div>
                  <div className="flex items-center gap-2">
                    <select value={selId || ''} onChange={e => setSelId(e.target.value || null)} className="px-2 py-1.5 border border-slate-300 rounded-md text-sm bg-white max-w-[260px]">
                      <option value="">Tutti i tirocinanti</option>
                      {ordinati.map(p => <option key={p.id} value={p.id}>{nomeTiro(p)} — {p.attivita}</option>)}
                    </select>
                    <button onClick={() => apriTurno(giorno)} disabled={tirocinanti.length === 0} className="flex items-center gap-1.5 px-3 py-1.5 bg-teal-600 hover:bg-teal-700 disabled:opacity-40 text-white rounded-md text-sm font-bold"><PlusIcon size={14}/> Aggiungi turno</button>
                  </div>
                </div>
                <div className="flex-1 overflow-auto p-3">
                  <div className="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-500 mb-1">
                    {['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(g => <div key={g}>{g}</div>)}
                  </div>
                  <div className="grid grid-cols-7 gap-1">
                    {celle.map((g, i) => {
                      if (!g) return <div key={i} className="min-h-[78px] rounded-md bg-slate-50/50"></div>;
                      const voci = perGiorno[g] || [];
                      const isOggi = g === oggiYMD, isSel = g === giorno;
                      return (
                        <div key={i} onClick={() => apriTurno(g)} title="Clicca per aggiungere un turno in questo giorno" className={`min-h-[78px] rounded-md border p-1 cursor-pointer transition-colors ${isSel ? 'border-[#1e3a5f] ring-2 ring-[#1e3a5f]/30 bg-blue-50' : isOggi ? 'border-teal-400 bg-teal-50' : 'border-slate-200 bg-white hover:bg-slate-50'}`}>
                          <div className={`text-xs font-bold flex justify-between ${isOggi ? 'text-teal-700' : 'text-slate-500'}`}><span>{parseInt(g.slice(8), 10)}</span>{voci.some(v => conflitti.has(v.x.id)) && <span className="text-red-600" title="Più di 2 persone nello stesso orario">⚠</span>}</div>
                          <div className="space-y-0.5 mt-0.5">
                            {voci.map(({ p, x }) => (
                              <div key={x.id} onClick={e => { e.stopPropagation(); apriTurno(x.data, x, p); }} className={`cursor-pointer hover:brightness-95 text-[10px] leading-tight px-1 py-0.5 rounded border truncate ${conflitti.has(x.id) ? 'bg-red-100 text-red-800 border-red-400 font-bold' : (COLORI_TIROCINIO[p.attivita] || COLORI_TIROCINIO['Istruttore']).chip}`} title={`${nomeTiro(p)} · ${x.inizio ? x.inizio + '–' + x.fine + ' · ' : ''}${fmtOre(x.ore)} h${conflitti.has(x.id) ? ' · ATTENZIONE: più di 2 persone insieme' : ''}`}>{conflitti.has(x.id) ? '⚠ ' : ''}{p.cognome} {(p.nome || '').charAt(0)}. · {x.inizio ? x.inizio + '–' + x.fine : fmtOre(x.ore) + 'h'}</div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            ) : (
              <div className="flex-1 flex flex-col min-h-0 bg-slate-50">
                <div className="flex flex-wrap items-center justify-between gap-2 px-5 py-3 bg-white border-b border-slate-200">
                  <div className="flex items-center gap-2">
                    <button onClick={() => setTabElenco('corso')} className={`px-3 py-1.5 rounded-md text-sm font-bold ${tabElenco === 'corso' ? 'bg-[#1e3a5f] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>In corso ({inCorso.length})</button>
                    <button onClick={() => setTabElenco('completati')} className={`px-3 py-1.5 rounded-md text-sm font-bold ${tabElenco === 'completati' ? 'bg-green-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Completati ({completati.length})</button>
                    <select value={filtroAtt} onChange={e => setFiltroAtt(e.target.value)} className="ml-2 px-2 py-1.5 border border-slate-300 rounded-md text-sm bg-white">
                      <option value="">Tutte le attività</option>
                      {Object.keys(ORE_TIROCINIO).map(a => <option key={a} value={a}>{a} ({ORE_TIROCINIO[a]} ore)</option>)}
                    </select>
                  </div>
                  <button onClick={() => setFormP({ nome: '', cognome: '', attivita: 'Assistente bagnanti', telefono: '' })} className="flex items-center gap-2 px-3 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-md text-sm font-bold"><PlusIcon size={16}/> Nuovo tirocinante</button>
                </div>
                <div className="flex-1 overflow-y-auto p-5">
                  {elencoMostrato.length === 0 ? (
                    <div className="p-8 text-center text-slate-400">{tabElenco === 'completati' ? 'Nessun tirocinio ancora completato.' : (tirocinanti.length === 0 ? 'Nessun tirocinante. Aggiungine uno con il tasto in alto a destra.' : (nCompletatiTot && !inCorso.length ? 'Tutti i tirocinanti hanno completato le ore.' : 'Nessun tirocinante per questa attività.'))}</div>
                  ) : (
                    <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
                      <div className="grid grid-cols-[1.6fr_1.2fr_1.3fr_2fr_1fr_auto] gap-3 px-4 py-2.5 bg-slate-50 border-b border-slate-200 text-sm font-semibold text-slate-600">
                        <div>Cognome e Nome</div><div>Attività</div><div>Telefono</div><div>Ore svolte</div><div>Ultimo turno</div><div className="w-36 text-right">Azioni</div>
                      </div>
                      {elencoMostrato.map(p => {
                        const tot = oreFatte(p), target = ORE_TIROCINIO[p.attivita] || 0;
                        const pct = target ? Math.min(100, Math.round(tot / target * 100)) : 0;
                        const fatto = target && tot >= target;
                        const col = COLORI_TIROCINIO[p.attivita] || COLORI_TIROCINIO['Istruttore'];
                        const ult = ultimaData(p);
                        return (
                          <div key={p.id} className="grid grid-cols-[1.6fr_1.2fr_1.3fr_2fr_1fr_auto] gap-3 px-4 py-3 items-center border-b border-slate-100 last:border-0 hover:bg-slate-50">
                            <div className="font-bold text-slate-800 truncate">{nomeTiro(p)}</div>
                            <div><span className={`inline-block px-2 py-0.5 rounded text-xs font-semibold ${col.badge}`}>{p.attivita}</span></div>
                            <div className="text-sm text-slate-600 truncate">{p.telefono || <span className="text-slate-300">—</span>}</div>
                            <div>
                              <div className="h-2 bg-slate-200 rounded-full overflow-hidden"><div className={`h-full ${fatto ? 'bg-green-500' : col.barra}`} style={{ width: pct + '%' }}></div></div>
                              <div className="mt-1 flex justify-between text-xs"><span className="font-semibold text-slate-700">{fmtOre(tot)} / {target} ore</span>{fatto ? <span className="font-bold text-green-600">Completato ✓</span> : <span className="text-slate-500">mancano {fmtOre(target - tot)} h</span>}</div>
                            </div>
                            <div className="text-sm text-slate-600">{ult ? ult.split('-').reverse().join('/') : '—'}</div>
                            <div className="w-36 flex items-center justify-end gap-1">
                              {(() => { const num = numeroPerWhatsapp(p.telefono); return num
                                ? <a href={`whatsapp://send?phone=${num}`} title="Apri chat WhatsApp" className="text-[#25D366] hover:text-[#1ebe57] p-1.5 bg-green-50 hover:bg-green-100 rounded-md"><WhatsAppIcon size={15}/></a>
                                : <span title="Numero di telefono mancante: aggiungilo con Modifica" className="text-slate-300 p-1.5 bg-slate-100 rounded-md cursor-not-allowed"><WhatsAppIcon size={15}/></span>; })()}
                              <button onClick={() => { setSelId(p.id); setVista('calendario'); }} className="p-1.5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-600" title="Vedi i turni nel calendario"><CalendarIcon size={15}/></button>
                              <button onClick={() => setFormP({ id: p.id, nome: p.nome, cognome: p.cognome, attivita: p.attivita, telefono: p.telefono || '' })} className="p-1.5 rounded-md bg-blue-50 hover:bg-blue-100 text-blue-600" title="Modifica anagrafica"><EditIcon size={15}/></button>
                              <button onClick={() => eliminaPersona(p)} className="p-1.5 rounded-md bg-red-50 hover:bg-red-100 text-red-600" title="Elimina"><XIcon size={15}/></button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            )}
            {/* FORM TURNO */}
            {formTurno && (
              <div className="fixed inset-0 z-[60] bg-slate-900/40 flex items-center justify-center p-4" onClick={() => setFormTurno(null)}>
                <div className="bg-white rounded-xl shadow-xl w-full max-w-xl overflow-hidden flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                  <div className="px-5 py-3 bg-[#1e3a5f] text-white font-bold flex justify-between items-center">{formTurno.id ? 'Modifica turno' : 'Aggiungi turno'}<button onClick={() => setFormTurno(null)}><XIcon size={18}/></button></div>
                  <div className="p-5 space-y-4 overflow-y-auto">
                    <div className="grid grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">Data</label>
                        <input type="date" value={formTurno.data} onChange={e => setFormTurno({ ...formTurno, data: e.target.value })} className="w-full px-2 py-2 border border-slate-300 rounded-md text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">Inizio</label>
                        <input type="time" step="900" value={formTurno.inizio} onChange={e => setFormTurno({ ...formTurno, inizio: e.target.value })} className="w-full px-2 py-2 border border-slate-300 rounded-md text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">Fine</label>
                        <input type="time" step="900" value={formTurno.fine} onChange={e => setFormTurno({ ...formTurno, fine: e.target.value })} className="w-full px-2 py-2 border border-slate-300 rounded-md text-sm" />
                      </div>
                    </div>
                    <div className="flex flex-wrap items-center gap-1.5 text-xs">
                      <span className="text-slate-500 font-semibold">Durata rapida:</span>
                      {[[60, '1 h'], [90, '1,5 h'], [120, '2 h'], [180, '3 h']].map(([m, l]) => (
                        <button key={m} onClick={() => aggiungiAFine(m)} className="px-2.5 py-1 bg-white border border-slate-300 hover:border-[#1e3a5f] rounded-full font-semibold text-slate-700">{l}</button>
                      ))}
                      <span className="ml-auto px-3 py-1 rounded-md bg-blue-50 text-[#1e3a5f] font-bold text-sm">{oreForm ? `${fmtOre(oreForm)} ore` : 'Orario non valido'}</span>
                    </div>
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-xs font-semibold text-slate-500">{formTurno.id ? 'Tirocinante' : 'Tirocinanti disponibili'} {!formTurno.id && <span className="font-normal">(puoi sceglierne più di uno)</span>}</label>
                        {!formTurno.id && personeSelezionabili.length > 0 && <button className="text-xs underline text-slate-500" onClick={() => setFormTurno(f => ({ ...f, personaIds: f.personaIds.length ? [] : personeSelezionabili.filter(p => !occupati.has(p.id)).map(p => p.id) }))}>{formTurno.personaIds.length ? 'Deseleziona' : 'Seleziona tutti'}</button>}
                      </div>
                      <div className="border border-slate-200 rounded-md max-h-52 overflow-y-auto divide-y divide-slate-100">
                        {personeSelezionabili.length === 0 && <p className="p-3 text-sm text-slate-400">Nessun tirocinante disponibile: aggiungine uno o controlla i completati.</p>}
                        {personeSelezionabili.map(p => {
                          const occ = occupati.has(p.id) && !formTurno.id;
                          const on = formTurno.personaIds.includes(p.id);
                          const col = COLORI_TIROCINIO[p.attivita] || COLORI_TIROCINIO['Istruttore'];
                          return (
                            <label key={p.id} className={`flex items-center gap-2.5 px-3 py-2 text-sm ${occ ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:bg-slate-50'} ${on ? 'bg-blue-50' : ''}`}>
                              <input type="checkbox" checked={on} disabled={occ || !!formTurno.id} onChange={() => togglePersonaTurno(p.id)} className="w-4 h-4" />
                              <span className="font-semibold text-slate-800">{nomeTiro(p)}</span>
                              <span className={`px-1.5 py-0.5 rounded text-[11px] font-semibold ${col.badge}`}>{p.attivita}</span>
                              <span className="ml-auto text-xs text-slate-500">{occ ? 'già in turno a quell\'ora' : `${fmtOre(oreFatte(p))}/${ORE_TIROCINIO[p.attivita]} h`}</span>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Nota (facoltativa)</label>
                      <input type="text" value={formTurno.nota} onChange={e => setFormTurno({ ...formTurno, nota: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-md text-sm" placeholder="es. corso adulti" />
                    </div>
                    {conflittoForm && <div className="px-3 py-2 bg-red-50 border border-red-300 text-red-700 rounded-md text-sm font-bold">⚠ In questo orario ci sarebbero più di {MAX_CONTEMPORANEI} tirocinanti insieme. Puoi salvare comunque, ma il turno sarà segnalato.</div>}
                  </div>
                  <div className="px-5 py-3 bg-slate-50 border-t flex justify-end gap-2">
                    {formTurno.id && <button onClick={() => { if (window.confirm('Eliminare questo turno?')) { eliminaPresenza(formTurno.personaIds[0], formTurno.id); setFormTurno(null); } }} className="mr-auto px-4 py-2 text-sm font-bold text-red-600 hover:bg-red-50 rounded-md">Elimina turno</button>}
                    <button onClick={() => setFormTurno(null)} className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-md">Annulla</button>
                    <button onClick={salvaTurno} className="px-4 py-2 text-sm font-bold bg-teal-600 hover:bg-teal-700 text-white rounded-md">Salva turno</button>
                  </div>
                </div>
              </div>
            )}
            {/* FORM TIROCINANTE */}
            {formP && (
              <div className="fixed inset-0 z-[60] bg-slate-900/40 flex items-center justify-center p-4" onClick={() => setFormP(null)}>
                <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden" onClick={e => e.stopPropagation()}>
                  <div className="px-5 py-3 bg-[#1e3a5f] text-white font-bold flex justify-between items-center">{formP.id ? 'Modifica tirocinante' : 'Nuovo tirocinante'}<button onClick={() => setFormP(null)}><XIcon size={18}/></button></div>
                  <div className="p-5 space-y-3">
                    <div className="grid grid-cols-2 gap-3">
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Nome</label><input autoFocus type="text" value={formP.nome} onChange={e => setFormP({ ...formP, nome: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-md text-sm" /></div>
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Cognome</label><input type="text" value={formP.cognome} onChange={e => setFormP({ ...formP, cognome: e.target.value })} onKeyDown={e => { if (e.key === 'Enter') salvaPersona(); }} className="w-full px-3 py-2 border border-slate-300 rounded-md text-sm" /></div>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Attività</label>
                      <select value={formP.attivita} onChange={e => setFormP({ ...formP, attivita: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-md text-sm bg-white">
                        {Object.keys(ORE_TIROCINIO).map(a => <option key={a} value={a}>{a} — {ORE_TIROCINIO[a]} ore</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Telefono (per WhatsApp)</label>
                      <input type="tel" value={formP.telefono || ''} onChange={e => setFormP({ ...formP, telefono: e.target.value })} onKeyDown={e => { if (e.key === 'Enter') salvaPersona(); }} placeholder="es. 333 1234567" className="w-full px-3 py-2 border border-slate-300 rounded-md text-sm" />
                    </div>
                  </div>
                  <div className="px-5 py-3 bg-slate-50 border-t flex justify-end gap-2">
                    <button onClick={() => setFormP(null)} className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-md">Annulla</button>
                    <button onClick={salvaPersona} className="px-4 py-2 text-sm font-bold bg-teal-600 hover:bg-teal-700 text-white rounded-md">Salva</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- CHIUSURE DELLA VASCA E AVVISI AGLI ISCRITTI (documento cloud dedicato: chiusure_v1) ---
    const attivoInData = (p, ymd) => {
      let lista = [];
      if (p.iscrizioni && p.iscrizioni.length > 0) lista = p.iscrizioni.filter(i => i.inizio || i.fine);
      else if (p.scadIscrizione) lista = [{ inizio: '', fine: p.scadIscrizione }];
      if (lista.length === 0) return true;
      return lista.some(i => (!i.inizio || i.inizio <= ymd) && (!i.fine || i.fine >= ymd));
    };
    const MOTIVI_CHIUSURA = ['Festività', 'Vacanze', 'Manutenzione', 'Lavori', 'Evento / gara'];
    const TEMPLATE_CHIUSURA = "Ciao {nome}, ti informiamo che {lezioni} {verbo} per {motivo}.\n\nCi scusiamo per il disagio e ti aspettiamo alla prossima lezione! 🏊\nCentro Federale Lampugnano";
    // Chiusure già previste dal calendario della scuola nuoto (festività, vacanze): messaggio senza scuse.
    const TEMPLATE_CALENDARIO = "Ciao {nome}, ti ricordiamo che {lezioni} {verbo} per {motivo}, così come previsto da calendario corsi.\n\nTi aspettiamo alla prossima lezione! 🏊\nCentro Federale Lampugnano";
    const chiusuraDaCalendario = (motivo) => /festiv|festa|ponte|vacanz|natale|pasqua|calendario/i.test(motivo || '');
    const templateChiusura = (c) => c.messaggio || (chiusuraDaCalendario(c.motivo) ? TEMPLATE_CALENDARIO : TEMPLATE_CHIUSURA);
    const fmtCorta = (ymd) => { const [, m, d] = String(ymd).split('-'); return `${d}/${m}`; };
    const VASCHE_CHIUSURA = { tutte: 'Tutte le vasche', interna: 'Vasca interna', esterna: 'Vasca esterna' };
    const BanIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></Icon>;

    // Hook generico: tiene sincronizzato con un documento cloud tutto suo un elenco (lettura live + salvataggio con attesa).
    const useDocDedicato = (docId, valore, setValore, user, fi, mostraToast) => {
      const [caricato, setCaricato] = useState(false);
      const [retry, setRetry] = useState(0);
      const ultimoSalvato = useRef(null);
      const inAttesa = useRef(false);
      const valoreRef = useRef(valore); valoreRef.current = valore;
      useEffect(() => {
        if (!user || !fi) return;
        const { db, appId, doc, onSnapshot } = fi;
        const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'datiPianoVasca', docId);
        const unsub = onSnapshot(ref, (snap) => {
          if (snap.metadata.hasPendingWrites) return;
          if (snap.exists()) {
            const lista = snap.data().dati || [];
            if (!inAttesa.current) { ultimoSalvato.current = JSON.stringify(lista); setValore(lista); }
          } else if (!inAttesa.current) { ultimoSalvato.current = JSON.stringify([]); }
          setCaricato(true);
        }, (err) => { console.error('Errore lettura ' + docId + ':', err); });
        return () => unsub();
      }, [user, fi]);
      useEffect(() => {
        if (!caricato || !user || !fi) return;
        const str = JSON.stringify(valore);
        if (str === ultimoSalvato.current) return;
        inAttesa.current = true;
        const timer = setTimeout(async () => {
          try {
            const { db, appId, doc, setDoc } = fi;
            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'datiPianoVasca', docId), { dati: JSON.parse(str), updatedAt: new Date().toISOString() });
            ultimoSalvato.current = str;
            if (JSON.stringify(valoreRef.current) === str) inAttesa.current = false;
          } catch (err) { console.error('Salvataggio ' + docId + ' non riuscito:', err); mostraToast('Salvataggio non riuscito: riprovo.', 'error'); setRetry(n => n + 1); }
        }, 700);
        return () => clearTimeout(timer);
      }, [valore, caricato, retry, user, fi]);
      return { inAttesa };
    };

    // --- Brevo: funzioni condivise (stessa configurazione di "Scrivi al corso") ---
    const brevoPiede = (cfg, numeroPerWhatsapp) => {
      cfg = cfg || {};
      const emailContatto = cfg.emailContatto !== undefined ? String(cfg.emailContatto).trim() : 'cflampugnano@federnuoto.it';
      const v = String(cfg.whatsapp !== undefined ? cfg.whatsapp : 'https://wa.me/message/SIT75DBXZR2EF1').trim();
      const link = !v ? '' : /^https?:\/\//i.test(v) ? v : (numeroPerWhatsapp(v) ? 'https://wa.me/' + numeroPerWhatsapp(v) : '');
      return '\n\n—\nQuesto è un messaggio automatico: ti preghiamo di non rispondere a questo indirizzo.\n'
        + (link && emailContatto ? 'Per contattarci scrivici su WhatsApp: ' + link + '\noppure via email a ' + emailContatto
          : link ? 'Per contattarci scrivici su WhatsApp: ' + link
          : emailContatto ? 'Per contattarci scrivi a ' + emailContatto : '');
    };
    const brevoInvia = async (cfg, { a, nomeA, oggetto, testoMail }) => {
      let r;
      try {
        r = await fetch('https://api.brevo.com/v3/smtp/email', {
          method: 'POST',
          headers: { accept: 'application/json', 'content-type': 'application/json', 'api-key': String(cfg.apiKey || '').trim() },
          body: JSON.stringify({
            sender: { name: cfg.mittenteNome || undefined, email: String(cfg.mittenteEmail || '').trim() },
            to: [{ email: a, name: nomeA || undefined }],
            replyTo: cfg.replyTo ? { email: String(cfg.replyTo).trim() } : undefined,
            subject: oggetto, textContent: testoMail
          })
        });
      } catch (e) { const er = new Error('Connessione a Brevo non riuscita (rete assente o richiesta bloccata dal browser).'); er.fatale = true; throw er; }
      if (!r.ok) {
        let m = ''; try { const j = await r.json(); m = j.message || ''; } catch (e) {}
        const er = new Error(`Brevo ha risposto ${r.status}${m ? ': ' + m : ''}`);
        if (r.status === 401 || r.status === 403) { er.message += ' — controlla la chiave; se è giusta, in Brevo apri Sicurezza → Indirizzi IP autorizzati e disattiva il blocco.'; er.fatale = true; }
        throw er;
      }
    };

    const ChiusureModal = ({ chiusure, setChiusure, corsiColpiti, numeroPerWhatsapp, soloNomeProprio, mostraToast, brevoCfg, setBrevoCfg, iniziale, onClose }) => {
      const oggiYMD = toYMD(new Date());
      const [vista, setVista] = useState(iniziale && iniziale.id ? 'avvisi' : 'elenco');
      const [selId, setSelId] = useState(iniziale && iniziale.id ? iniziale.id : null);
      const [formC, setFormC] = useState(null);
      const [soloDaAvvisare, setSoloDaAvvisare] = useState(false);
      const ordinate = useMemo(() => [...chiusure].sort((a, b) => a.dal.localeCompare(b.dal)), [chiusure]);
      const prossime = ordinate.filter(c => c.al >= oggiYMD), passate = ordinate.filter(c => c.al < oggiYMD).reverse();
      const colpite = useMemo(() => { const m = {}; chiusure.forEach(c => { m[c.id] = corsiColpiti(c); }); return m; }, [chiusure, corsiColpiti]);
      const sel = chiusure.find(c => c.id === selId) || null;

      const salvaChiusura = () => {
        if (!formC.dal) { mostraToast('Indica la data di inizio.', 'error'); return; }
        const al = formC.al || formC.dal;
        if (al < formC.dal) { mostraToast('La data di fine è prima di quella di inizio.', 'error'); return; }
        const dati = { dal: formC.dal, al, vasca: formC.vasca, motivo: (formC.motivo || '').trim() };
        if (formC.id) setChiusure(prev => prev.map(c => c.id === formC.id ? { ...c, ...dati } : c));
        else { const id = 'c' + Date.now() + Math.random().toString(36).slice(2, 5); setChiusure(prev => [...prev, { id, ...dati, avvisati: {} }]); }
        setFormC(null);
      };
      const eliminaChiusura = (c) => {
        if (!window.confirm(`Eliminare la chiusura dal ${formatDate(c.dal)} al ${formatDate(c.al)}?`)) return;
        setChiusure(prev => prev.filter(x => x.id !== c.id));
        if (selId === c.id) { setSelId(null); setVista('elenco'); }
      };
      const motivoTesto = (c) => (c.motivo || '').trim() ? c.motivo.trim().toLowerCase() : 'la chiusura della vasca';
      const costruisciMessaggio = (c, persona) => {
        const tpl = templateChiusura(c);
        const plur = persona.lezioni.length > 1;
        const unisci = (v) => v.length <= 1 ? (v[0] || '') : v.slice(0, -1).join(', ') + ' e ' + v[v.length - 1];
        const perCorso = {};
        persona.lezioni.forEach(l => { (perCorso[l.nomeCorso] = perCorso[l.nomeCorso] || []).push(`${GIORNI[l.giorno].toLowerCase()} ${fmtCorta(l.ymd)} alle ${l.ora}`); });
        const elenco = Object.keys(perCorso).map(nc => `${nc} di ${unisci(perCorso[nc])}`).join('; ');
        return tpl.split('{nome}').join(soloNomeProprio(persona.nome)).split('{lezioni}').join(`${plur ? 'le lezioni' : 'la lezione'} di ${elenco}`).split('{verbo}').join(plur ? 'non si terranno' : 'non si terrà').split('{motivo}').join(motivoTesto(c));
      };
      const segna = (c, key, valore) => setChiusure(prev => prev.map(x => x.id === c.id ? { ...x, avvisati: { ...(x.avvisati || {}), [key]: valore } } : x));
      const cambiaMessaggio = (c, testo) => setChiusure(prev => prev.map(x => x.id === c.id ? { ...x, messaggio: testo } : x));
      const copia = (testo) => { try { navigator.clipboard.writeText(testo); mostraToast('Messaggio copiato.'); } catch (e) { mostraToast('Copia non riuscita.', 'error'); } };
      const cambiaOggetto = (c, v) => setChiusure(prev => prev.map(x => x.id === c.id ? { ...x, oggetto: v } : x));
      const oggettoDefault = (c) => 'Centro Federale Lampugnano - ' + ((c.motivo || '').trim() ? c.motivo.trim().charAt(0).toUpperCase() + c.motivo.trim().slice(1) : 'Chiusura vasca') + (c.al === c.dal ? ' del ' + formatDate(c.dal) : ' dal ' + formatDate(c.dal) + ' al ' + formatDate(c.al));
      const oggettoDi = (c) => (c.oggetto !== undefined && String(c.oggetto).trim()) ? String(c.oggetto).trim() : oggettoDefault(c);
      const cfgB = brevoCfg || {};
      const emailOk = (e) => /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(String(e || '').trim());
      const [mostraKey, setMostraKey] = useState(false);
      const [invioE, setInvioE] = useState({ attivo: false, fatti: 0, tot: 0, errori: [], fine: false });
      const inviaEmailChiusura = async (c, persone) => {
        if (!cfgB.apiKey || !cfgB.mittenteEmail) { setMostraKey(true); mostraToast('Inserisci prima la chiave di Brevo.', 'error'); return; }
        // una email per ogni persona, anche se più persone condividono lo stesso indirizzo
        const lista = persone.filter(p => emailOk(p.email) && !(c.avvisati || {})[p.key]).map(p => ({ email: p.email.trim().toLowerCase(), persone: [p] }));
        if (lista.length === 0) return;
        if (!window.confirm(`Inviare ${lista.length} email singole da ${cfgB.mittenteEmail}?\n\nOggetto: ${oggettoDi(c)}`)) return;
        const piede = brevoPiede(cfgB, numeroPerWhatsapp);
        const ok = []; const errori = []; let fatti = 0;
        setInvioE({ attivo: true, fatti: 0, tot: lista.length, errori: [], fine: false });
        for (const d of lista) {
          const p = d.persone[0];
          try {
            await brevoInvia(cfgB, { a: d.email, nomeA: p.nome, oggetto: oggettoDi(c), testoMail: costruisciMessaggio(c, p) + piede });
            d.persone.forEach(x => ok.push(x.key)); fatti++;
          } catch (e) { errori.push({ nome: p.nome, email: d.email, msg: e.message }); if (e.fatale) break; }
          setInvioE({ attivo: true, fatti, tot: lista.length, errori: [...errori], fine: false });
          await new Promise(r => setTimeout(r, 250));
        }
        if (ok.length) setChiusure(prev => prev.map(x => x.id === c.id ? { ...x, avvisati: { ...(x.avvisati || {}), ...Object.fromEntries(ok.map(k => [k, true])) } } : x));
        setInvioE({ attivo: false, fatti, tot: lista.length, errori, fine: true });
        mostraToast(errori.length ? `Inviate ${fatti} email su ${lista.length}: ${errori.length} non riuscite.` : `Inviate ${fatti} email.`, errori.length ? 'error' : 'success');
      };

      const intestazione = (c) => (
        <div className="min-w-0">
          <div className="font-bold text-slate-800">{c.al === c.dal ? formatDate(c.dal) : `Dal ${formatDate(c.dal)} al ${formatDate(c.al)}`}</div>
          <div className="mt-0.5 flex flex-wrap items-center gap-2 text-xs">
            <span className="px-1.5 py-0.5 rounded font-semibold bg-slate-100 text-slate-600 border border-slate-200">{VASCHE_CHIUSURA[c.vasca]}</span>
            {c.motivo ? <span className="font-semibold text-amber-700">{c.motivo}</span> : <span className="text-slate-400">nessun motivo indicato</span>}
          </div>
        </div>
      );

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-xl w-full max-w-6xl overflow-hidden flex flex-col h-[85vh] max-h-[800px]" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center px-5 py-3 bg-[#1e3a5f] text-white">
              <h3 className="font-bold text-xl flex items-center gap-2"><BanIcon size={24}/> {vista === 'avvisi' && sel ? 'Avvisa gli iscritti' : 'Chiusure della vasca'}</h3>
              <div className="flex items-center gap-2">
                {vista === 'avvisi' && <button onClick={() => setVista('elenco')} className="px-3 py-1.5 bg-white/15 hover:bg-white/25 rounded-md text-sm font-semibold">← Tutte le chiusure</button>}
                <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full transition-colors ml-1"><XIcon size={22}/></button>
              </div>
            </div>

            {vista === 'elenco' && (
              <div className="flex-1 flex flex-col min-h-0 bg-slate-50">
                <div className="flex items-center justify-between px-5 py-3 bg-white border-b border-slate-200">
                  <p className="text-sm text-slate-500">Registra festività, manutenzioni o lavori: il sito calcola chi va avvisato e prepara il messaggio.</p>
                  <button onClick={() => setFormC({ dal: oggiYMD, al: '', vasca: 'tutte', motivo: '' })} className="flex items-center gap-2 px-3 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-md text-sm font-bold shrink-0"><PlusIcon size={16}/> Nuova chiusura</button>
                </div>
                <div className="flex-1 overflow-y-auto p-5 space-y-5">
                  {chiusure.length === 0 && <div className="p-8 text-center text-slate-400">Nessuna chiusura registrata.</div>}
                  {[['Prossime e in corso', prossime, false], ['Passate', passate, true]].map(([titolo, lista, passata]) => lista.length > 0 && (
                    <div key={titolo}>
                      <div className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">{titolo}</div>
                      <div className="bg-white border border-slate-200 rounded-xl divide-y divide-slate-100 overflow-hidden">
                        {lista.map(c => {
                          const k = colpite[c.id] || { lezioni: [], persone: [] };
                          const avvisate = k.persone.filter(p => (c.avvisati || {})[p.key]).length;
                          const tutte = k.persone.length > 0 && avvisate === k.persone.length;
                          return (
                            <div key={c.id} className={`px-4 py-3 flex items-center gap-4 ${passata ? 'opacity-60' : ''}`}>
                              <div className="flex-1 min-w-0">{intestazione(c)}</div>
                              <div className="text-sm text-slate-600 text-right shrink-0">
                                <div><b>{k.lezioni.length}</b> {k.lezioni.length === 1 ? 'lezione coinvolta' : 'lezioni coinvolte'}</div>
                                <div className={tutte ? 'text-green-600 font-bold' : ''}>{k.persone.length === 0 ? 'nessuno da avvisare' : tutte ? 'Tutti avvisati ✓' : `${avvisate}/${k.persone.length} persone avvisate`}</div>
                              </div>
                              <div className="flex items-center gap-1 shrink-0">
                                {k.persone.length > 0 && <button onClick={() => { setSelId(c.id); setVista('avvisi'); }} className="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md text-sm font-bold"><WhatsAppIcon size={15}/> Avvisa iscritti</button>}
                                <button onClick={() => setFormC({ id: c.id, dal: c.dal, al: c.al === c.dal ? '' : c.al, vasca: c.vasca, motivo: c.motivo || '' })} className="p-1.5 rounded-md bg-blue-50 hover:bg-blue-100 text-blue-600" title="Modifica"><EditIcon size={15}/></button>
                                <button onClick={() => eliminaChiusura(c)} className="p-1.5 rounded-md bg-red-50 hover:bg-red-100 text-red-600" title="Elimina"><XIcon size={15}/></button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {vista === 'avvisi' && sel && (() => {
              const k = colpite[sel.id] || { lezioni: [], persone: [] };
              const avvisate = k.persone.filter(p => (sel.avvisati || {})[p.key]).length;
              const mostrate = k.persone.filter(p => !soloDaAvvisare || !(sel.avvisati || {})[p.key]);
              const esempio = k.persone[0] ? costruisciMessaggio(sel, k.persone[0]) : '';
              return (
                <div className="flex-1 flex min-h-0">
                  <div className="w-96 shrink-0 border-r border-slate-200 bg-slate-50 p-4 flex flex-col gap-3 overflow-y-auto">
                    <div className="bg-white border border-slate-200 rounded-lg px-3 py-2.5">{intestazione(sel)}</div>
                    <div className="text-sm text-slate-600"><b>{k.lezioni.length}</b> lezioni coinvolte · <b>{k.persone.length}</b> persone</div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Testo del messaggio</label>
                      <textarea value={templateChiusura(sel)} onChange={e => cambiaMessaggio(sel, e.target.value)} rows={8} className="w-full px-3 py-2 border border-slate-300 rounded-md text-sm bg-white" />
                      <div className="mt-1 flex flex-wrap gap-1 text-[11px] text-slate-500 items-center">Inserisci:
                        {['{nome}', '{lezioni}', '{verbo}', '{motivo}'].map(t => <button key={t} onClick={() => cambiaMessaggio(sel, templateChiusura(sel) + t)} className="px-1.5 py-0.5 bg-white border border-slate-300 rounded font-mono">{t}</button>)}
                        {sel.messaggio && <button onClick={() => cambiaMessaggio(sel, '')} className="ml-auto underline">Ripristina testo</button>}
                      </div>
                    </div>
                    {esempio && <div><div className="text-xs font-semibold text-slate-500 mb-1">Anteprima ({k.persone[0].nome})</div><div className="text-sm whitespace-pre-wrap bg-green-50 border border-green-200 rounded-lg px-3 py-2 text-slate-700">{esempio}</div></div>}
                    {(() => {
                      const daAvv = k.persone.filter(p => !(sel.avvisati || {})[p.key]);
                      const conMail = daAvv.filter(p => emailOk(p.email)).length;
                      const senzaMail = daAvv.filter(p => !emailOk(p.email));
                      return (
                        <div className="border border-emerald-200 bg-emerald-50 rounded-lg p-3">
                          <div className="flex items-center justify-between gap-2">
                            <div className="text-sm font-bold text-emerald-800">Invia per email (Brevo)</div>
                            <button type="button" onClick={() => setMostraKey(v => !v)} className="text-xs font-bold text-emerald-700 hover:underline">{cfgB.apiKey ? 'Impostazioni' : 'Configura'}</button>
                          </div>
                          <label className="block mt-2 text-xs font-semibold text-slate-500 mb-1">Oggetto dell'email</label>
                          <input type="text" value={sel.oggetto !== undefined ? sel.oggetto : oggettoDefault(sel)} onChange={e => cambiaOggetto(sel, e.target.value)} className="w-full px-2 py-1.5 border border-slate-300 rounded-md text-sm bg-white" />
                          {mostraKey && (
                            <div className="mt-2 space-y-2">
                              <label className="block text-xs text-slate-600">Chiave API di Brevo<input type="password" autoComplete="off" value={cfgB.apiKey || ''} onChange={e => setBrevoCfg({ ...cfgB, apiKey: e.target.value })} placeholder="incolla qui la chiave" className="mt-0.5 w-full px-2 py-1.5 border border-slate-300 rounded-md text-sm bg-white" /></label>
                              <div className="text-[11px] text-slate-500">Mittente, risposte e piè di pagina si impostano come in "Scrivi al corso" (stessa configurazione).</div>
                            </div>
                          )}
                          {senzaMail.length > 0 && <div className="mt-2 text-xs text-amber-700"><b>Senza email ({senzaMail.length}):</b> {senzaMail.map(x => x.nome).join(', ')}. Per loro usa WhatsApp.</div>}
                          <div className="mt-2 flex flex-wrap items-center gap-2">
                            <button type="button" onClick={() => inviaEmailChiusura(sel, k.persone)} disabled={invioE.attivo || conMail === 0} className="px-3 py-1.5 rounded-lg text-sm font-bold bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white">✉ Invia a {conMail} {conMail === 1 ? 'persona' : 'persone'}</button>
                            {invioE.attivo && <span className="text-xs font-semibold text-emerald-800">Invio… {invioE.fatti}/{invioE.tot}</span>}
                            {invioE.fine && !invioE.attivo && <span className="text-xs font-semibold text-emerald-800">Inviate {invioE.fatti} su {invioE.tot}.</span>}
                          </div>
                          {!cfgB.apiKey && <div className="mt-1 text-xs text-slate-500">Prima inserisci la chiave di Brevo.</div>}
                          {conMail > 300 && <div className="mt-1 text-xs font-semibold text-amber-700">Il piano gratuito di Brevo permette 300 invii al giorno.</div>}
                          <div className="mt-2 text-[11px] text-slate-500 whitespace-pre-line"><b>In fondo a ogni email:</b>{brevoPiede(cfgB, numeroPerWhatsapp)}</div>
                          {invioE.errori.length > 0 && <div className="mt-2 text-xs text-red-700 bg-red-50 border border-red-200 rounded-md p-2 max-h-24 overflow-y-auto">{invioE.errori.map((e, i) => <div key={i}><b>{e.nome}</b> ({e.email}): {e.msg}</div>)}</div>}
                        </div>
                      );
                    })()}
                  </div>
                  <div className="flex-1 flex flex-col min-w-0 bg-white">
                    <div className="flex items-center justify-between px-5 py-3 border-b border-slate-200">
                      <div className="font-bold text-slate-800">Avvisati {avvisate} su {k.persone.length}</div>
                      <label className="flex items-center gap-2 text-sm text-slate-600 cursor-pointer"><input type="checkbox" checked={soloDaAvvisare} onChange={e => setSoloDaAvvisare(e.target.checked)} className="w-4 h-4"/> Mostra solo da avvisare</label>
                    </div>
                    <div className="flex-1 overflow-y-auto divide-y divide-slate-100">
                      {mostrate.length === 0 && <div className="p-8 text-center text-slate-400">{k.persone.length === 0 ? 'Nessun iscritto coinvolto da questa chiusura.' : 'Tutti avvisati ✓'}</div>}
                      {mostrate.map(p => {
                        const fatto = !!(sel.avvisati || {})[p.key];
                        const num = numeroPerWhatsapp(p.telefono);
                        const testo = costruisciMessaggio(sel, p);
                        return (
                          <div key={p.key} className={`px-5 py-3 flex items-center gap-3 ${fatto ? 'bg-slate-50' : ''}`}>
                            <button onClick={() => segna(sel, p.key, !fatto)} title={fatto ? 'Avvisato: clicca per togliere la spunta' : 'Spunta quando hai avvisato'} className={`shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center ${fatto ? 'bg-green-500 border-green-500' : 'border-slate-300 hover:border-slate-400'}`}>{fatto && <CheckIcon size={14} className="text-white"/>}</button>
                            <div className="min-w-0 flex-1">
                              <div className={`font-semibold text-sm ${fatto ? 'text-slate-400 line-through' : 'text-slate-800'}`}>{p.nome}</div>
                              <div className="mt-1 flex flex-wrap gap-1.5">{p.lezioni.map((l, i) => <span key={i} className="px-2 py-0.5 rounded bg-amber-50 border border-amber-200 text-amber-800 text-xs font-bold">{GIORNI[l.giorno].substring(0, 3)} {fmtCorta(l.ymd)} {l.ora} · {l.nomeCorso}</span>)}</div>
                            </div>
                            {num
                              ? <a href={`whatsapp://send?phone=${num}&text=${encodeURIComponent(testo)}`} onClick={() => segna(sel, p.key, true)} title="Invia il messaggio su WhatsApp (segna anche come avvisato)" style={{ color: '#25D366', backgroundColor: '#f0fdf4' }} className="shrink-0 p-2 rounded-md hover:brightness-95"><WhatsAppIcon size={18}/></a>
                              : <button onClick={() => copia(testo)} title="Numero mancante: copia il messaggio" className="shrink-0 p-2 rounded-md text-slate-500 bg-slate-100 hover:bg-slate-200"><CopyIcon size={18}/></button>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              );
            })()}

            {formC && (
              <div className="fixed inset-0 z-[60] bg-slate-900/40 flex items-center justify-center p-4" onClick={() => setFormC(null)}>
                <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden" onClick={e => e.stopPropagation()}>
                  <div className="px-5 py-3 bg-[#1e3a5f] text-white font-bold flex justify-between items-center">{formC.id ? 'Modifica chiusura' : 'Nuova chiusura'}<button onClick={() => setFormC(null)}><XIcon size={18}/></button></div>
                  <div className="p-5 space-y-4">
                    <div className="grid grid-cols-2 gap-3">
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Dal</label><input type="date" value={formC.dal} onChange={e => setFormC({ ...formC, dal: e.target.value })} className="w-full px-2 py-2 border border-slate-300 rounded-md text-sm"/></div>
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Al <span className="font-normal">(vuoto = un giorno)</span></label><input type="date" value={formC.al} min={formC.dal} onChange={e => setFormC({ ...formC, al: e.target.value })} className="w-full px-2 py-2 border border-slate-300 rounded-md text-sm"/></div>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Quale vasca</label>
                      <div className="flex gap-2">{Object.keys(VASCHE_CHIUSURA).map(v => <button key={v} onClick={() => setFormC({ ...formC, vasca: v })} className={`flex-1 py-2 rounded-md text-sm font-bold border ${formC.vasca === v ? 'bg-[#1e3a5f] text-white border-[#1e3a5f]' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>{VASCHE_CHIUSURA[v]}</button>)}</div>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Motivo</label>
                      <input type="text" value={formC.motivo} onChange={e => setFormC({ ...formC, motivo: e.target.value })} onKeyDown={e => { if (e.key === 'Enter') salvaChiusura(); }} className="w-full px-3 py-2 border border-slate-300 rounded-md text-sm" placeholder="es. festività" />
                      <div className="mt-1.5 flex flex-wrap gap-1.5">{MOTIVI_CHIUSURA.map(m => <button key={m} onClick={() => setFormC({ ...formC, motivo: m })} className="px-2.5 py-1 text-xs font-semibold bg-white border border-slate-300 hover:border-[#1e3a5f] rounded-full text-slate-600">{m}</button>)}</div>
                    </div>
                  </div>
                  <div className="px-5 py-3 bg-slate-50 border-t flex justify-end gap-2">
                    <button onClick={() => setFormC(null)} className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-md">Annulla</button>
                    <button onClick={salvaChiusura} className="px-4 py-2 text-sm font-bold bg-teal-600 hover:bg-teal-700 text-white rounded-md">Salva</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- NUOTO LIBERO: periodi, giorni e orari mostrati come sfondo chiaro nel piano vasca (documento cloud dedicato: libero_v1) ---
    const liberoGiorniTxt = (gg) => {
      const o = [...gg].sort((a, b) => a - b);
      if (o.length === 7) return 'Tutti i giorni';
      if (o.length === 5 && o.join() === '0,1,2,3,4') return 'Lun–Ven';
      if (o.length === 2 && o.join() === '5,6') return 'Sab–Dom';
      return o.map(g => GIORNI[g].slice(0, 3)).join(', ');
    };
    const liberoTocca = (l, ymd, gIdx, vasca) => (l.vasca === 'tutte' || l.vasca === vasca) && l.dal <= ymd && l.al >= ymd && (l.giorni || []).includes(gIdx);
    const NuotoLiberoModal = ({ periodi, setPeriodi, mostraToast, onClose }) => {
      const oggiYMD = toYMD(new Date());
      const [form, setForm] = useState(null);
      const ordinati = useMemo(() => [...periodi].sort((a, b) => a.dal.localeCompare(b.dal) || (a.dalle || '').localeCompare(b.dalle || '')), [periodi]);
      const attivi = ordinati.filter(x => x.al >= oggiYMD), passati = ordinati.filter(x => x.al < oggiYMD).reverse();
      const salva = () => {
        const f = form;
        if (!f.dal || !f.al) return alert('Indica il periodo (dal / al).');
        if (f.al < f.dal) return alert('La data finale è precedente a quella iniziale.');
        if (!f.giorni.length) return alert('Seleziona almeno un giorno.');
        if (!f.dalle || !f.alle || f.alle <= f.dalle) return alert("Controlla gli orari: la fine deve essere dopo l'inizio.");
        const rec = { id: f.id || 'nl' + Date.now() + Math.random().toString(36).slice(2, 5), vasca: f.vasca, dal: f.dal, al: f.al, giorni: [...f.giorni].sort((a, b) => a - b), dalle: f.dalle, alle: f.alle, nota: (f.nota || '').trim() };
        setPeriodi(prev => f.id ? prev.map(x => x.id === f.id ? rec : x) : [...prev, rec]);
        setForm(null); mostraToast(f.id ? 'Nuoto libero aggiornato.' : 'Nuoto libero aggiunto al piano vasca.');
      };
      const elimina = (x) => { if (window.confirm('Eliminare questo periodo di nuoto libero?')) setPeriodi(prev => prev.filter(y => y.id !== x.id)); };
      const riga = (x, passato) => (
        <div key={x.id} className={`px-4 py-3 flex items-center gap-4 ${passato ? 'opacity-60' : ''}`}>
          <div className="flex-1 min-w-0">
            <div className="font-bold text-slate-800">{liberoGiorniTxt(x.giorni)} · {x.dalle}–{x.alle}</div>
            <div className="text-sm text-slate-500">dal {formatDate(x.dal)} al {formatDate(x.al)} · {VASCHE_CHIUSURA[x.vasca] || x.vasca}{x.nota ? ` · ${x.nota}` : ''}</div>
          </div>
          <div className="flex items-center gap-1 shrink-0">
            <button onClick={() => setForm({ ...x })} className="p-1.5 rounded-md bg-blue-50 hover:bg-blue-100 text-blue-600" title="Modifica"><EditIcon size={15}/></button>
            <button onClick={() => setForm({ ...x, id: undefined })} className="px-2 py-1.5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold" title="Duplica">Duplica</button>
            <button onClick={() => elimina(x)} className="p-1.5 rounded-md bg-red-50 hover:bg-red-100 text-red-600" title="Elimina"><XIcon size={15}/></button>
          </div>
        </div>
      );
      const nuovo = () => setForm({ vasca: 'interna', dal: oggiYMD, al: '', giorni: [0, 1, 2, 3, 4], dalle: '12:00', alle: '14:00', nota: '' });
      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-xl w-full max-w-6xl overflow-hidden flex flex-col h-[85vh] max-h-[800px]" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center px-5 py-3 bg-[#1e3a5f] text-white">
              <h3 className="font-bold text-xl flex items-center gap-2"><ClockIcon size={24}/> Nuoto libero</h3>
              <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full transition-colors ml-1"><XIcon size={22}/></button>
            </div>
            <div className="flex-1 flex flex-col min-h-0 bg-slate-50">
              <div className="flex items-center justify-between px-5 py-3 bg-white border-b border-slate-200">
                <p className="text-sm text-slate-500">Indica periodo, giorni e orari: nel piano vasca compare uno sfondo grigio chiaro (i corsi restano sopra).</p>
                <button onClick={nuovo} className="flex items-center gap-2 px-3 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-md text-sm font-bold shrink-0"><PlusIcon size={16}/> Nuovo periodo</button>
              </div>
              <div className="flex-1 overflow-y-auto p-5 space-y-5">
                {periodi.length === 0 && <div className="p-8 text-center text-slate-400">Nessun periodo di nuoto libero inserito.</div>}
                {[['In corso e futuri', attivi, false], ['Passati', passati, true]].map(([t, lista, pas]) => lista.length > 0 && (
                  <div key={t}>
                    <div className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">{t}</div>
                    <div className="bg-white border border-slate-200 rounded-xl divide-y divide-slate-100 overflow-hidden">{lista.map(x => riga(x, pas))}</div>
                  </div>
                ))}
              </div>
            </div>
            {form && (
              <div className="fixed inset-0 z-[60] bg-slate-900/40 flex items-center justify-center p-4" onClick={() => setForm(null)}>
                <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden" onClick={e => e.stopPropagation()}>
                  <div className="px-5 py-3 bg-[#1e3a5f] text-white font-bold flex justify-between items-center">{form.id ? 'Modifica nuoto libero' : 'Nuovo nuoto libero'}<button onClick={() => setForm(null)}><XIcon size={18}/></button></div>
                  <div className="p-5 space-y-4">
                    <div className="grid grid-cols-2 gap-3">
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Dal</label><input type="date" value={form.dal} onChange={e => setForm({ ...form, dal: e.target.value })} className="w-full px-2 py-2 border border-slate-300 rounded-md text-sm" /></div>
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Al</label><input type="date" value={form.al} min={form.dal} onChange={e => setForm({ ...form, al: e.target.value })} className="w-full px-2 py-2 border border-slate-300 rounded-md text-sm" /></div>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Giorni</label>
                      <div className="flex flex-wrap gap-1.5">
                        {GIORNI.map((g, i) => <button key={g} type="button" onClick={() => setForm({ ...form, giorni: form.giorni.includes(i) ? form.giorni.filter(x => x !== i) : [...form.giorni, i] })} className={`px-2.5 py-1.5 rounded-md text-xs font-bold border ${form.giorni.includes(i) ? 'bg-[#1e3a5f] text-white border-[#1e3a5f]' : 'bg-white text-slate-600 border-slate-300 hover:border-[#1e3a5f]'}`}>{g.slice(0, 3)}</button>)}
                      </div>
                      <div className="mt-1.5 flex gap-1.5 text-[11px]">{[['Lun–Ven', [0, 1, 2, 3, 4]], ['Sab–Dom', [5, 6]], ['Tutti', [0, 1, 2, 3, 4, 5, 6]]].map(([l, v]) => <button key={l} type="button" onClick={() => setForm({ ...form, giorni: v })} className="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 rounded text-slate-600 font-semibold">{l}</button>)}</div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Dalle</label><input type="time" step="900" value={form.dalle} onChange={e => setForm({ ...form, dalle: e.target.value })} className="w-full px-2 py-2 border border-slate-300 rounded-md text-sm" /></div>
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Alle</label><input type="time" step="900" value={form.alle} onChange={e => setForm({ ...form, alle: e.target.value })} className="w-full px-2 py-2 border border-slate-300 rounded-md text-sm" /></div>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Quale vasca</label>
                      <div className="flex gap-2">{Object.keys(VASCHE_CHIUSURA).map(v => <button key={v} type="button" onClick={() => setForm({ ...form, vasca: v })} className={`flex-1 py-2 rounded-md text-sm font-bold border ${form.vasca === v ? 'bg-[#1e3a5f] text-white border-[#1e3a5f]' : 'bg-white text-slate-600 border-slate-300 hover:border-[#1e3a5f]'}`}>{VASCHE_CHIUSURA[v]}</button>)}</div>
                    </div>
                    <div><label className="block text-xs font-semibold text-slate-500 mb-1">Nota <span className="font-normal">(facoltativa)</span></label><input type="text" value={form.nota || ''} onChange={e => setForm({ ...form, nota: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-md text-sm" /></div>
                  </div>
                  <div className="px-5 py-3 bg-slate-50 border-t flex justify-end gap-2">
                    <button onClick={() => setForm(null)} className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-md">Annulla</button>
                    <button onClick={salva} className="px-4 py-2 text-sm font-bold bg-teal-600 hover:bg-teal-700 text-white rounded-md">Salva</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- LEZIONI PRIVATE: pacchetti da 5 o 10 lezioni (validità 12 mesi), una persona dell'anagrafica con un istruttore ---
    const aggiungiMesiYMD = (ymd, n) => {
      const [y, m, d] = String(ymd).split('-').map(Number);
      const t = new Date(y, m - 1 + n, 1);
      const ultimo = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
      t.setDate(Math.min(d, ultimo));
      return toYMD(t);
    };
    const statoPacchetto = (p, oggiYMD) => {
      const usate = (p.lezioni || []).reduce((a, l) => a + (l.n || 1), 0), rimaste = Math.max(0, (p.totale || 0) - usate);
      const scaduto = !!p.scadenza && p.scadenza < oggiYMD;
      const stato = rimaste <= 0 ? 'esaurito' : scaduto ? 'scaduto' : 'attivo';
      const giorni = p.scadenza ? Math.round((new Date(p.scadenza + 'T12:00:00') - new Date(oggiYMD + 'T12:00:00')) / 86400000) : null;
      return { usate, rimaste, scaduto, stato, giorni, inScadenza: stato === 'attivo' && giorni !== null && giorni <= 30 };
    };
