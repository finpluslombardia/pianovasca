    const statoCertificato = (a, rifYMD) => {
      a = a || {};
      if (!certificatoObbligatorio(a.anno, null, a.dataNascita)) return { stato: 'nonrichiesto', scad: '' };
      if (!a.scadCertificato) return { stato: 'mancante', scad: '' };
      if (a.scadCertificato < rifYMD) return { stato: 'scaduto', scad: a.scadCertificato };
      const g = Math.round((new Date(a.scadCertificato + 'T12:00:00') - new Date(rifYMD + 'T12:00:00')) / 86400000);
      return { stato: g <= 30 ? 'inscadenza' : 'valido', scad: a.scadCertificato, giorni: g };
    };
    const LezioniPrivateModal = ({ pacchetti, setPacchetti, anagrafiche, istruttori, mostraToast, numeroPerWhatsapp, soloNomeProprio, brevoCfg, setBrevoCfg, apriScheda, onClose }) => {
      const oggiYMD = toYMD(new Date());
      const [filtroStato, setFiltroStato] = useState('attivi');
      const [cerca, setCerca] = useState('');
      const [filtroIstr, setFiltroIstr] = useState('');
      const [dettaglio, setDettaglio] = useState(null);
      const [form, setForm] = useState(null);
      const [nuovaLez, setNuovaLez] = useState({ data: oggiYMD, ora: '', note: '' });
      const [msgCustom, setMsgCustom] = useState({ id: null, testo: null, oggetto: null });
      const [conflitto, setConflitto] = useState(null);
      const [contattaId, setContattaId] = useState(null);
      const [mostraKey, setMostraKey] = useState(false);
      const [invioMsg, setInvioMsg] = useState(false);
      const cfgB = brevoCfg || {};
      const nuovoId = () => 'lp' + Date.now() + Math.random().toString(36).slice(2, 5);
      const istrDisponibili = useMemo(() => {
        const s = new Set(istruttori || []);
        (pacchetti || []).forEach(p => { if (p.istruttore) s.add(p.istruttore); });
        return Array.from(s).sort((a, b) => a.localeCompare(b, 'it'));
      }, [istruttori, pacchetti]);
      const info = useMemo(() => { const m = {}; (pacchetti || []).forEach(p => { m[p.id] = statoPacchetto(p, oggiYMD); }); return m; }, [pacchetti, oggiYMD]);
      const conteggi = useMemo(() => {
        const c = { attivi: 0, scaduti: 0, esauriti: 0, tutti: (pacchetti || []).length, rimaste: 0, inScadenza: 0 };
        (pacchetti || []).forEach(p => { const i = info[p.id]; if (!i) return; if (i.stato === 'attivo') { c.attivi++; c.rimaste += i.rimaste; if (i.inScadenza) c.inScadenza++; } else if (i.stato === 'scaduto') c.scaduti++; else c.esauriti++; });
        return c;
      }, [pacchetti, info]);
      const pDett = dettaglio ? (pacchetti || []).find(x => x.id === dettaglio) : null;
      const q = cerca.trim().toLowerCase();
      const lista = (pacchetti || []).filter(p => {
        const i = info[p.id]; if (!i) return false;
        if (filtroStato === 'attivi' && i.stato !== 'attivo') return false;
        if (filtroStato === 'scaduti' && i.stato !== 'scaduto') return false;
        if (filtroStato === 'esauriti' && i.stato !== 'esaurito') return false;
        if (filtroIstr && p.istruttore !== filtroIstr) return false;
        if (q && !(p.nome || '').toLowerCase().includes(q)) return false;
        return true;
      }).sort((a, b) => filtroStato === 'attivi' ? (a.scadenza || '').localeCompare(b.scadenza || '') : (a.nome || '').localeCompare(b.nome || '', 'it'));

      const nuovoPacchetto = (base) => {
        const data = oggiYMD;
        setForm({ socioKey: base ? base.socioKey : '', nome: base ? base.nome : '', ricerca: '', istruttore: base ? base.istruttore : '', totale: 10, dataAcquisto: data, scadenza: aggiungiMesiYMD(data, 12), note: '' });
      };
      const salvaForm = () => {
        if (!form.socioKey) { mostraToast('Scegli la persona dall\'anagrafica.', 'error'); return; }
        if (!(form.istruttore || '').trim()) { mostraToast('Indica l\'istruttore.', 'error'); return; }
        if (!form.dataAcquisto || !form.scadenza) { mostraToast('Indica data di acquisto e scadenza.', 'error'); return; }
        const dati = { socioKey: form.socioKey, nome: form.nome, istruttore: form.istruttore.trim(), totale: Number(form.totale), dataAcquisto: form.dataAcquisto, scadenza: form.scadenza, note: (form.note || '').trim() };
        if (form.id) setPacchetti(prev => prev.map(p => p.id === form.id ? { ...p, ...dati } : p));
        else { const id = nuovoId(); setPacchetti(prev => [...prev, { id, ...dati, lezioni: [] }]); setDettaglio(id); }
        setForm(null);
      };
      const eliminaPacchetto = (p) => {
        const n = (p.lezioni || []).reduce((a, l) => a + (l.n || 1), 0);
        if (!window.confirm(`Eliminare il pacchetto di ${p.nome} con ${p.istruttore}?${n ? `\n\nSono registrate ${n} lezioni, andranno perse.` : ''}`)) return;
        setPacchetti(prev => prev.filter(x => x.id !== p.id));
        if (dettaglio === p.id) setDettaglio(null);
      };
      const aggiungiLezione = (pid, dati, modo, esisteId) => {
        setPacchetti(prev => prev.map(x => {
          if (x.id !== pid) return x;
          let lez = x.lezioni || [];
          if (modo === 'unifica') lez = lez.map(l => l.id === esisteId ? { ...l, n: (l.n || 1) + 1, note: [l.note, dati.note].filter(Boolean).join(' · ') } : l);
          else lez = [...lez, { id: nuovoId(), data: dati.data, ora: dati.ora || '', note: dati.note || '' }];
          return { ...x, lezioni: lez.sort((a, b) => a.data.localeCompare(b.data) || (a.ora || '').localeCompare(b.ora || '')) };
        }));
        setNuovaLez({ data: dati.data, ora: '', note: '' });
      };
      const registraLezione = (p) => {
        const i = info[p.id];
        if (i.rimaste <= 0) { mostraToast('Il pacchetto è esaurito.', 'error'); return; }
        if (!nuovaLez.data) { mostraToast('Indica la data della lezione.', 'error'); return; }
        if (p.scadenza && nuovaLez.data > p.scadenza && !window.confirm(`La data è dopo la scadenza del pacchetto (${formatDate(p.scadenza)}). Registrare lo stesso?`)) return;
        const cert = statoCertificato(anagDi(p), nuovaLez.data);
        if ((cert.stato === 'mancante' || cert.stato === 'scaduto') && !window.confirm(`Il certificato medico di ${p.nome} risulta ${cert.stato === 'mancante' ? 'mancante' : 'scaduto il ' + formatDate(cert.scad)}.\n\nSenza certificato medico valido non è possibile fare lezione. Registrare lo stesso?`)) return;
        const dati = { data: nuovaLez.data, ora: nuovaLez.ora || '', note: (nuovaLez.note || '').trim() };
        const gia = (p.lezioni || []).find(l => l.data === dati.data && (l.n || 1) === 1);
        if (gia) { setConflitto({ pid: p.id, dati, esisteId: gia.id }); return; }
        aggiungiLezione(p.id, dati, 'nuova');
      };
      const separaLezione = (p, l) => {
        setPacchetti(prev => prev.map(x => x.id !== p.id ? x : { ...x, lezioni: (x.lezioni || []).flatMap(y => y.id !== l.id ? [y] : Array.from({ length: y.n || 1 }, (_, k) => ({ id: nuovoId(), data: y.data, ora: k === 0 ? (y.ora || '') : '', note: k === 0 ? (y.note || '') : '' }))) }));
      };
      const eliminaLezione = (p, l) => {
        if (!window.confirm(`Togliere la lezione del ${formatDate(l.data)}?`)) return;
        setPacchetti(prev => prev.map(x => x.id === p.id ? { ...x, lezioni: (x.lezioni || []).filter(y => y.id !== l.id) } : x));
      };
      const messaggioPromemoria = (p) => {
        const i = info[p.id];
        const base = `Ciao ${soloNomeProprio(p.nome)}! 👋\n`;
        if (i.stato === 'attivo') return base + `Ti ricordiamo che il tuo pacchetto di lezioni private con ${p.istruttore} ha ancora ${i.rimaste} ${i.rimaste === 1 ? 'lezione' : 'lezioni'} e scade il ${formatDate(p.scadenza)}.\nPer prenotare le prossime lezioni scrivici pure qui. Grazie!\nCentro Federale Lampugnano`;
        if (i.stato === 'scaduto') return base + `Il tuo pacchetto di lezioni private con ${p.istruttore} è scaduto il ${formatDate(p.scadenza)}${i.rimaste ? ` (restavano ${i.rimaste} lezioni)` : ''}.\nSe vuoi rinnovarlo scrivici pure qui. Grazie!\nCentro Federale Lampugnano`;
        return base + `Hai concluso il tuo pacchetto di lezioni private con ${p.istruttore}.\nSe vuoi acquistarne uno nuovo scrivici pure qui. Grazie!\nCentro Federale Lampugnano`;
      };
      const anagDi = (p) => (anagrafiche || []).find(x => x.key === p.socioKey) || {};
      const certPill = (a, rif) => {
        const c = statoCertificato(a, rif || oggiYMD);
        if (c.stato === 'mancante') return <span className="px-2 py-0.5 rounded text-xs font-bold bg-red-50 text-red-700 border border-red-200">Certificato mancante</span>;
        if (c.stato === 'scaduto') return <span className="px-2 py-0.5 rounded text-xs font-bold bg-red-50 text-red-700 border border-red-200">Certificato scaduto</span>;
        if (c.stato === 'inscadenza') return <span className="px-2 py-0.5 rounded text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200">Certificato scade fra {c.giorni} gg</span>;
        if (c.stato === 'valido') return <span className="px-2 py-0.5 rounded text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Certificato valido</span>;
        return <span className="px-2 py-0.5 rounded text-xs font-bold bg-slate-100 text-slate-500 border border-slate-200">Certificato non richiesto</span>;
      };
      const emailDi = (p) => { const a = (anagrafiche || []).find(x => x.key === p.socioKey); return a ? String(a.email || '').trim() : ''; };
      const emailOk = (e) => /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(String(e || '').trim());
      const testoMsgDi = (p) => (msgCustom.id === p.id && msgCustom.testo !== null) ? msgCustom.testo : messaggioPromemoria(p);
      const oggettoMsgDi = (p) => (msgCustom.id === p.id && msgCustom.oggetto !== null) ? msgCustom.oggetto : 'Centro Federale Lampugnano - Lezioni private';
      const inviaEmailPacchetto = async (p) => {
        const a = emailDi(p);
        if (!emailOk(a)) { mostraToast('Questa persona non ha un indirizzo email in anagrafica.', 'error'); return; }
        if (!cfgB.apiKey || !cfgB.mittenteEmail) { setMostraKey(true); mostraToast('Inserisci prima la chiave di Brevo.', 'error'); return; }
        const oggetto = (oggettoMsgDi(p) || '').trim() || 'Centro Federale Lampugnano - Lezioni private';
        if (!window.confirm(`Inviare l'email a ${p.nome} (${a})?\n\nOggetto: ${oggetto}`)) return;
        setInvioMsg(true);
        try { await brevoInvia(cfgB, { a, nomeA: p.nome, oggetto, testoMail: testoMsgDi(p) + brevoPiede(cfgB, numeroPerWhatsapp) }); mostraToast('Email inviata a ' + a + '.', 'success'); }
        catch (e) { mostraToast(e.message, 'error'); }
        setInvioMsg(false);
      };
      const telefonoDi = (p) => { const a = (anagrafiche || []).find(x => x.key === p.socioKey); return a ? a.telefono : ''; };
      const risultatiPersona = (() => {
        if (!form || form.socioKey) return [];
        const t = (form.ricerca || '').trim().toLowerCase();
        if (t.length < 2) return [];
        return (anagrafiche || []).filter(a => a.nome.toLowerCase().includes(t)).slice(0, 8);
      })();
      const badge = (i) => i.stato === 'esaurito' ? <span className="px-2 py-0.5 rounded text-xs font-bold bg-slate-100 text-slate-500 border border-slate-200">Esaurito</span>
        : i.stato === 'scaduto' ? <span className="px-2 py-0.5 rounded text-xs font-bold bg-red-50 text-red-700 border border-red-200">Scaduto</span>
        : i.inScadenza ? <span className="px-2 py-0.5 rounded text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200">Scade fra {i.giorni} {i.giorni === 1 ? 'giorno' : 'giorni'}</span>
        : <span className="px-2 py-0.5 rounded text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Attivo</span>;

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-xl w-full max-w-6xl overflow-hidden flex flex-col h-[85vh] max-h-[800px]" onClick={e => e.stopPropagation()}>
            <div className="px-2 pt-2 flex flex-col bg-[#1e3a5f] text-white">
              <div className="flex justify-between items-center px-3 pb-3 pt-1 mb-1 border-b border-white/20">
                <h3 className="font-bold text-xl flex items-center gap-2"><UsersIcon size={24}/> Lezioni private</h3>
                <div className="flex items-center gap-2">
                  <button onClick={() => nuovoPacchetto(null)} className="flex items-center gap-1.5 px-3 py-1.5 bg-white/15 hover:bg-white/25 rounded-md text-sm font-semibold"><PlusIcon size={15}/> Nuovo pacchetto</button>
                  <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full transition-colors ml-1"><XIcon size={22}/></button>
                </div>
              </div>
              <div className="flex">
                {[['attivi', 'Attivi', conteggi.attivi], ['scaduti', 'Scaduti', conteggi.scaduti], ['esauriti', 'Esauriti', conteggi.esauriti], ['tutti', 'Tutti', conteggi.tutti]].map(([id, label, n]) => (
                  <button key={id} onClick={() => setFiltroStato(id)} className={`flex-1 py-2.5 text-sm font-bold transition-all border-b-4 border-transparent leading-tight ${filtroStato === id ? 'bg-white/20' : 'opacity-80 hover:bg-white/5'}`}>{label}<span className="ml-1.5 bg-white/25 text-[11px] px-1.5 py-0.5 rounded-full">{n}</span></button>
                ))}
              </div>
            </div>
            <div className="px-5 py-3 bg-white border-b border-slate-200 flex flex-wrap items-center gap-3">
              <input type="text" value={cerca} onChange={e => setCerca(e.target.value)} placeholder="Cerca persona…" className="px-3 py-1.5 border border-slate-300 rounded-md text-sm w-56" />
              <select value={filtroIstr} onChange={e => setFiltroIstr(e.target.value)} className="px-2 py-1.5 border border-slate-300 rounded-md text-sm bg-white">
                <option value="">Tutti gli istruttori</option>
                {istrDisponibili.map(n => <option key={n} value={n}>{n}</option>)}
              </select>
              <div className="ml-auto text-sm text-slate-500"><b className="text-slate-700">{conteggi.rimaste}</b> lezioni da fare{conteggi.inScadenza > 0 && <> · <b className="text-amber-700">{conteggi.inScadenza}</b> in scadenza</>}</div>
            </div>
            <div className="flex-1 min-h-0 overflow-y-auto bg-slate-50 p-5">
              {lista.length === 0 && <div className="p-8 text-center text-slate-400">{(pacchetti || []).length === 0 ? 'Nessun pacchetto registrato. Crea il primo con "Nuovo pacchetto".' : 'Nessun pacchetto con questi filtri.'}</div>}
              <div className="space-y-2">
                {lista.map(p => {
                  const i = info[p.id]; const tel = numeroPerWhatsapp(telefonoDi(p));
                  return (
                    <div key={p.id} className={`bg-white border border-slate-200 rounded-xl overflow-hidden ${i.stato !== 'attivo' ? 'opacity-80' : ''}`}>
                      <div className="px-4 py-3 flex items-center gap-4 cursor-pointer hover:bg-slate-50" onClick={() => { setDettaglio(p.id); setNuovaLez({ data: oggiYMD, ora: '', note: '' }); }} title="Apri il dettaglio e compila le lezioni">
                        <div className="min-w-0 flex-1">
                          <div className="font-bold text-slate-800 truncate">{p.nome}</div>
                          <div className="text-xs text-slate-500">Istruttore: <b className="text-slate-700">{p.istruttore}</b> · acquistato il {formatDate(p.dataAcquisto)} · scade il {formatDate(p.scadenza)}</div>
                        </div>
                        <div className="w-40 shrink-0">
                          <div className="text-sm text-slate-700 text-right"><b>{i.usate}</b>/{p.totale} fatte · <b>{i.rimaste}</b> {i.rimaste === 1 ? 'rimasta' : 'rimaste'}</div>
                          <div className="mt-1 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full ${i.stato === 'attivo' ? 'bg-emerald-500' : 'bg-slate-400'}`} style={{ width: Math.min(100, Math.round(i.usate / (p.totale || 1) * 100)) + '%' }}></div></div>
                        </div>
                        <div className="shrink-0 w-44 text-right flex flex-col items-end gap-1">{badge(i)}{['mancante', 'scaduto', 'inscadenza'].includes(statoCertificato(anagDi(p), oggiYMD).stato) && certPill(anagDi(p))}</div>
                        <div className="flex items-center gap-1 shrink-0" onClick={e => e.stopPropagation()}>
                          {tel && <a href={`whatsapp://send?phone=${tel}&text=${encodeURIComponent(messaggioPromemoria(p))}`} title="Invia promemoria su WhatsApp" style={{ color: '#25D366', backgroundColor: '#f0fdf4' }} className="p-1.5 rounded-md hover:brightness-95"><WhatsAppIcon size={15}/></a>}
                          <button onClick={() => eliminaPacchetto(p)} className="p-1.5 rounded-md bg-red-50 hover:bg-red-100 text-red-600" title="Elimina"><XIcon size={15}/></button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {pDett && (() => {
              const p = pDett; const i = info[p.id] || statoPacchetto(p, oggiYMD); const tel = numeroPerWhatsapp(telefonoDi(p));
              return (
                <div className="fixed inset-0 z-[55] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setDettaglio(null)}>
                  <div className="bg-white rounded-2xl shadow-xl w-full max-w-6xl overflow-hidden flex flex-col h-[85vh] max-h-[800px]" onClick={e => e.stopPropagation()}>
                    <div className="flex justify-between items-center px-5 py-3 bg-[#1e3a5f] text-white">
                      <h3 className="font-bold text-xl flex items-center gap-2"><UsersIcon size={24}/> {p.nome}</h3>
                      <div className="flex items-center gap-2">
                        <button onClick={() => setDettaglio(null)} className="px-3 py-1.5 bg-white/15 hover:bg-white/25 rounded-md text-sm font-semibold">← Tutti i pacchetti</button>
                        <button onClick={() => setDettaglio(null)} className="hover:bg-white/20 p-1 rounded-full transition-colors ml-1"><XIcon size={22}/></button>
                      </div>
                    </div>
                    <div className="flex-1 flex min-h-0">
                      <div className="w-80 shrink-0 border-r border-slate-200 bg-slate-50 p-4 flex flex-col gap-3 overflow-y-auto">
                        <div className="bg-white border border-slate-200 rounded-lg p-4 space-y-3 text-sm">
                          <div className="flex items-center justify-between">{badge(i)}<span className="text-slate-500">Pacchetto da <b className="text-slate-700">{p.totale}</b></span></div>
                          <div>
                            <div className="text-slate-500">Istruttore: <b className="text-slate-800">{p.istruttore}</b></div>
                            <div className="text-xs text-slate-400 mt-0.5">dal {formatDate(p.dataAcquisto)} al {formatDate(p.scadenza)}</div>
                          </div>
                          <div>
                            <div className="text-slate-700"><b>{i.usate}</b>/{p.totale} fatte · <b>{i.rimaste}</b> {i.rimaste === 1 ? 'rimasta' : 'rimaste'}</div>
                            <div className="mt-1.5 h-2 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full ${i.stato === 'attivo' ? 'bg-emerald-500' : 'bg-slate-400'}`} style={{ width: Math.min(100, Math.round(i.usate / (p.totale || 1) * 100)) + '%' }}></div></div>
                          </div>
                          <div className="pt-3 border-t border-slate-100 flex items-center justify-between gap-2"><span className="text-xs text-slate-500">Certificato medico</span>{certPill(anagDi(p))}</div>
                          {p.note && <div className="pt-3 border-t border-slate-100 text-slate-600 italic">{p.note}</div>}
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <button onClick={() => apriScheda(p.socioKey, p.nome)} className="flex items-center justify-center gap-1.5 px-3 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-md text-sm font-bold" title="Apri la scheda anagrafica"><UsersIcon size={15}/> Anagrafica</button>
                          <button onClick={() => setContattaId(p.id)} className="flex items-center justify-center gap-1.5 px-3 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-md text-sm font-bold" title="Scrivi a questa persona su WhatsApp o per email"><MessageCircleIcon size={15}/> Contatta</button>
                        </div>
                        <button onClick={() => nuovoPacchetto({ socioKey: p.socioKey, nome: p.nome, istruttore: p.istruttore })} className="flex items-center justify-center gap-1.5 px-3 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-md text-sm font-bold" title="Registra l'acquisto di un nuovo pacchetto per questa persona"><PlusIcon size={15}/> Acquista nuovo pacchetto</button>
                        <div className="mt-auto pt-3 flex items-center justify-between text-xs">
                          <button onClick={() => setForm({ id: p.id, socioKey: p.socioKey, nome: p.nome, ricerca: '', istruttore: p.istruttore, totale: p.totale, dataAcquisto: p.dataAcquisto, scadenza: p.scadenza, note: p.note || '' })} className="font-semibold text-slate-500 hover:text-slate-800 hover:underline">Modifica pacchetto</button>
                          <button onClick={() => eliminaPacchetto(p)} className="font-semibold text-red-500 hover:text-red-700 hover:underline">Elimina pacchetto</button>
                        </div>
                      </div>
                      <div className="flex-1 flex flex-col min-w-0 bg-white">
                        <div className="px-5 py-3 border-b border-slate-200 font-bold text-slate-800">Lezioni fatte</div>
                        {i.rimaste > 0 ? (
                          <div className="px-5 py-3 border-b border-slate-100 bg-slate-50 flex flex-wrap items-end gap-2">
                            <label className="text-xs text-slate-500">Data<input type="date" value={nuovaLez.data} onChange={e => setNuovaLez({ ...nuovaLez, data: e.target.value })} className="mt-0.5 block px-2 py-1.5 border border-slate-300 rounded-md text-sm bg-white" /></label>
                            <label className="text-xs text-slate-500">Ora (facoltativa)<input type="time" value={nuovaLez.ora} onChange={e => setNuovaLez({ ...nuovaLez, ora: e.target.value })} className="mt-0.5 block px-2 py-1.5 border border-slate-300 rounded-md text-sm bg-white" /></label>
                            <label className="text-xs text-slate-500 flex-1 min-w-[160px]">Nota (facoltativa)<input type="text" value={nuovaLez.note} onChange={e => setNuovaLez({ ...nuovaLez, note: e.target.value })} onKeyDown={e => { if (e.key === 'Enter') registraLezione(p); }} className="mt-0.5 block w-full px-2 py-1.5 border border-slate-300 rounded-md text-sm bg-white" /></label>
                            <button onClick={() => registraLezione(p)} className="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md text-sm font-bold">+ Registra lezione</button>
                          </div>
                        ) : <div className="px-5 py-3 border-b border-slate-100 bg-slate-50 text-sm text-slate-500">Pacchetto concluso: tutte le {p.totale} lezioni sono state fatte.</div>}
                        <div className="flex-1 overflow-y-auto divide-y divide-slate-100">
                          {(p.lezioni || []).length === 0 && <div className="p-8 text-center text-slate-400">Nessuna lezione ancora registrata.</div>}
                          {(p.lezioni || []).map((l, idx) => { const da = (p.lezioni || []).slice(0, idx).reduce((a, x) => a + (x.n || 1), 0) + 1; const nn = l.n || 1; return (
                            <div key={l.id} className="flex items-center gap-3 px-5 py-2.5 text-sm">
                              <span className="w-10 text-slate-400 font-bold">{nn > 1 ? `${da}-${da + nn - 1}.` : `${da}.`}</span>
                              <span className="font-semibold text-slate-700 w-40 shrink-0">{formatDate(l.data)}{l.ora ? ` · ${l.ora}` : ''}</span>
                              {nn > 1 && <span className="px-2 py-0.5 rounded text-xs font-bold bg-sky-50 text-sky-700 border border-sky-200 shrink-0">1 ora · conta {nn}</span>}
                              <span className="flex-1 text-slate-500 truncate">{l.note}</span>
                              {nn > 1 && <button onClick={() => separaLezione(p, l)} className="px-2 py-1 rounded text-xs font-bold text-slate-500 hover:bg-slate-100 shrink-0" title="Torna a due lezioni separate">Separa</button>}
                              <button onClick={() => eliminaLezione(p, l)} className="p-1 rounded text-red-500 hover:bg-red-50" title="Togli lezione"><XIcon size={15}/></button>
                            </div>
                          ); })}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })()}

            {contattaId && (() => {
              const p = (pacchetti || []).find(x => x.id === contattaId);
              if (!p) return null;
              const tel = numeroPerWhatsapp(telefonoDi(p)); const em = emailDi(p);
              return (
                <div className="fixed inset-0 z-[56] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setContattaId(null)}>
                  <div className="bg-white rounded-2xl shadow-xl w-full max-w-6xl overflow-hidden flex flex-col h-[85vh] max-h-[800px]" onClick={e => e.stopPropagation()}>
                    <div className="px-5 py-4 bg-emerald-600 text-white flex justify-between items-center">
                      <div className="min-w-0"><h3 className="font-bold text-lg flex items-center gap-2"><MessageCircleIcon size={20}/> Scrivi a {p.nome}</h3><div className="text-sm text-white/85 truncate">Lezioni private con {p.istruttore}</div></div>
                      <button onClick={() => setContattaId(null)} className="hover:bg-white/20 p-1 rounded-full transition-colors"><XIcon size={20}/></button>
                    </div>
                    <div className="flex-1 min-h-0 flex">
                      <div className="flex-1 min-w-0 p-5 overflow-y-auto flex flex-col gap-3">
                        <label className="block text-[11px] font-bold text-slate-400 uppercase tracking-wide">Oggetto (solo per l'email)<input type="text" value={oggettoMsgDi(p)} onChange={e => setMsgCustom({ id: p.id, testo: msgCustom.id === p.id ? msgCustom.testo : null, oggetto: e.target.value })} className="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-normal normal-case text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none" /></label>
                        <label className="block flex-1 flex flex-col text-[11px] font-bold text-slate-400 uppercase tracking-wide">Messaggio (puoi modificarlo)<textarea value={testoMsgDi(p)} onChange={e => setMsgCustom({ id: p.id, testo: e.target.value, oggetto: msgCustom.id === p.id ? msgCustom.oggetto : null })} className="mt-1 flex-1 min-h-[220px] w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-normal normal-case text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none" /></label>
                        <div className="text-xs text-slate-500 whitespace-pre-line"><b>In fondo a ogni email viene aggiunto:</b>{brevoPiede(cfgB, numeroPerWhatsapp)}</div>
                      </div>
                      <div className="w-80 shrink-0 border-l border-slate-200 bg-slate-50 p-5 flex flex-col gap-3 overflow-y-auto">
                        <div className="bg-white border border-slate-200 rounded-lg p-3">
                          <div className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">WhatsApp</div>
                          <div className="text-sm text-slate-700 mb-2">{telefonoDi(p) || 'Telefono mancante in anagrafica'}</div>
                          {tel
                            ? <a href={`whatsapp://send?phone=${tel}&text=${encodeURIComponent(testoMsgDi(p))}`} style={{ color: '#fff', backgroundColor: '#25D366' }} className="flex items-center justify-center gap-1.5 px-3 py-2 rounded-md text-sm font-bold hover:brightness-95"><WhatsAppIcon size={15}/> Invia su WhatsApp</a>
                            : <button type="button" disabled className="w-full flex items-center justify-center gap-1.5 px-3 py-2 rounded-md text-sm font-bold bg-slate-200 text-slate-400 cursor-not-allowed"><WhatsAppIcon size={15}/> Invia su WhatsApp</button>}
                        </div>
                        <div className="bg-white border border-slate-200 rounded-lg p-3">
                          <div className="flex items-center justify-between mb-2"><div className="text-xs font-bold text-slate-400 uppercase tracking-wide">Email (Brevo)</div><button type="button" onClick={() => setMostraKey(v => !v)} className="text-xs font-bold text-emerald-700 hover:underline">{cfgB.apiKey ? 'Impostazioni' : 'Configura'}</button></div>
                          <div className="text-sm text-slate-700 mb-2 break-all">{em || 'Email mancante in anagrafica'}</div>
                          {mostraKey && <label className="block text-xs text-slate-500 mb-2">Chiave API di Brevo<input type="password" autoComplete="off" value={cfgB.apiKey || ''} onChange={e => setBrevoCfg({ ...cfgB, apiKey: e.target.value })} placeholder="incolla qui la chiave" className="mt-0.5 w-full px-2 py-1.5 border border-slate-300 rounded-md text-sm bg-white" /><span className="block mt-1 text-[11px]">Mittente e piè di pagina si impostano in "Scrivi al corso" (stessa configurazione).</span></label>}
                          <button type="button" onClick={() => inviaEmailPacchetto(p)} disabled={invioMsg || !emailOk(em)} className="w-full flex items-center justify-center gap-1.5 px-3 py-2 rounded-md text-sm font-bold bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white">✉ Invia con Brevo</button>
                        </div>
                        {!tel && !emailOk(em) && <div className="text-xs text-amber-700">Mancano telefono ed email in anagrafica: aggiornali da "Anagrafica".</div>}
                      </div>
                    </div>
                  </div>
                </div>
              );
            })()}

            {conflitto && (
              <div className="fixed inset-0 z-[70] bg-slate-900/50 flex items-center justify-center p-4" onClick={() => setConflitto(null)}>
                <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden" onClick={e => e.stopPropagation()}>
                  <div className="px-5 py-3 bg-[#1e3a5f] text-white font-bold">Due lezioni nello stesso giorno</div>
                  <div className="p-5 text-sm text-slate-700 space-y-2">
                    <p>Per il <b>{formatDate(conflitto.dati.data)}</b> c'è già una lezione registrata.</p>
                    <p>Vuoi <b>unificarle</b> in un'unica lezione da <b>1 ora</b>? Conta comunque come <b>2 lezioni</b> del pacchetto.</p>
                  </div>
                  <div className="px-5 py-3 bg-slate-50 border-t flex flex-wrap justify-end gap-2">
                    <button onClick={() => setConflitto(null)} className="px-3 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-md">Annulla</button>
                    <button onClick={() => { aggiungiLezione(conflitto.pid, conflitto.dati, 'nuova'); setConflitto(null); }} className="px-3 py-2 text-sm font-bold bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-md">Tieni separate</button>
                    <button onClick={() => { aggiungiLezione(conflitto.pid, conflitto.dati, 'unifica', conflitto.esisteId); setConflitto(null); }} className="px-3 py-2 text-sm font-bold bg-teal-600 hover:bg-teal-700 text-white rounded-md">Unifica (1 ora)</button>
                  </div>
                </div>
              </div>
            )}

            {form && (
              <div className="fixed inset-0 z-[60] bg-slate-900/40 flex items-center justify-center p-4" onClick={() => setForm(null)}>
                <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden" onClick={e => e.stopPropagation()}>
                  <div className="px-5 py-3 bg-[#1e3a5f] text-white font-bold flex justify-between items-center">{form.id ? 'Modifica pacchetto' : 'Nuovo pacchetto'}<button onClick={() => setForm(null)}><XIcon size={18}/></button></div>
                  <div className="p-5 space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Persona (dall'anagrafica)</label>
                      {form.socioKey ? (
                        <div className="flex items-center justify-between px-3 py-2 border border-slate-300 rounded-md bg-slate-50 text-sm font-semibold text-slate-800">{form.nome}<button onClick={() => setForm({ ...form, socioKey: '', nome: '', ricerca: '' })} className="text-xs text-blue-600 hover:underline">Cambia</button></div>
                      ) : (
                        <div className="relative">
                          <input type="text" autoFocus value={form.ricerca} onChange={e => setForm({ ...form, ricerca: e.target.value })} placeholder="Scrivi cognome o nome…" className="w-full px-3 py-2 border border-slate-300 rounded-md text-sm" />
                          {risultatiPersona.length > 0 && (
                            <div className="absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-md shadow-lg z-10 max-h-56 overflow-y-auto">
                              {risultatiPersona.map(a => <button key={a.key} onClick={() => setForm({ ...form, socioKey: a.key, nome: a.nome, ricerca: '' })} className="block w-full text-left px-3 py-2 text-sm hover:bg-slate-50">{a.nome}</button>)}
                            </div>
                          )}
                          {form.ricerca.trim().length >= 2 && risultatiPersona.length === 0 && <div className="mt-1 text-xs text-amber-700">Nessuna persona trovata in anagrafica.</div>}
                        </div>
                      )}
                      {form.socioKey && ['mancante', 'scaduto'].includes(statoCertificato(anagDi({ socioKey: form.socioKey }), oggiYMD).stato) && <div className="mt-1.5 text-xs font-semibold text-red-700">Attenzione: certificato medico {statoCertificato(anagDi({ socioKey: form.socioKey }), oggiYMD).stato === 'mancante' ? 'mancante' : 'scaduto'}. È obbligatorio anche per le lezioni private: lo puoi aggiornare dal dettaglio del pacchetto.</div>}
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Istruttore</label>
                      <input type="text" list="istruttori-privati" value={form.istruttore} onChange={e => setForm({ ...form, istruttore: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-md text-sm" />
                      <datalist id="istruttori-privati">{istrDisponibili.map(n => <option key={n} value={n} />)}</datalist>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Pacchetto</label>
                      <div className="flex gap-2">{[5, 10].map(n => <button key={n} onClick={() => setForm({ ...form, totale: n })} className={`flex-1 py-2 rounded-md text-sm font-bold border ${Number(form.totale) === n ? 'bg-[#1e3a5f] text-white border-[#1e3a5f]' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>{n} lezioni</button>)}</div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Acquistato il</label><input type="date" value={form.dataAcquisto} onChange={e => setForm({ ...form, dataAcquisto: e.target.value, scadenza: e.target.value ? aggiungiMesiYMD(e.target.value, 12) : form.scadenza })} className="w-full px-2 py-2 border border-slate-300 rounded-md text-sm"/></div>
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Scade il <span className="font-normal">(12 mesi)</span></label><input type="date" value={form.scadenza} onChange={e => setForm({ ...form, scadenza: e.target.value })} className="w-full px-2 py-2 border border-slate-300 rounded-md text-sm"/></div>
                    </div>
                    <div><label className="block text-xs font-semibold text-slate-500 mb-1">Note (facoltative)</label><input type="text" value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-md text-sm" placeholder="es. pagato in contanti, preferisce il martedì" /></div>
                  </div>
                  <div className="px-5 py-3 bg-slate-50 border-t flex justify-end gap-2">
                    <button onClick={() => setForm(null)} className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-md">Annulla</button>
                    <button onClick={salvaForm} className="px-4 py-2 text-sm font-bold bg-teal-600 hover:bg-teal-700 text-white rounded-md">Salva</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- PASSAGGIO DI LIVELLO IN BLOCCO (agisce sul "Livello attuale" degli iscritti del corso aperto) ---
    const PassaggioLivelloModal = ({ persone, attivitaId, attivita, onApplica, onClose }) => {
      const att = (attivita || []).find(a => a.id === attivitaId);
      const livelliAtt = (att && att.levels) || [];
      const [modo, setModo] = useState('successivo'); // 'successivo' | 'specifico'
      const [target, setTarget] = useState('');
      const [scelti, setScelti] = useState(() => new Set(persone.map(x => x.idx)));
      // Nuovo valore del campo livello per una persona, oppure null se non cambia.
      const nuovoLivello = (pers) => {
        const arr = livelliSocioArray(pers.livello);
        if (modo === 'successivo') {
          let cambiato = false;
          const out = arr.map(v => {
            const [aid, lv] = v.split(':');
            if (aid !== attivitaId) return v;
            const i = livelliAtt.findIndex(l => l.val === lv);
            if (i >= 0 && i < livelliAtt.length - 1) { cambiato = true; return aid + ':' + livelliAtt[i + 1].val; }
            return v;
          });
          return cambiato ? out.join(',') : null;
        }
        if (!target) return null;
        const [taid] = target.split(':');
        const resto = arr.filter(v => v.split(':')[0] !== taid);
        const out = [...resto, target].join(',');
        return out === arr.join(',') ? null : out;
      };
      const righe = persone.map(pers => ({ pers, nuovo: nuovoLivello(pers) }));
      const applicabili = righe.filter(r => r.nuovo !== null && scelti.has(r.pers.idx));
      const toggle = (idx) => setScelti(prev => { const n = new Set(prev); if (n.has(idx)) n.delete(idx); else n.add(idx); return n; });
      const lblLiv = (v) => etichettaLivelloSocio(v, attivita) || '—';
      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[80] flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-xl w-full max-w-6xl overflow-hidden flex flex-col h-[85vh] max-h-[800px]" onClick={e => e.stopPropagation()}>
            <div className="px-5 py-4 bg-indigo-600 text-white flex justify-between items-center">
              <h3 className="font-bold text-lg">Passaggio di livello</h3>
              <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full transition-colors"><XIcon size={20}/></button>
            </div>
            <div className="p-5 flex-1 min-h-0 flex flex-col gap-4">
              <div className="flex flex-col gap-2 shrink-0">
                <label className="flex items-center gap-2 text-sm cursor-pointer"><input type="radio" name="modoLiv" checked={modo === 'successivo'} onChange={() => setModo('successivo')} /> <b>Livello successivo</b> <span className="text-slate-400">(ognuno sale di un gradino{att ? ` in "${att.name}"` : ''})</span></label>
                <label className="flex items-center gap-2 text-sm cursor-pointer flex-wrap"><input type="radio" name="modoLiv" checked={modo === 'specifico'} onChange={() => setModo('specifico')} /> <b>Livello a scelta</b>
                  <select value={target} onChange={e => { setTarget(e.target.value); setModo('specifico'); }} className="px-2 py-1 border border-slate-300 rounded-md text-sm bg-white">
                    <option value="">Scegli…</option>
                    {(attivita || []).filter(a => a.levels && a.levels.length > 0).map(a => (
                      <optgroup key={a.id} label={a.name}>
                        {a.levels.map(l => <option key={a.id + l.val} value={a.id + ':' + l.val}>{l.noNumero ? l.name : `Liv. ${l.val} - ${l.name}`}</option>)}
                      </optgroup>
                    ))}
                  </select>
                </label>
              </div>
              <div className="border border-slate-200 rounded-xl overflow-hidden flex-1 min-h-0 flex flex-col">
                <div className="bg-slate-100 px-3 py-2 shrink-0 flex items-center justify-between text-xs font-bold text-slate-600 uppercase tracking-wide">
                  <span>Iscritti attivi</span>
                  <span className="flex gap-3 normal-case tracking-normal">
                    <button type="button" className="text-indigo-600 hover:underline" onClick={() => setScelti(new Set(persone.map(x => x.idx)))}>Tutti</button>
                    <button type="button" className="text-slate-500 hover:underline" onClick={() => setScelti(new Set())}>Nessuno</button>
                  </span>
                </div>
                <div className="divide-y divide-slate-100 flex-1 min-h-0 overflow-y-auto">
                  {righe.length === 0 && <div className="p-4 text-center text-sm text-slate-400 italic">Nessun iscritto attivo.</div>}
                  {righe.map(({ pers, nuovo }) => (
                    <label key={pers.idx} className={`flex items-center gap-3 px-3 py-2 ${nuovo === null ? 'opacity-50' : 'cursor-pointer hover:bg-slate-50'}`}>
                      <input type="checkbox" disabled={nuovo === null} checked={nuovo !== null && scelti.has(pers.idx)} onChange={() => toggle(pers.idx)} className="w-4 h-4 shrink-0" />
                      <span className="text-sm font-semibold text-slate-800 flex-1 min-w-0 truncate">{pers.nome}</span>
                      <span className="text-xs text-slate-500 w-40 truncate text-right">{lblLiv(pers.livello)}</span>
                      <span className="text-slate-300">→</span>
                      <span className={`text-xs w-40 truncate font-bold ${nuovo === null ? 'text-slate-400' : 'text-indigo-700'}`}>{nuovo === null ? (modo === 'specifico' && !target ? 'scegli un livello' : 'invariato') : lblLiv(nuovo)}</span>
                    </label>
                  ))}
                </div>
              </div>
              <p className="text-xs text-slate-400 shrink-0">Cambia solo il <b>Livello attuale</b> delle persone, non il corso in cui sono iscritte. Le modifiche restano in bozza nella finestra del corso: per renderle definitive premi <b>Salva Tutto</b> (con Annulla le scarti).</p>
            </div>
            <div className="px-5 py-3 border-t border-slate-200 flex justify-end gap-2 bg-slate-50">
              <button onClick={onClose} className="px-4 py-2 rounded-lg font-bold text-slate-600 hover:bg-slate-200 transition-colors">Annulla</button>
              <button disabled={applicabili.length === 0} onClick={() => onApplica(new Map(applicabili.map(r => [r.pers.idx, r.nuovo])))} className="px-4 py-2 rounded-lg font-bold bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white transition-colors">Applica a {applicabili.length} {applicabili.length === 1 ? 'persona' : 'persone'}</button>
            </div>
          </div>
        </div>
      );
    };

    // --- MESSAGGIO A TUTTO UN CORSO (WhatsApp uno per uno, con spunta di chi è già stato avvisato) ---
    const TEMPLATE_MSG_CORSO = [
      { nome: 'Libero', oggetto: 'Comunicazione dal Centro Federale Lampugnano - {corso}', testo: "Ciao {nome}, ti scriviamo per il corso di {corso} ({quando}).\n\n\n\nCentro Federale Lampugnano" },
      { nome: 'Cambio istruttore', oggetto: 'Cambio istruttore - {corso}', testo: "Ciao {nome}, ti informiamo che per il corso di {corso} ({quando}) cambia l'istruttore: da … in poi la lezione sarà tenuta da ….\n\nGrazie e a presto!\nCentro Federale Lampugnano" },
      { nome: 'Variazione orario', oggetto: 'Variazione di orario - {corso}', testo: "Ciao {nome}, ti informiamo che la lezione di {corso} ({quando}) subisce una variazione di orario: …\n\nGrazie per la comprensione e a presto!\nCentro Federale Lampugnano" },
      { nome: 'Iniziativa / evento', oggetto: 'Iniziativa per gli iscritti - {corso}', testo: "Ciao {nome}, ti segnaliamo un'iniziativa per gli iscritti al corso di {corso}: …\n\nTi aspettiamo!\nCentro Federale Lampugnano" },
    ];
    const MessaggioCorsoModal = ({ titolo, quando, persone, numeroPerWhatsapp, soloNomeProprio, mostraToast, brevoCfg, setBrevoCfg, onClose }) => {
      const [testo, setTesto] = useState(TEMPLATE_MSG_CORSO[0].testo);
      const [oggetto, setOggetto] = useState(TEMPLATE_MSG_CORSO[0].oggetto);
      const [avvisati, setAvvisati] = useState({});
      const [soloDaAvvisare, setSoloDaAvvisare] = useState(false);
      // Le spunte sono legate a corso + testo: cambiando messaggio si ricomincia, riaprendo lo stesso messaggio si ritrova lo stato.
      const chiaveMem = 'pv_msgcorso_' + titolo + '|' + quando + '|' + testo;
      useEffect(() => {
        let v = {};
        try { v = JSON.parse(localStorage.getItem(chiaveMem) || '{}') || {}; } catch (e) {}
        setAvvisati(v);
      }, [chiaveMem]);
      const salva = (nuovo) => { setAvvisati(nuovo); try { localStorage.setItem(chiaveMem, JSON.stringify(nuovo)); } catch (e) {} };
      const segna = (key, val) => { const n = { ...avvisati }; if (val) n[key] = true; else delete n[key]; salva(n); };
      const testoPer = (pers) => testo
        .replace(/\{nome\}/g, soloNomeProprio(pers.nome))
        .replace(/\{corso\}/g, titolo)
        .replace(/\{quando\}/g, quando);
      const daCompletare = testo.includes('…');
      // --- INVIO PER EMAIL (Brevo) ---
      const emailValida = (e) => /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(String(e || '').trim());
      const senzaEmail = persone.filter(x => !emailValida(x.email));
      // un indirizzo solo anche se condiviso da più persone (es. fratelli): ricordiamo tutte le persone che copre
      const destinatari = (() => {
        const m = new Map();
        persone.filter(x => emailValida(x.email)).forEach(x => {
          const e = x.email.trim().toLowerCase();
          if (!m.has(e)) m.set(e, { email: e, keys: [] });
          m.get(e).keys.push(x.key);
        });
        return Array.from(m.values());
      })();

    const sessoSuccessivo = (x) => x === 'M' ? 'F' : x === 'F' ? 'N' : 'M';
    const rilevaSesso = (nomeCompleto) => {
      const parti = String(nomeCompleto || '').trim().split(/\s+/).filter(Boolean);
      if (parti.length <= 1) return 'N';
      const particelle = ['da','dal','dalla','dallo','dai','dei','del','della','delle','dello','di','de','des','la','le','lo','van','von','mc','san','santa','ben','el','dos','das','do'];
      let idx = 1;
      while (idx < parti.length - 1 && particelle.includes(parti[idx - 1].toLowerCase())) idx++;
      const parole = parti.slice(idx).map(w => w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]/g, ''));
      for (const w of parole) {
        if (!w) continue;
        if (NOMI_M.has(w)) return 'M';
        if (NOMI_F.has(w)) return 'F';
        if (w.length > 5 && w.startsWith('maria') && !w.startsWith('mario')) return 'F';
        if (w.endsWith('a')) return 'F';
        if (w.endsWith('o') || w.endsWith('i')) return 'M';
      }
      return 'N';
    };

    // Applica le regole a tutto lo stato; restituisce gli STESSI oggetti se nulla cambia (evita giri a vuoto).
    const normalizzaDatiAnagrafici = (piani, arch, attesa) => {
      let cambiato = false;
      const sessoArch = {};
      Object.keys(arch || {}).forEach(k => { const a = arch[k]; if (a && a.sesso) sessoArch[k] = a.sesso; });
      const normP = (p) => {
        if (!p || typeof p !== 'object') return p;
        const nome = p.nome ? normalizzaNome(p.nome) : p.nome;
        const email = p.email ? normalizzaEmail(p.email) : p.email;
        let sesso = p.sesso;
        if (!sesso && p.nome) sesso = sessoArch[String(p.nome).toLowerCase().trim()] || rilevaSesso(nome);
        if (nome === p.nome && email === p.email && sesso === p.sesso) return p;
        cambiato = true;
        return { ...p, nome, email, sesso };
      };
      const nuoviPiani = {};
      Object.keys(piani || {}).forEach(st => {
        const stag = piani[st] || {};
        const nuovaStag = {};
        let stagCamb = false;
        Object.keys(stag).forEach(k => {
          const cell = stag[k];
          if (cell && cell.partecipanti && cell.partecipanti.length) {
            const nuovi = cell.partecipanti.map(normP);
            if (nuovi.some((x, i) => x !== cell.partecipanti[i])) { nuovaStag[k] = { ...cell, partecipanti: nuovi }; stagCamb = true; return; }
          }
          nuovaStag[k] = cell;
        });
        nuoviPiani[st] = stagCamb ? nuovaStag : stag;
      });
      const nuovoArch = {};
      Object.keys(arch || {}).forEach(k => { nuovoArch[k] = normP(arch[k]); });
      const nuovaAttesa = (attesa || []).map(c => {
        if (!c) return c;
        const nome = c.nome ? normalizzaNome(c.nome) : c.nome;
        const nomeGenitore = c.nomeGenitore ? normalizzaNome(c.nomeGenitore) : c.nomeGenitore;
        const email = c.email ? normalizzaEmail(c.email) : c.email;
        if (nome === c.nome && email === c.email && nomeGenitore === c.nomeGenitore) return c;
        cambiato = true;
        return { ...c, nome, nomeGenitore, email };
      });
      return cambiato ? { piani: nuoviPiani, arch: nuovoArch, attesa: nuovaAttesa, cambiato: true } : { piani, arch, attesa, cambiato: false };

    // Estrae l'anno di nascita da vari possibili formati: GG/MM/AAAA, GG-MM-AAAA, AAAA-MM-GG,
    // un oggetto Date (se il foglio Excel usa celle data vere), un numero seriale Excel, o un
    // anno a 4 cifre da solo.
    const estraiAnnoDaData = (valore) => {
      if (!valore) return '';
      if (valore instanceof Date && !isNaN(valore)) return String(valore.getFullYear());
      const s = String(valore).trim();
      let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
      if (m) return m[3];
      m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
      if (m) return m[1];
      m = s.match(/^(\d{4})$/);
      if (m) return m[1];
      const num = Number(s);
      if (!isNaN(num) && num > 1000 && num < 60000) {
        const d = new Date(Math.round((num - 25569) * 86400 * 1000));
        if (!isNaN(d)) return String(d.getUTCFullYear());
      }
      return '';
    };

    // Come sopra, ma restituisce la data completa in formato AAAA-MM-GG (stringa vuota se nel

    const estraiDataCompletaDaData = (valore) => {
      if (!valore) return '';
      const pad = (n) => String(n).padStart(2, '0');
      if (valore instanceof Date && !isNaN(valore)) return `${valore.getFullYear()}-${pad(valore.getMonth() + 1)}-${pad(valore.getDate())}`;
      const s = String(valore).trim();
      let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
      if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
      m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
      if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
      const num = Number(s);
      if (!isNaN(num) && num > 1000 && num < 60000) {
        const d = new Date(Math.round((num - 25569) * 86400 * 1000));
        if (!isNaN(d)) return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
      }
      return '';
    };

    // punto e virgola e tabulazione (i gestionali italiani usano spesso il punto e virgola).
    const parseCSV = (testo) => {
      const righeTesto = testo.split(/\r?\n/).filter(r => r.trim() !== '');
      if (righeTesto.length === 0) return [];
      const primaRiga = righeTesto[0];
      const separatore = [';', ',', '\t'].reduce((migliore, sep) =>
        (primaRiga.split(sep).length > primaRiga.split(migliore).length ? sep : migliore), ';');
      return righeTesto.map(riga => riga.split(separatore).map(c => c.trim().replace(/^"|"$/g, '')));
    };

      return `${d}/${m}/${y}`;

      inizioRef.setHours(0,0,0,0);
      const fineRef = new Date(inizioRef.getTime() + 6 * 24 * 60 * 60 * 1000);
      fineRef.setHours(23,59,59,999);

      return validList.some(isc => {
          const iStart = isc.inizio ? new Date(isc.inizio) : new Date(0);
          const iEnd = isc.fine ? new Date(isc.fine) : new Date(8640000000000000);

            for (let i = 0; i < ops.length; i += 400) {
                const bb = writeBatch(db);
                ops.slice(i, i + 400).forEach(([tipo, id]) => {
                    const r = doc(db, ...percorso, id);
                    if (tipo === 'set') bb.set(r, docsNuovi[id]); else bb.delete(r);
                });
                await bb.commit();
            }
            lastSavedDocs.current = strNuovi;
            updatedAtNoto.current = adessoISO; updatedAtServer.current = adessoISO;
            ultimiConteggi.current = nuoviC;
            const statoAppenaSalvato = JSON.stringify({ t: pianiDaSalvare, s: stagioniDaSalvare, def: stagionePredef, arch: archivioDaSalvare, la: listaAttesaDaSalvare });
            lastSavedPiano.current = statoAppenaSalvato;
            // Abbassiamo il flag "modifiche in sospeso" solo se, durante il salvataggio (che è
            // asincrono), l'utente non ha nel frattempo fatto altre modifiche.
            if (statoAppenaSalvato === ultimoStatoLocaleVisto.current) {
              hasModificheLocaliInSospeso.current = false;
            }
            setStatoSalvataggio('saved');
            setTimeout(() => setStatoSalvataggio('idle'), 3000);
        } catch (error) {
            console.error("Errore salvataggio cloud:", error);
            // L'errore resta visibile (indicatore in basso a destra) e il salvataggio viene
            // ritentato in automatico dopo 10 secondi, con gli stessi dati.
            setStatoSalvataggio('error');
            setTimeout(() => salvaInCloud(pianiDaSalvare, stagioniDaSalvare, stagionePredef, archivioDaSalvare, listaAttesaDaSalvare, tirocinantiDaSalvare), 10000);
        }
      };

      useEffect(() => {
        // CORREZIONE CRITICA: non facciamo NULLA (nemmeno alzare la bandierina "modifiche in
        // sospeso") finché il primo caricamento dei dati dal cloud non è completato. Prima,
        // questo controllo veniva fatto DOPO aver già alzato la bandierina: lo stato vuoto di
        // partenza (prima ancora di leggere Firestore) risultava sempre "diverso" dall'ultimo
        // salvato (anch'esso vuoto all'avvio), quindi la bandierina veniva alzata comunque. Il
        // guardiano nell'effetto di lettura cloud, vedendola alzata, rifiutava poi di applicare
        // i dati reali appena letti da Firestore — e il salvataggio automatico, sbloccato subito
        // dopo, finiva per scrivere lo stato ancora vuoto sopra ai dati reali, cancellandoli.
        if (!user || !firebaseInstances || !isDataLoaded) return;
        const currentStateStr = JSON.stringify({ t: tuttiPiani, s: stagioni, def: stagionePredefinita, arch: archivioSoci, la: listaAttesa });
        if (currentStateStr === lastSavedPiano.current) return; 
        // Registriamo lo stato locale più recente e segnaliamo che c'è una modifica da salvare:
        // questo impedisce all'onSnapshot di sovrascriverla nel frattempo (vedi BUGFIX sopra).
        ultimoStatoLocaleVisto.current = currentStateStr;
        hasModificheLocaliInSospeso.current = true;
        const timer = setTimeout(() => salvaInCloud(tuttiPiani, stagioni, stagionePredefinita, archivioSoci, listaAttesa), 1500);
        return () => clearTimeout(timer);
      }, [tuttiPiani, stagioni, stagionePredefinita, archivioSoci, listaAttesa, user, firebaseInstances, isDataLoaded]);

      // --- STATO BACKUP: data/ora dell'ultimo backup sul cloud (mostrata accanto al tasto Esporta / Importa) ---
      useEffect(() => {
        if (!user || !firebaseInstances || !isDataLoaded) return;
        let annullato = false;
        (async () => {
          try {
            const { db, appId, doc, getDoc } = firebaseInstances;
            const percorso = ['artifacts', appId, 'users', user.uid, 'datiPianoVasca'];
            const slots = [];
            for (let i = 0; i < 30; i++) slots.push('d' + i);
            for (let i = 0; i < 10; i++) slots.push('x' + i);
            const metas = await Promise.all(slots.map(sl => getDoc(doc(db, ...percorso, `bk2_${sl}__meta`)).catch(() => null)));
            let ultimo = '';
            metas.forEach(sn => { if (sn && sn.exists()) { const t = sn.data().backupAt || ''; if (t > ultimo) ultimo = t; } });
            if (!annullato) setUltimoBackupAt(prev => (prev && prev > ultimo) ? prev : (ultimo || null));
          } catch (err) { console.error('Lettura stato backup non riuscita:', err); }
        })();
        return () => { annullato = true; };
      }, [user, firebaseInstances, isDataLoaded]);

      // --- TIROCINANTI: documento cloud dedicato 'tirocinanti_v1' (letto e salvato per conto suo) ---
      useEffect(() => {
        if (!user || !firebaseInstances) return;
        const { db, appId, doc, onSnapshot } = firebaseInstances;
        const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'datiPianoVasca', 'tirocinanti_v1');
        const unsub = onSnapshot(ref, (snap) => {
          if (snap.metadata.hasPendingWrites) return;
          if (snap.exists()) {
            const lista = snap.data().tirocinanti || [];
            if (!tiPending.current) { lastSavedTi.current = JSON.stringify(lista); setTirocinanti(lista); }
          } else if (!tiPending.current) { lastSavedTi.current = JSON.stringify([]); }
          setTiLoaded(true);
        }, (err) => { console.error('Errore lettura tirocinanti:', err); });
        return () => unsub();
      }, [user, firebaseInstances]);
      useEffect(() => {
        if (!tiLoaded || !user || !firebaseInstances) return;
        const str = JSON.stringify(tirocinanti);
        if (str === lastSavedTi.current) return;
        tiPending.current = true;
        const timer = setTimeout(async () => {
          try {
            const { db, appId, doc, setDoc } = firebaseInstances;
            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'datiPianoVasca', 'tirocinanti_v1'), { tirocinanti: JSON.parse(str), updatedAt: new Date().toISOString() });
            lastSavedTi.current = str;
            if (JSON.stringify(tirocinantiRef.current) === str) tiPending.current = false;
          } catch (err) { console.error('Salvataggio tirocinanti non riuscito:', err); mostraToast('Salvataggio tirocinanti non riuscito: riprovo.', 'error'); setTiRetry(n => n + 1); }
        }, 700);
        return () => clearTimeout(timer);
      }, [tirocinanti, tiLoaded, tiRetry, user, firebaseInstances]);

      // --- CHIUSURE: documento cloud dedicato 'chiusure_v1' ---
      const chiusureSync = useDocDedicato('chiusure_v1', chiusure, setChiusure, user, firebaseInstances, mostraToast);
      // --- LEZIONI PRIVATE: documento cloud dedicato 'private_v1' ---
      const privateSync = useDocDedicato('private_v1', lezioniPrivate, setLezioniPrivate, user, firebaseInstances, mostraToast);
      const liberoSync = useDocDedicato('libero_v1', nuotoLibero, setNuotoLibero, user, firebaseInstances, mostraToast);
      // Impostazioni di Brevo (servizio di invio email). Contiene la chiave segreta: sta in un documento cloud protetto dal login
      // e NON entra nei backup né nelle esportazioni.
      const [brevoCfg, setBrevoCfg] = useState({ apiKey: '', mittenteNome: 'Centro Federale Lampugnano', mittenteEmail: 'info.cflampugnano@gmail.com', replyTo: 'info.cflampugnano@gmail.com' });
      useDocDedicato('brevo_v1', brevoCfg, setBrevoCfg, user, firebaseInstances, mostraToast);

      // --- NORMALIZZAZIONE DATI: nomi con iniziali maiuscole ed email in minuscolo (anche per i dati già presenti) ---
      useEffect(() => {
        if (!isDataLoaded) return;
        const r = normalizzaDatiAnagrafici(tuttiPiani, archivioSoci, listaAttesa);
        if (r.cambiato) {
          setTuttiPiani(r.piani);
          setArchivioSoci(r.arch);
          setListaAttesa(r.attesa);
        }
      }, [tuttiPiani, archivioSoci, listaAttesa, isDataLoaded]);

      // --- AVVISO DI USCITA CON MODIFICHE NON SALVATE ---
      // Il salvataggio è "debounced" (aspetta ~1,5s di inattività prima di scrivere su
      // Firestore): se l'utente chiude o ricarica la pagina troppo in fretta dopo una modifica
      // (es. subito dopo aver creato una nuova stagione), quella modifica rischia di non fare
      // in tempo a salvarsi. Il browser mostrerà un avviso nativo in quel caso.
      useEffect(() => {
        const handleBeforeUnload = (e) => {
          if (hasModificheLocaliInSospeso.current || tiPending.current || chiusureSync.inAttesa.current || privateSync.inAttesa.current || liberoSync.inAttesa.current) {
            e.preventDefault();
            e.returnValue = '';
            return '';
          }
        };
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, []);

      // --- CALCOLATORI DI TEMPO E VISTE ---
      const TIME_OPTIONS = useMemo(() => {
        const opts = [];
        let currentMin = START_MIN_TOTAL;
        while (currentMin < END_MIN_TOTAL) {
          const h = Math.floor(currentMin / 60);
          const m = currentMin % 60;
          opts.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
          currentMin += 15;
        }
        return opts;
      }, []);

      const fasceOrarie = useMemo(() => {
        const fasce = [];
        let currentMin = START_MIN_TOTAL;
        while (currentMin < END_MIN_TOTAL) {
          const h = Math.floor(currentMin / 60);
          const m = currentMin % 60;
          const start = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          
          let nextMin = currentMin + intervallo;
          let endH = Math.floor(nextMin / 60);
          let endM = nextMin % 60;
          if (nextMin > END_MIN_TOTAL) {
              endH = Math.floor(END_MIN_TOTAL / 60);
              endM = END_MIN_TOTAL % 60;
          }

          const end = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
          fasce.push({ id: start, label: `${start} - ${end}` });
          currentMin = nextMin;
        }
        return fasce;
      }, [intervallo]);

      // Identifica in modo univoco un "corso" specifico (attività + livello/nome), con la stessa
      // etichetta mostrata nel riquadro sulla griglia. Usata per il filtro granulare per corso.
      const chiaveELabelCorso = useCallback((cellData) => {
          if (!cellData || !cellData.id) return null;
          const key = `${cellData.id}::${cellData.livello || ''}`;
          const info = attivita.find(a => a.id === cellData.id);
          const livelloInfo = info?.levels?.find(l => l.val === cellData.livello);
          const nomeLivello = info?.isFreeTextLevel ? cellData.livello : livelloInfo?.name;
          const mostraSoloNome = (cellData.id === 'acquagym' || cellData.id === 'propaganda' || info?.isFreeTextLevel || livelloInfo?.noNumero);
          let label;
          if (nomeLivello) {
              label = mostraSoloNome ? nomeLivello : `Liv. ${cellData.livello} - ${nomeLivello}`;
          } else {
              label = info ? info.name : cellData.id;
          }
          return { key, label, attivitaId: cellData.id, attivitaNome: info ? info.name : cellData.id };
      }, [attivita]);

      // Un corso è fuori dal filtro se il suo tipo/livello è escluso OPPURE (se ci sono istruttori scelti) il suo istruttore non è tra quelli.
      const fuoriFiltro = (cell) => {
          if (corsiEsclusiFiltro.includes(chiaveELabelCorso(cell)?.key)) return true;
          if (istruttoriFiltro.length > 0 && !istruttoriFiltro.includes(String((cell && cell.istruttore) || '').trim())) return true;
          return false;
      };

      // --- LOGICA RICOSTRUZIONE ASSOLUTA CORSI ---
      const getCorsiForDay = useCallback((giornoIdx) => {
          const activeCorsie = vascaSelezionata === 'interna' ? CORSIE_INTERNA : CORSIE_ESTERNA;
          const corsi = [];
          
          // Data esatta del giorno visualizzato in questa colonna della griglia
          const dataGiornoEsatto = new Date(inizioSettimana.getTime() + giornoIdx * 24 * 60 * 60 * 1000);
          const dataGiornoYMD = toYMD(dataGiornoEsatto);

          activeCorsie.forEach(corsia => {
              const keys = Object.keys(piano).filter(k => k.startsWith(`${vascaSelezionata}-${giornoIdx}-`) && k.endsWith(`-${corsia}`));
              keys.sort((a, b) => a.split('-')[2].localeCompare(b.split('-')[2])); 

              let currentCourseEndMin = -1;
              let currentCourse = null;

              keys.forEach(k => {
                  const timeStr = k.split('-')[2];
                  const [h, m] = timeStr.split(':').map(Number);
                  const startMin = h * 60 + m;
                  const cell = piano[k];
                  
                  // In modalità "nascondi" i corsi non selezionati vengono esclusi dalla griglia
                  // (comportamento originale). In modalità "evidenzia" restano tutti visibili: verranno
                  // solo attenuati graficamente in fase di rendering, senza spezzare la struttura della griglia.
                  if (modalitaFiltro === 'nascondi' && fuoriFiltro(cell)) return;

                  // --- FILTRO CALENDARIO ---
                  const isInizioValido = !cell.dataInizio || cell.dataInizio <= dataGiornoYMD;
                  const isFineValida = !cell.dataFine || cell.dataFine >= dataGiornoYMD;
                  if (!isInizioValido || !isFineValida) return; // Salta se il corso non è attivo oggi
                  if (Array.isArray(cell.dateEscluse) && cell.dateEscluse.includes(dataGiornoYMD)) return; // settimana saltata (eliminato solo per quella data)

                  const durata = cell.durata || 45; 
                  
                  if (startMin < currentCourseEndMin && isSameCourse(cell, currentCourse?.data)) {
                      currentCourse.keys.push(k);
                      currentCourseEndMin = Math.max(currentCourseEndMin, startMin + durata);
                      return;
                  }

                  currentCourse = {
                      oraInizio: timeStr,
                      startMin: startMin,
                      durata: durata,
                      corsia: corsia,
                      data: cell,
                      keys: [k]
                  };
                  corsi.push(currentCourse);
                  currentCourseEndMin = startMin + durata;
              });
          });

          const corsiUnici = [];
          const byStartMin = {};
          corsi.forEach(c => {
              if (!byStartMin[c.startMin]) byStartMin[c.startMin] = [];
              byStartMin[c.startMin].push(c);
          });

          Object.keys(byStartMin).forEach(startMin => {
              const corsiAtTime = byStartMin[startMin];
              corsiAtTime.sort((a, b) => activeCorsie.indexOf(a.corsia) - activeCorsie.indexOf(b.corsia));
              
              const grouped = [];
              corsiAtTime.forEach(c => {
                  let placed = false;
                  for (let g of grouped) {
                      if (isSameCourse(g.data, c.data) && g.durata === c.durata) {
                          const lastCorsiaIdx = activeCorsie.indexOf(g.corsie[g.corsie.length - 1]);
                          const myCorsiaIdx = activeCorsie.indexOf(c.corsia);
                          if (myCorsiaIdx === lastCorsiaIdx + 1) { 
                              g.corsie.push(c.corsia);
                              g.keys.push(...c.keys);
                              placed = true;
                              break;
                          }
                      }
                  }
                  if (!placed) {
                      grouped.push({
                          oraInizio: c.oraInizio,
                          startMin: c.startMin,
                          durata: c.durata,
                          data: c.data,
                          corsie: [c.corsia],
                          keys: [...c.keys]
                      });
                  }
              });
              corsiUnici.push(...grouped);
          });

          return corsiUnici;
      }, [piano, vascaSelezionata, corsiEsclusiFiltro, istruttoriFiltro, modalitaFiltro, chiaveELabelCorso, inizioSettimana]);

      const corsiOggi = useMemo(() => {
          if (giornoSelezionato === 7) return [];
          return getCorsiForDay(giornoSelezionato);
      }, [getCorsiForDay, giornoSelezionato]);

      // --- LOGICA UTENTE RAPIDO E AUTOSUGGERIMENTO ---
      // Elenco dei corsi realmente presenti nel piano della stagione corrente, raggruppati per
      // attività, da usare come opzioni nel filtro (così riflette sempre "come sono ora").
      const elencoIstruttori = useMemo(() => {
          const set = new Set();
          Object.values(piano).forEach(cell => { const n = String((cell && cell.istruttore) || '').trim(); if (n) set.add(n); });
          return Array.from(set).sort((a, b) => a.localeCompare(b, 'it'));
      }, [piano]);

      // Anagrafiche per le lezioni private (solo quando il modale è aperto, per non pesare sul resto)
      const anagrafichePrivate = useMemo(() => {
          if (!isPrivateOpen) return [];
          const arc = archivioCompleto(archivioSoci, tuttiPiani);
          return Object.keys(arc).map(k => ({ ...(arc[k] || {}), key: k, nome: (arc[k] && arc[k].nome) || k, telefono: (arc[k] && arc[k].telefono) || '', email: (arc[k] && arc[k].email) || '' })).sort((a, b) => a.nome.localeCompare(b.nome, 'it'));
      }, [isPrivateOpen, archivioSoci, tuttiPiani]);

      // Dalle lezioni private: apre la scheda anagrafica "classica" della persona
      const apriSchedaPrivate = (key, nome) => {
          let part = null;
          tuttiCorsiSelect.some(c => (c.data.partecipanti || []).some(p => { if (p && p.nome && p.nome.toLowerCase().trim() === key) { part = p; return true; } return false; }));
          const arc = archivioCompleto(archivioSoci, tuttiPiani)[key] || {};
          setSchedaSocio({ ...(part || { nome, ...arc }), nome: (part && part.nome) || nome, documentiFirmati: (part && part.documentiFirmati) || (arc.docStagioni && arc.docStagioni[stagioneSelezionata]) || '', _daPrivate: true });
      };
      // "Modifica anagrafica" dalla scheda: se la persona ha un corso si apre il solito "Modifica Partecipante", altrimenti un modulo con gli stessi campi
      const modificaAnagraficaDaScheda = (sc) => {
          const key = String(sc.nome || '').toLowerCase().trim();
          const corso = tuttiCorsiSelect.find(c => (c.data.partecipanti || []).some(p => p && p.nome && p.nome.toLowerCase().trim() === key));
          setSchedaSocio(null);
          if (corso) { setIsPrivateOpen(false); apriCorsoDaRicerca(corso, sc.nome, true); return; }
          const a = archivioCompleto(archivioSoci, tuttiPiani)[key] || {};
          setFormAnagPriv({ key, nome: sc.nome, dataNascita: a.dataNascita || '', anno: a.anno || '', telefono: a.telefono || '', email: a.email || '', scadCertificato: a.scadCertificato || '', card: a.card || '', documentiFirmati: (a.docStagioni && a.docStagioni[stagioneSelezionata]) || '' });
      };
      const [formAnagPriv, setFormAnagPriv] = useState(null);
      const salvaFormAnagPriv = () => {
          const f = formAnagPriv;
          if (f.email && !/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(f.email.trim())) { mostraToast("L'indirizzo email non è valido.", 'error'); return; }
          salvaAnagraficaPrivate(f.key, { dataNascita: f.dataNascita, anno: f.dataNascita ? f.dataNascita.slice(0, 4) : f.anno, telefono: f.telefono.trim(), email: f.email.trim().toLowerCase(), scadCertificato: f.scadCertificato, card: f.card, docFirmati: f.documentiFirmati });
          setFormAnagPriv(null);
          mostraToast('Anagrafica aggiornata.', 'success');
      };
      // Modifica diretta dell'anagrafica di una persona (anche se non è iscritta a nessun corso)
      const salvaAnagraficaPrivate = (key, campi) => {
          setArchivioSoci(prev => {
              const completo = archivioCompleto(prev, tuttiPiani);
              const base = completo[key] || { nome: key };
              const { docFirmati, ...resto } = campi;
              const docStagioni = { ...(base.docStagioni || {}) };
              if (docFirmati !== undefined) docStagioni[stagioneSelezionata] = docFirmati;
              return { ...prev, [key]: { ...base, ...resto, docStagioni, sesso: base.sesso || rilevaSesso(base.nome || key) } };
          });
      };

      const corsiRaggruppatiPerFiltro = useMemo(() => {
          const map = new Map();
          Object.values(piano).forEach(cell => {
              const info = chiaveELabelCorso(cell);
              if (info && !map.has(info.key)) map.set(info.key, info);
          });
          const lista = Array.from(map.values()).sort((a, b) => {
              const c = a.attivitaNome.localeCompare(b.attivitaNome);
              return c !== 0 ? c : a.label.localeCompare(b.label, undefined, { numeric: true });
          });
          const gruppi = [];
          lista.forEach(c => {
              let gruppo = gruppi.find(g => g.attivitaNome === c.attivitaNome);
              if (!gruppo) { gruppo = { attivitaNome: c.attivitaNome, corsi: [] }; gruppi.push(gruppo); }
              gruppo.corsi.push(c);
          });
          return gruppi;
      }, [piano, chiaveELabelCorso]);

      const tuttiUtentiUnici = useMemo(() => {
          const map = new Map();
          Object.values(piano).forEach(cell => {
             (cell.partecipanti || []).forEach(p => {
                 if (p && p.nome) {
                     const key = p.nome.toLowerCase().trim();
                     if (!map.has(key)) {
                         map.set(key, p);
                     }
                 }
             });
          });
          return Array.from(map.values()).sort((a,b) => a.nome.localeCompare(b.nome));
      }, [piano]);

      // Lista per l'autocompletamento nomi: unione dell'archivio soci permanente (tutte le
      // stagioni) e degli iscritti della stagione corrente, deduplicata per nome.
      const listaAutocompletamentoSoci = useMemo(() => {
          const map = new Map();
          Object.values(archivioSoci).forEach(u => {
              if (u && u.nome) map.set(u.nome.toLowerCase().trim(), u);
          });
          tuttiUtentiUnici.forEach(u => {
              const key = u.nome.toLowerCase().trim();
              if (u && u.nome && !map.has(key)) map.set(key, u);
          });
          return Array.from(map.values()).sort((a, b) => a.nome.localeCompare(b.nome));
      }, [archivioSoci, tuttiUtentiUnici]);

      // Cerca un socio già noto (per nome, senza distinguere maiuscole/spazi) nell'archivio
      // permanente o, in mancanza, tra gli iscritti della stagione corrente.
      const cercaSocioArchivio = useCallback((val) => {
          if (!val) return null;
          const key = val.toLowerCase().trim();
          return archivioSoci[key] || tuttiUtentiUnici.find(u => u.nome.toLowerCase().trim() === key) || null;
      }, [archivioSoci, tuttiUtentiUnici]);

      // Crea o aggiorna la scheda di un socio nell'archivio permanente. Se l'anno di nascita o
      // il certificato vengono lasciati vuoti, mantiene il valore già presente in archivio
      // invece di cancellarlo: evita di perdere dati già noti per una semplice dimenticanza.
      const aggiornaArchivioSoci = useCallback((nome, anno, scadCertificato, card, telefono, dataNascita, email, sesso, livelloSocio) => {
          if (!nome || !nome.trim()) return;
          const key = nome.toLowerCase().trim();
          setArchivioSoci(prev => {
              const esistente = prev[key];
              return {
                  ...prev,
                  [key]: {
                      nome: normalizzaNome(nome),
                      anno: anno || (esistente ? esistente.anno : '') || '',
                      dataNascita: dataNascita || (esistente ? esistente.dataNascita : '') || '',
                      scadCertificato: scadCertificato || (esistente ? esistente.scadCertificato : '') || '',
                      card: card || (esistente ? esistente.card : '') || '',
                      telefono: telefono || (esistente ? esistente.telefono : '') || '',
                      email: normalizzaEmail(email || (esistente ? esistente.email : '') || ''),
                      sesso: sesso || (esistente ? esistente.sesso : '') || rilevaSesso(nome),
                      livelloSocio: livelloSocio !== undefined ? (livelloSocio || '') : ((esistente && esistente.livelloSocio) || ''),
                      ...((esistente && esistente.docStagioni) ? { docStagioni: esistente.docStagioni } : {}),
                      certMsgScad: (esistente && esistente.certMsgScad) || '',
                      rinnovoMsgFine: (esistente && esistente.rinnovoMsgFine) || '',
                      auguriMsgData: (esistente && esistente.auguriMsgData) || ''
                  }
              };
          });
      }, []);

      // --- IMPORTAZIONE SOCI DA FILE (Excel/CSV) ---
      // Elabora le righe già lette dal file (array di array: [cognome, nome, dataNascita, ...])
      // e costruisce un'anteprima da mostrare all'utente PRIMA di scrivere qualunque cosa
      // nell'archivio: niente viene salvato finché non viene confermato esplicitamente.
      const elaboraRigheImportazioneSoci = useCallback((righe) => {
          if (!righe || righe.length === 0) {
              alert("Il file sembra vuoto o non leggibile.");
              return;
          }
          // Rileva ed esclude un'eventuale riga di intestazione: se la terza colonna della
          // prima riga non contiene una data riconoscibile, la trattiamo come intestazione.
          let startIdx = 0;
          if (!estraiAnnoDaData(righe[0] ? righe[0][2] : '')) startIdx = 1;

          const map = {};
          let nuovi = 0, aggiornati = 0, scartati = 0;
          const esempi = [];

          for (let i = startIdx; i < righe.length; i++) {
              const riga = righe[i] || [];
              const cognome = (riga[0] || '').toString().trim();
              const nomeProprio = (riga[1] || '').toString().trim();
              const anno = estraiAnnoDaData(riga[2]);
