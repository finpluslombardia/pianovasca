          const corso = tuttiCorsiSelect.find(c => (c.data.partecipanti || []).some(p => p && p.nome && p.nome.toLowerCase().trim() === key));
          if (!corso) { alert('Non trovo il corso di questa persona nella stagione selezionata.'); return; }
          apriCorsoDaRicerca(corso, u.nome, true);
      };

      const bottoneModificaAnagrafica = (u) => (
          <button type="button" onClick={() => modificaAnagraficaDaScadenza(u)} title="Modifica anagrafica (aggiorna certificato, dati, ecc.)" className="shrink-0 w-8 h-8 rounded-full flex items-center justify-center bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors"><EditIcon size={16}/></button>
      );

      // --- LOGICA AGGIUNTA NUOVO CORSO ---
      const salvaNuovoCorso = (e) => {
        e.preventDefault();
        if (nuovoCorso.giorni.length === 0) {
            alert("Seleziona almeno un giorno!");
            return;
        }
        if (nuovoCorso.corsie.length === 0) {
            alert("Seleziona almeno una corsia!");
            return;
        }

        // BUGFIX: controlliamo PRIMA di salvare se una delle celle scelte (giorno/ora/corsia)
        // è già occupata da un altro corso. Senza questo controllo la cella esistente veniva
        // sovrascritta e cancellata silenziosamente, iscritti compresi.
        const conflitti = [];
        nuovoCorso.giorni.forEach(g => {
            nuovoCorso.corsie.forEach(c => {
                const key = `${nuovoCorso.vasca}-${g}-${nuovoCorso.oraInizio}-${c}`;
                const esistente = piano[key];
                if (esistente) {
                    const nIscritti = (esistente.partecipanti || []).length;
                    conflitti.push(`${GIORNI[g]} ${nuovoCorso.oraInizio} - Corsia ${c}${nIscritti > 0 ? ` (${nIscritti} iscritti)` : ''}`);
                }
            });
        });
        if (conflitti.length > 0) {
            const conferma = window.confirm(
                `Attenzione: in queste corsie/orari è già presente un corso, che verrebbe SOSTITUITO (con eventuali iscritti persi):\n\n${conflitti.join('\n')}\n\nVuoi continuare comunque e sovrascriverli?`
            );
            if (!conferma) return;
        }
        
        setTuttiPiani(prevTutti => {
            const prevSeason = prevTutti[stagioneSelezionata] || {};
            const nuovoPiano = { ...prevSeason };
            
            nuovoCorso.giorni.forEach(g => {
                nuovoCorso.corsie.forEach(c => {
                    nuovoPiano[`${nuovoCorso.vasca}-${g}-${nuovoCorso.oraInizio}-${c}`] = { 
                        id: nuovoCorso.attivitaId, 
                        istruttore: nuovoCorso.istruttore.trim(), 
                        livello: nuovoCorso.livello,
                        durata: Number(nuovoCorso.durata),
                        maxUtenti: nuovoCorso.maxUtenti ? Number(nuovoCorso.maxUtenti) : '',
                        dataInizio: nuovoCorso.dataInizio,
                        dataFine: nuovoCorso.dataFine,
                        partecipanti: [] // Inizializza array vuoto
                    };
                });
            });
            return { ...prevTutti, [stagioneSelezionata]: nuovoPiano };
        });

        setIsAddModalOpen(false);
        setNuovoCorso(prev => ({...prev, corsie: [], giorni: [], istruttore: '', livello: '', maxUtenti: '', dataInizio: '', dataFine: '', vasca: vascaSelezionata}));
        mostraToast("Corso creato con successo!");
      };

      // --- LOGICA MODIFICA/ELIMINA CORSO E PARTECIPANTI ---
      const handleClickCorso = (e, corso) => {
        e.stopPropagation();
        const info = attivita.find(a => a.id === corso.data.id);
        const vascaOriginale = corso.keys[0].split('-')[0];
        const giornoOriginale = Number(corso.keys[0].split('-')[1]);
        
        // BUGFIX: prima di mostrare la lista iscritti, la "rinfreschiamo" con i dati più
        // recenti dell'archivio soci permanente. Senza questo, se il certificato di una persona
        // era stato aggiornato in UN ALTRO corso, qui si vedrebbe ancora il valore vecchio
        // salvato in QUESTO corso — e salvando (anche senza toccare quella persona), quel valore
        // vecchio veniva ripropagato ovunque dalla sincronizzazione globale, cancellando
        // l'aggiornamento più recente fatto altrove.
        const partecipantiOrdinati = [...(corso.data.partecipanti || [])]
          .map(p => {
              if (!p || !p.nome) return p;
              const inArchivio = archivioSoci[p.nome.toLowerCase().trim()];
              if (!inArchivio) return p;
              return {
                  ...p,
                  anno: inArchivio.anno || p.anno,
                  dataNascita: inArchivio.dataNascita || p.dataNascita || '',
                  sesso: inArchivio.sesso || p.sesso || '',
                  livelloSocio: inArchivio.livelloSocio || p.livelloSocio || '',
                  scadCertificato: inArchivio.scadCertificato || p.scadCertificato,
                  card: inArchivio.card || p.card || '',
                  telefono: inArchivio.telefono || p.telefono || '',
                  email: inArchivio.email || p.email || ''
              };
          })
          .sort((a, b) => a.nome.localeCompare(b.nome));

        setEditModal({
          corsoOriginale: corso,
          vasca: vascaOriginale,
          attivitaId: corso.data.id,
          giorno: giornoOriginale,
          oraInizio: corso.oraInizio,
          durata: corso.durata,
          maxUtenti: corso.data.maxUtenti || '',
          corsie: [...corso.corsie],
          istruttore: corso.data.istruttore || '',
          livello: corso.data.livello || '',
          dataInizio: corso.data.dataInizio || '',
          dataFine: corso.data.dataFine || '',
          dateEscluse: [...(corso.data.dateEscluse || [])],
          dataOccorrenza: toYMD(new Date(inizioSettimana.getTime() + giornoOriginale * 24 * 60 * 60 * 1000)),
          infoAttivita: info,
          partecipanti: partecipantiOrdinati,
          tab: 'iscritti' // Apre di default la scheda degli iscritti
        });
        setNuovoPartecipante({ nome: '', anno: '', dataNascita: '', scadCertificato: '', documentiFirmati: '', card: '', telefono: '', email: '', iscrizioni: [{inizio: '', fine: ''}] });
        setEditingPartecipanteIndex(null);
        setShowAddForm(false);
      };

      const aggiungiPartecipante = () => {
        if (!nuovoPartecipante.nome.trim()) return;

        const partecipantePulito = {
            ...nuovoPartecipante,
            nome: normalizzaNome(nuovoPartecipante.nome),
            email: normalizzaEmail(nuovoPartecipante.email),
            sesso: nuovoPartecipante.sesso || rilevaSesso(normalizzaNome(nuovoPartecipante.nome)),
            livelloSocio: nuovoPartecipante.livelloSocio || '',
            iscrizioni: (nuovoPartecipante.iscrizioni || []).filter(i => i.inizio || i.fine)
        };

        setEditModal(prev => {
          let nuoviPartecipanti = [...prev.partecipanti];
          if (editingPartecipanteIndex !== null) {
            // Stiamo modificando una persona già presente nel corso (es. certificato, documenti,
            // tessera): la data di primo inserimento NON va mai toccata, qualunque sia il suo valore
            // attuale (anche se mancante, perché aggiunta prima dell'introduzione di questo campo).
            nuoviPartecipanti[editingPartecipanteIndex] = { ...partecipantePulito, dataAggiunta: nuoviPartecipanti[editingPartecipanteIndex]?.dataAggiunta || '' };
          } else {
            // Nuovo inserimento vero e proprio: qui, e solo qui, registriamo la data odierna.
            nuoviPartecipanti.push({ ...partecipantePulito, dataAggiunta: toYMD(new Date()) });
          }

          // Mantiene l'ordine alfabetico
          nuoviPartecipanti.sort((a, b) => a.nome.localeCompare(b.nome));

          return { ...prev, partecipanti: nuoviPartecipanti, tab: 'iscritti' };
        });
        
        setNuovoPartecipante({ nome: '', anno: '', dataNascita: '', scadCertificato: '', documentiFirmati: '', card: '', telefono: '', email: '', iscrizioni: [{inizio: '', fine: ''}] });
        setEditingPartecipanteIndex(null);
        setShowAddForm(false);
      };

      const avviaModificaPartecipante = (idx) => {
        scrollIscrittiPos.current = contenitoriScorrevoli(scrollIscrittiRef.current).map(el => el.scrollTop);
        const p = editModal.partecipanti[idx];
        let iscrizioni = p.iscrizioni && p.iscrizioni.length > 0 ? [...p.iscrizioni] : (p.scadIscrizione ? [{ inizio: '', fine: p.scadIscrizione }] : [{ inizio: '', fine: '' }]);
        setNuovoPartecipante({ ...p, iscrizioni });
        setEditingPartecipanteIndex(idx);
        setShowAddForm(true);
        setEditModal(prev => prev ? { ...prev, tab: 'partecipante' } : prev);
      };

      const annullaModificaPartecipante = () => {
        setNuovoPartecipante({ nome: '', anno: '', dataNascita: '', scadCertificato: '', documentiFirmati: '', card: '', telefono: '', email: '', iscrizioni: [{inizio: '', fine: ''}] });
        setEditingPartecipanteIndex(null);
        setShowAddForm(false);
        setEditModal(prev => prev ? { ...prev, tab: 'iscritti' } : prev);
      };

      const rimuoviPartecipante = (idx) => {
        setEditModal(prev => ({
          ...prev,
          partecipanti: prev.partecipanti.filter((_, i) => i !== idx)
        }));
        if (editingPartecipanteIndex === idx) {
          annullaModificaPartecipante();
        } else if (editingPartecipanteIndex > idx) {
          setEditingPartecipanteIndex(prev => prev - 1);
        }
      };

      // Sposta un iscritto dal corso aperto a un altro corso della stessa stagione: viene aggiunto subito al corso
      // di destinazione e tolto da questo (sia dall'elenco aperto sia dalle celle salvate), così anche "Annulla" resta coerente.
      const spostaPartecipante = (idx, corsoDest) => {
        const p = editModal && editModal.partecipanti[idx];
        if (!p) return;
        const nomeKey = String(p.nome || '').toLowerCase().trim();
        if ((corsoDest.data.partecipanti || []).some(x => String(x.nome || '').toLowerCase().trim() === nomeKey)) {
            alert(`${p.nome} è già iscritto/a a quel corso.`);
            return;
        }
        const max = Number(corsoDest.data.maxUtenti) || 0;
        const attivi = (corsoDest.data.partecipanti || []).filter(x => isAttivoInSettimana(x, inizioSettimana)).length;
        if (max > 0 && attivi >= max && !window.confirm(`Il corso di destinazione è al completo (${attivi}/${max}). Spostare comunque ${p.nome}?`)) return;
        const infoD = attivita.find(a => a.id === corsoDest.data.id);
        const etichettaD = `${GIORNI[corsoDest.giorno]} ${corsoDest.oraInizio} · ${infoD ? infoD.name : 'Corso'}`;
        // Etichetta del corso di provenienza (per il messaggio "Spostamenti" in Oggi)
        const infoO = attivita.find(a => a.id === editModal.attivitaId);
        const nomeLivO = infoO && (infoO.isFreeTextLevel ? editModal.livello : (infoO.levels || []).find(l => l.val === editModal.livello)?.name);
        const daEtichetta = `${infoO ? infoO.name : 'Corso'}${nomeLivO ? ' - ' + nomeLivO : ''} (${GIORNI[editModal.giorno]} ${editModal.oraInizio})`;
        const pSpostato = { ...p, dataSpostamento: toYMD(new Date()), spostatoDa: daEtichetta, spostamentoInviato: false };
        setTuttiPiani(prev => {
            const season = { ...(prev[stagioneSelezionata] || {}) };

      const salvaModificheModal = (e) => {

        if (editModal.corsie.length === 0) return alert("Seleziona almeno una corsia!");

        // BUGFIX: controlliamo PRIMA di salvare se la nuova posizione (giorno/ora/corsia) del
        // corso va a occupare una cella già usata da UN ALTRO corso (escludendo le celle
        // originali di questo stesso corso, che verranno comunque sostituite). Senza questo
        // controllo la cella esistente veniva sovrascritta e cancellata silenziosamente.
        const keyOriginali = new Set(editModal.corsoOriginale.keys);
        const conflitti = [];
        editModal.corsie.forEach(c => {
            const key = `${editModal.vasca}-${editModal.giorno}-${editModal.oraInizio}-${c}`;
            if (keyOriginali.has(key)) return; // è una cella del corso stesso, nessun conflitto
            const esistente = piano[key];
            if (esistente) {
                const nIscritti = (esistente.partecipanti || []).length;
                conflitti.push(`${GIORNI[editModal.giorno]} ${editModal.oraInizio} - Corsia ${c}${nIscritti > 0 ? ` (${nIscritti} iscritti)` : ''}`);
            }
        });
        if (conflitti.length > 0) {
            const conferma = window.confirm(
                `Attenzione: in queste corsie/orari è già presente un altro corso, che verrebbe SOSTITUITO (con eventuali iscritti persi):\n\n${conflitti.join('\n')}\n\nVuoi continuare comunque e sovrascriverli?`
            );
            if (!conferma) return;
        }
        
        // Recupera i partecipanti già confermati nella lista
        let finalPartecipanti = [...editModal.partecipanti];
        
        // Se l'utente ha compilato il nome ma ha dimenticato di cliccare "Aggiungi alla lista", lo salviamo in automatico!
        if (nuovoPartecipante && nuovoPartecipante.nome && nuovoPartecipante.nome.trim() !== '') {
            const partecipantePulito = {
                ...nuovoPartecipante,
                nome: normalizzaNome(nuovoPartecipante.nome),
                email: normalizzaEmail(nuovoPartecipante.email),
                sesso: nuovoPartecipante.sesso || rilevaSesso(normalizzaNome(nuovoPartecipante.nome)),
                livelloSocio: nuovoPartecipante.livelloSocio || '',
                iscrizioni: (nuovoPartecipante.iscrizioni || []).filter(i => i.inizio || i.fine)
            };
            const nomeNorm = partecipantePulito.nome.toLowerCase().trim();

            if (editingPartecipanteIndex !== null) {
              // Modifica di una persona già in elenco: la data di primo inserimento non cambia mai.
              finalPartecipanti[editingPartecipanteIndex] = { ...partecipantePulito, dataAggiunta: finalPartecipanti[editingPartecipanteIndex]?.dataAggiunta || '' };
            } else {
              const existingIndex = finalPartecipanti.findIndex(p => p.nome.toLowerCase().trim() === nomeNorm);
              if(existingIndex !== -1) {
                  // Nome già presente in lista: anche questa è una modifica, non un nuovo inserimento.
                  finalPartecipanti[existingIndex] = { ...partecipantePulito, dataAggiunta: finalPartecipanti[existingIndex].dataAggiunta || '' };
              } else {
                  // Nuovo inserimento vero e proprio: qui, e solo qui, registriamo la data odierna.
                  finalPartecipanti.push({ ...partecipantePulito, dataAggiunta: toYMD(new Date()) });
              }
            }
            finalPartecipanti.sort((a, b) => a.nome.localeCompare(b.nome));
        }
        
        // PROTEZIONE DATI: se per una persona data di nascita, email, telefono o tessera risultano
        // vuoti in questa lista ma esistono già in archivio, li recuperiamo prima di salvare.
        // Così un campo lasciato vuoto per errore non cancella più il dato già noto (né in questo
        // corso né, tramite la sincronizzazione globale, negli altri).
        finalPartecipanti = finalPartecipanti.map(p => (p && p.nome) ? { ...p, nome: normalizzaNome(p.nome), email: normalizzaEmail(p.email) } : p);
        finalPartecipanti = finalPartecipanti.map(p => {
            if (!p || !p.nome) return p;
            const arc = archivioSoci[p.nome.toLowerCase().trim()];
            if (!arc) return p;
            const out = { ...p };
            ['dataNascita', 'email', 'telefono', 'card', 'sesso'].forEach(c => { if (!out[c] && arc[c]) out[c] = arc[c]; });
            if (out.livelloSocio === undefined && arc.livelloSocio) out.livelloSocio = arc.livelloSocio;
            if (!out.anno && arc.anno) out.anno = arc.anno;
            if (out.dataNascita && /^\d{4}-/.test(out.dataNascita)) out.anno = out.dataNascita.slice(0, 4);

                          email: updateInfoRaw.email || esistente.email || '',
                          telefono: updateInfoRaw.telefono || esistente.telefono || '',
                          card: updateInfoRaw.card || esistente.card || '',
                          sesso: updateInfoRaw.sesso || esistente.sesso || '',
                          livelloSocio: updateInfoRaw.livelloSocio !== undefined ? updateInfoRaw.livelloSocio : (esistente.livelloSocio || ''),
                          anno: updateInfoRaw.anno || esistente.anno || ''
                      } : null;
                      if (updateInfo) {
                          if (updateInfo.scadCertificato !== (esistente.scadCertificato || '') || updateInfo.anno !== (esistente.anno || '') || updateInfo.dataNascita !== (esistente.dataNascita || '') || updateInfo.documentiFirmati !== (esistente.documentiFirmati || '') || updateInfo.card !== (esistente.card || '') || updateInfo.telefono !== (esistente.telefono || '') || updateInfo.email !== (esistente.email || '') || updateInfo.sesso !== (esistente.sesso || '') || (updateInfo.livelloSocio || '') !== (esistente.livelloSocio || '')) {
                              changed = true;
                              return { ...esistente, scadCertificato: updateInfo.scadCertificato, anno: updateInfo.anno, dataNascita: updateInfo.dataNascita, documentiFirmati: updateInfo.documentiFirmati, card: updateInfo.card, telefono: updateInfo.telefono, email: updateInfo.email, sesso: updateInfo.sesso, livelloSocio: updateInfo.livelloSocio || '' };

                      }

                  if (changed) nuovoPiano[k] = { ...nuovoPiano[k], partecipanti: newPartecipanti };

      // --- FUNZIONI CARICAMENTO FILE ---
      const apriBackupCloud = async () => {
        setIsExportMenuOpen(false);
        setIsBackupModalOpen(true);
        setElencoBackup(null);
        try {
          const { db, appId, doc, getDoc } = firebaseInstances;
          const percorso = ['artifacts', appId, 'users', user.uid, 'datiPianoVasca'];
          const slots = [];
          for (let i = 0; i < 30; i++) slots.push('d' + i);
          for (let i = 0; i < 10; i++) slots.push('x' + i);
          const nuovi = await Promise.all(slots.map(sl => getDoc(doc(db, ...percorso, `bk2_${sl}__meta`)).catch(() => null)));
          const lista = [];
          nuovi.forEach((sn, i) => { if (sn && sn.exists()) lista.push({ id: 'bk2_' + slots[i], slot: slots[i], nuovoFormato: true, ...sn.data() }); });
          lista.sort((a, b) => (b.backupAt || '').localeCompare(a.backupAt || ''));
          setElencoBackup(lista);
          if (lista[0] && lista[0].backupAt) setUltimoBackupAt(lista[0].backupAt);
        } catch (err) { console.error(err); setElencoBackup([]); }
      };
      // BACKUP MANUALE: copia dello stato ATTUALE sul cloud (fino a 10, poi sostituisce il più vecchio).
      const creaBackupManuale = async () => {
        setIsExportMenuOpen(false);
        if (!user || !firebaseInstances) { alert("Non sono connesso al cloud: riprova tra poco."); return; }
        try {
          const { db, appId, doc, getDoc, writeBatch } = firebaseInstances;
          const percorso = ['artifacts', appId, 'users', user.uid, 'datiPianoVasca'];
          // scegliamo il posto: il primo libero, altrimenti il più vecchio
          const metas = await Promise.all(Array.from({ length: 10 }, (_, i) => getDoc(doc(db, ...percorso, `bk2_x${i}__meta`)).catch(() => null)));
          let slot = null, piuVecchio = null, dataVecchia = '';
          metas.forEach((sn, i) => {
            if (!sn || !sn.exists()) { if (slot === null) slot = 'x' + i; }
            else if (piuVecchio === null || (sn.data().backupAt || '') < dataVecchia) { piuVecchio = 'x' + i; dataVecchia = sn.data().backupAt || ''; }
          });
          if (slot === null) slot = piuVecchio || 'x0';
          const arc = archivioCompleto(archivioSoci, tuttiPiani);
          const docsAtt = statoToDocs({ tuttiPiani, stagioni, stagionePredefinita, archivioSoci: arc, listaAttesa, tirocinanti, chiusure, lezioniPrivate, nuotoLibero });
          const ids = Object.keys(docsAtt);
          const cc = contaDati(tuttiPiani, arc);
          const ops = ids.map(id => [`bk2_${slot}__${id}`, JSON.parse(JSON.stringify(docsAtt[id]))]);
          ops.push([`bk2_${slot}__meta`, { formato: 'v2', manuale: true, backupAt: new Date().toISOString(), conteggi: cc, docIds: ids, attivita: ATTIVITA_DI_BASE }]);
          for (let i = 0; i < ops.length; i += 400) {
            const bb = writeBatch(db);
            ops.slice(i, i + 400).forEach(([id, dati]) => bb.set(doc(db, ...percorso, id), dati));
            await bb.commit();
          }
          setUltimoBackupAt(new Date().toISOString());
          mostraToast(`Backup creato: ${cc.iscritti} iscritti, ${cc.soci} soci, ${listaAttesa.length} in lista d'attesa.`);
        } catch (err) { console.error(err); alert("Backup non riuscito: " + (err && err.message ? err.message : err)); }
      };

      const ripristinaBackupCloud = async (b0) => {
        const c0 = b0.conteggi || contaDati(b0.tuttiPiani, b0.archivioSoci);
        if (!window.confirm(`Ripristinare la versione del ${new Date(b0.backupAt).toLocaleString('it-IT')}?\n(${c0.corsi} caselle corso, ${c0.iscritti} iscritti, ${c0.soci} soci)\n\nI dati attuali verranno sostituiti.`)) return;
        let b = b0;
        if (b0.nuovoFormato) {
          try {
            const { db, appId, doc, getDoc } = firebaseInstances;
            const percorso = ['artifacts', appId, 'users', user.uid, 'datiPianoVasca'];
            const mappa = {};
            const snaps = await Promise.all((b0.docIds || []).map(id => getDoc(doc(db, ...percorso, `bk2_${b0.slot}__${id}`))));
            snaps.forEach((sn, i) => { if (sn.exists()) mappa[b0.docIds[i]] = sn.data(); });
            if (!mappa['v2_meta']) { alert("Questo backup risulta incompleto: non lo ripristino."); return; }
            const st = stateFromDocs(mappa);
            b = { ...b0, tuttiPiani: st.tuttiPiani, stagioni: st.stagioni, stagionePredefinita: st.stagionePredefinita, archivioSoci: st.archivioSoci, listaAttesa: st.listaAttesa, tirocinanti: mappa['v2_tirocinanti'] ? st.tirocinanti : undefined, chiusure: mappa['v2_chiusure'] ? st.chiusure : undefined, lezioniPrivate: mappa['v2_private'] ? st.lezioniPrivate : undefined, nuotoLibero: mappa['v2_libero'] ? st.nuotoLibero : undefined };
          } catch (err) { console.error(err); alert("Non sono riuscito a leggere questo backup."); return; }
        }
        setTuttiPiani(b.tuttiPiani || {});
        if (b.stagioni && b.stagioni.length) { setStagioni(b.stagioni); setStagioneSelezionata(b.stagionePredefinita && b.stagioni.includes(b.stagionePredefinita) ? b.stagionePredefinita : b.stagioni[0]); }
        if (b.stagionePredefinita) setStagionePredefinita(b.stagionePredefinita);
        setArchivioSoci(archivioCompleto(b.archivioSoci, b.tuttiPiani));
        setListaAttesa(b.listaAttesa || []);
        if (b.tirocinanti) setTirocinanti(b.tirocinanti);
        if (b.chiusure) setChiusure(b.chiusure);
        if (b.lezioniPrivate) setLezioniPrivate(b.lezioniPrivate);
        if (b.nuotoLibero) setNuotoLibero(b.nuotoLibero);
        // la versione ripristinata è "nuova" rispetto al cloud: azzeriamo i freni per questo salvataggio
        ultimiConteggi.current = null; updatedAtNoto.current = updatedAtServer.current;
        setIsBackupModalOpen(false);
        mostraToast("Versione ripristinata!");
      };

      const esportaDati = () => {
        const arcCompleto = archivioCompleto(archivioSoci, tuttiPiani);
        const dataStr = JSON.stringify({ formato: 'pianovasca-backup-v2', esportatoIl: new Date().toISOString(), conteggi: contaDati(tuttiPiani, arcCompleto), tuttiPiani, stagioni, stagionePredefinita, archivioSoci: arcCompleto, listaAttesa, tirocinanti, chiusure, lezioniPrivate, nuotoLibero, attivita: ATTIVITA_DI_BASE }, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = `piano_vasca_COMPLETO_${toYMD(new Date())}.json`; link.click();
        URL.revokeObjectURL(url);
        setIsExportMenuOpen(false);
        const cc = contaDati(tuttiPiani, arcCompleto);
        mostraToast(`Backup scaricato: ${stagioni.length} stagioni, ${cc.iscritti} iscritti, ${cc.soci} soci, ${listaAttesa.length} in lista d'attesa.`);
      };

      const esportaExcel = () => {
        let htmlContent = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
          <head>
            <meta charset="utf-8">
            <style>
              body { font-family: sans-serif; font-size: 11pt; }
              table { border-collapse: collapse; width: 100%; font-size: 11pt; }
              th, td { border: 1px solid #ccc; padding: 8px; text-align: center; vertical-align: middle; font-size: 11pt; }
              th { background-color: #f8fafc; font-weight: bold; font-size: 10pt; }
            </style>
          </head>
          <body>
        `;

        const activeCorsie = vascaSelezionata === 'interna' ? CORSIE_INTERNA : CORSIE_ESTERNA;

        const getColor = (colorClass) => {
            if(colorClass.includes('bg-sky-400')) return '#38bdf8';
            if(colorClass.includes('bg-green-500')) return '#22c55e';
            if(colorClass.includes('bg-fuchsia-500')) return '#d946ef';
            if(colorClass.includes('bg-purple-600')) return '#9333ea';
            if(colorClass.includes('bg-orange-500')) return '#f97316';
            if(colorClass.includes('bg-yellow-300')) return '#fde047';
            if(colorClass.includes('bg-slate-300')) return '#cbd5e1';
            return '#e2e8f0';
        };

        const getTextColor = (colorClass) => {
            if(colorClass.includes('text-white')) return '#ffffff';
            if(colorClass.includes('text-slate-800')) return '#1e293b';
            if(colorClass.includes('text-yellow-900')) return '#713f12';
            return '#000000';
        };

        GIORNI.forEach((giorno, gIdx) => {
            const corsiDelGiorno = getCorsiForDay(gIdx);
            const matrix = Array(fasceOrarie.length).fill(null).map(() => Array(activeCorsie.length).fill(null));

            corsiDelGiorno.forEach(corso => {
               const startRow = Math.floor((corso.startMin - START_MIN_TOTAL) / intervallo);
               const rowSpan = Math.max(1, Math.round(corso.durata / intervallo));
               const colStart = activeCorsie.indexOf(corso.corsie[0]);
               const colSpan = corso.corsie.length;
               
               for(let r=0; r<rowSpan; r++){
                   for(let c=0; c<colSpan; c++){
                       if(startRow+r < fasceOrarie.length && colStart+c < activeCorsie.length){
                           matrix[startRow+r][colStart+c] = { 
                               corso, 
                               isTopLeft: (r===0 && c===0),
                               rowSpan,
                               colSpan
                           };
                       }
                   }
               }
            });

            htmlContent += `
              <h2>Stagione ${stagioneSelezionata} - Vasca ${vascaSelezionata === 'interna' ? 'Interna' : 'Esterna'} - ${giorno}</h2>
              <table>
                <thead>
                  <tr>
                    <th>Orario</th>
                    ${activeCorsie.map(c => `<th>Corsia ${c}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
            `;

            fasceOrarie.forEach((fascia, r) => {
                htmlContent += `<tr><td style="font-size:10pt;">${fascia.label}</td>`;
                activeCorsie.forEach((corsia, c) => {
                    const cell = matrix[r][c];
                    if(!cell) {
                        htmlContent += `<td></td>`;
                    } else if(cell.isTopLeft) {
                        const info = attivita.find(a => a.id === cell.corso.data.id);
                        const bgColor = getColor(info ? info.color : '');
                        const textColor = getTextColor(info ? info.color : '');
                        const livelloInfo = info?.levels?.find(l => l.val === cell.corso.data.livello);
                        const nomeLivello = info?.isFreeTextLevel ? cell.corso.data.livello : livelloInfo?.name;
                        
                        let testoSfondo = '';
                        if (nomeLivello) {
                          const mostraSoloNome = (info.id === 'acquagym' || info.id === 'propaganda' || info.isFreeTextLevel || livelloInfo?.noNumero);
                          const titoloTesto = mostraSoloNome ? nomeLivello : `Liv. ${cell.corso.data.livello} - ${nomeLivello}`;
                          testoSfondo += `${titoloTesto}<br>`;
                        } else {
                          testoSfondo += `${info ? info.name : ''}<br>`;
                        }
                        
                        if(cell.corso.data.istruttore) testoSfondo += `${cell.corso.data.istruttore}<br>`;
                        // BUGFIX/RICHIESTA: rimosse le emoji ⏱/👤 (rese in modo incoerente da Excel/Sheets
                        // a seconda del font di sistema) a favore di un testo semplice e uniforme.
                        let infoRiga = `${cell.corso.durata} min`;
                        if(cell.corso.data.maxUtenti) infoRiga += ` &middot; Max ${cell.corso.data.maxUtenti}`;
                        testoSfondo += infoRiga;
                        
                        htmlContent += `<td rowspan="${cell.rowSpan}" colspan="${cell.colSpan}" style="background-color: ${bgColor}; color: ${textColor}; border: 1px solid #ccc; font-size: 10pt; font-weight: normal; font-style: normal;">${testoSfondo}</td>`;
                    }
                });
                htmlContent += `</tr>`;
            });

            htmlContent += `
                </tbody>
              </table>
              <br><br>
            `;
        });

        htmlContent += `
          </body>
        </html>
        `;

        const getWeekNum = (date) => {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        };
        const fineSettimana = new Date(inizioSettimana.getTime() + 6 * 24 * 60 * 60 * 1000);
        const fDateShort = (date) => {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = String(date.getFullYear()).slice(-2);
            return `${d}-${m}-${y}`; 
        };
        
        const weekNum = getWeekNum(inizioSettimana);
        const strInizio = fDateShort(inizioSettimana);
        const strFine = fDateShort(fineSettimana);
        const nomeVasca = vascaSelezionata === 'interna' ? 'Vasca Interna' : 'Vasca Esterna';
        
        const fileName = `W${weekNum} ${strInizio} - ${strFine} ${nomeVasca}.xls`;

        const blob = new Blob([htmlContent], { type: "application/vnd.ms-excel;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; 
        link.download = fileName; 
        link.click();
        URL.revokeObjectURL(url);
        setIsExportMenuOpen(false);
      };

      const importaDati = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const dati = JSON.parse(e.target.result);
            if (dati.tuttiPiani) {
              setTuttiPiani(dati.tuttiPiani);
              setStagioni(dati.stagioni || Object.keys(dati.tuttiPiani));
              setArchivioSoci(archivioCompleto(dati.archivioSoci, dati.tuttiPiani));
              if (dati.listaAttesa) setListaAttesa(dati.listaAttesa);
              if (dati.tirocinanti) setTirocinanti(dati.tirocinanti);
              if (dati.chiusure) setChiusure(dati.chiusure);
              if (dati.lezioniPrivate) setLezioniPrivate(dati.lezioniPrivate);
              if (dati.nuotoLibero) setNuotoLibero(dati.nuotoLibero);
              if (dati.stagionePredefinita) setStagionePredefinita(dati.stagionePredefinita);
              if (dati.stagioni && dati.stagioni.length > 0) setStagioneSelezionata(dati.stagioni[0]);
            } else if (dati.piano) {
              const pianoMigrato = {};
              for (const key in dati.piano) {
                let newKey = key;
                if (!key.startsWith('interna-') && !key.startsWith('esterna-')) {
                  newKey = `interna-${key}`;
                }
                pianoMigrato[newKey] = formatCellData(dati.piano[key]);
              }
              setTuttiPiani(prev => ({ ...prev, [stagioneSelezionata]: pianoMigrato }));
            }
          } catch (error) { console.error("Errore importazione:", error); }
        };
        reader.readAsText(file);
        event.target.value = null;
      };

      const eliminaStagione = (nomeStagione) => {
        const daEliminare = nomeStagione || stagioneSelezionata;
        if (stagioni.length === 1) return; // Non elimina se c'è una sola stagione
        
        const nCelle = Object.keys(tuttiPiani[daEliminare] || {}).length;
        const nIscritti = Object.values(tuttiPiani[daEliminare] || {}).reduce((t, c) => t + ((c && c.partecipanti) ? c.partecipanti.length : 0), 0);
        if (!window.confirm(`Vuoi eliminare l'INTERA stagione ${daEliminare}?\n\nVerranno rimossi tutti i corsi (${nCelle} caselle) e le iscrizioni (${nIscritti}) di questa stagione.\n\nL'operazione non si può annullare dal sito (resta solo nei backup automatici).`)) return;
        
        const nuoveStagioni = stagioni.filter(s => s !== daEliminare);
        setStagioni(nuoveStagioni);
        setTuttiPiani(prev => {
          const nuovoTutti = { ...prev };
          delete nuovoTutti[daEliminare];
          return nuovoTutti;
        });
        if (stagioneSelezionata === daEliminare) setStagioneSelezionata(nuoveStagioni[0]);
        if (stagionePredefinita === daEliminare) {
            setStagionePredefinita(nuoveStagioni[0]);
        }
        setConfermaEliminaStagione(false);
      };

      const confermaRinominaStagione = () => {
        const vecchio = stagioneInRinomina;
        const nuovo = (nuovoNomeStagione || '').trim();
        if (!vecchio) return;
        if (!nuovo || nuovo === vecchio) { setStagioneInRinomina(null); return; }
        if (stagioni.includes(nuovo)) { alert(`Esiste già una stagione chiamata "${nuovo}".`); return; }
        setStagioni(prev => prev.map(x => x === vecchio ? nuovo : x));
        setTuttiPiani(prev => {
          const nuovoTutti = {};
          Object.keys(prev).forEach(k => { nuovoTutti[k === vecchio ? nuovo : k] = prev[k]; });
          return nuovoTutti;
        });
        if (stagioneSelezionata === vecchio) setStagioneSelezionata(nuovo);
        if (stagionePredefinita === vecchio) setStagionePredefinita(nuovo);
        setStagioneInRinomina(null);
        mostraToast("Stagione rinominata!");
      };

      // --- GESTIONE ACCESSO ---
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        try {
            await firebaseInstances.signInWithEmailAndPassword(firebaseInstances.auth, email, password);
        } catch (error) { setLoginError("Email o password errati."); }
      };
      const handleLogout = async () => {
        if (firebaseInstances?.auth) { 
          await firebaseInstances.signOut(firebaseInstances.auth); 
          setTuttiPiani({ '2025/2026': {} }); 
          setStagioni(['2025/2026']);
        }
      };

      if (isAuthLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><LoaderIcon size={48} className="text-blue-500" /></div>;

      if (!user && firebaseInstances?.appId === 'gestionale-vasca-personale') {
         return (
            <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
               <div className="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-slate-100">
                  <div className="flex justify-center mb-6"><div className="bg-blue-100 p-3 rounded-full text-blue-600"><LockIcon size={32} /></div></div>
                  <h2 className="text-2xl font-bold text-center text-slate-800 mb-2">Area Riservata</h2>
                  <p className="text-slate-500 text-center mb-8 text-sm">Inserisci le credenziali amministratore per accedere al Piano Vasca.</p>
                  <form onSubmit={handleLogin} className="flex flex-col gap-4">
                     <div><label className="block text-sm font-medium text-slate-700 mb-1">Email</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                     <div><label className="block text-sm font-medium text-slate-700 mb-1">Password</label><input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                     {loginError && <div className="text-red-500 text-sm bg-red-50 p-3 rounded-lg">{loginError}</div>}
                     <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg mt-2 shadow-sm transition-colors">Accedi</button>
                  </form>
               </div>
            </div>
         );
      }

      // Separiamo le fasce orarie
      const fasceMattina = fasceOrarie.filter(f => Number(f.id.split(':')[0]) < 14);
      const fascePomeriggio = fasceOrarie.filter(f => Number(f.id.split(':')[0]) >= 14);

      // Funzione riutilizzabile per renderizzare ogni singola tabella
      const renderGriglia = (fasce, titolo, corsiDelGiorno, gIdx) => {
          const activeCorsie = vascaSelezionata === 'interna' ? CORSIE_INTERNA : CORSIE_ESTERNA;
          const ROW_HEIGHT = 60; // Altezza fissa di base per ogni riga (in px)
          const pixelsPerMin = ROW_HEIGHT / intervallo; // Calcolo dinamico dello zoom in base all'intervallo
          
          return (
              <div className={`bg-white rounded-xl shadow-sm border border-slate-200 relative ${titolo ? 'mb-6' : ''}`} style={{ pageBreakInside: 'avoid' }}>
                  {titolo && (
                      <div className="bg-slate-700 text-white font-bold p-2 text-center text-sm rounded-t-xl uppercase tracking-wider">
                          {titolo}
                      </div>
                  )}
                  <div className="pb-4">
                      <table className="w-full table-fixed border-separate border-spacing-0 select-none">
                          <tbody>
                              {fasce.map((fascia) => {
                                  const [h, m] = fascia.id.split(':').map(Number);
                                  const fasciaStartMin = h * 60 + m;
                                  
                                  return (
                                      <tr key={fascia.id} className="hover:bg-slate-50/50 group">
                                          <td className="sticky left-0 z-20 bg-slate-50/90 backdrop-blur-sm border-b border-r border-slate-200 px-1 py-1.5 w-[100px] text-xs font-semibold text-slate-600 text-center whitespace-nowrap shadow-[1px_0_0_0_rgba(226,232,240,1)]"
                                              style={{ height: `${ROW_HEIGHT}px` }}>
                                              {fascia.label}
                                          </td>
                                          {activeCorsie.map(corsia => {
                                              // NUOVA LOGICA: Cerca i corsi che iniziano ALL'INTERNO di questa fascia oraria
                                              const corsiInCella = corsiDelGiorno.filter(c => 
                                                  c.corsie[0] === corsia && 
                                                  c.startMin >= fasciaStartMin && 
                                                  c.startMin < (fasciaStartMin + intervallo)
                                              );

                                              const dataG = new Date(inizioSettimana); dataG.setDate(dataG.getDate() + gIdx);
                                              const ymdG = toYMD(dataG);
                                              const fondiLibero = nuotoLibero.filter(l => liberoTocca(l, ymdG, gIdx, vascaSelezionata)).map(l => {
                                                  const [a1, a2] = l.dalle.split(':').map(Number), [b1, b2] = l.alle.split(':').map(Number);
                                                  const ini = a1 * 60 + a2, fin = b1 * 60 + b2;
                                                  const da = Math.max(ini, fasciaStartMin), a = Math.min(fin, fasciaStartMin + intervallo);
                                                  return a > da ? { id: l.id, top: (da - fasciaStartMin) * pixelsPerMin, h: (a - da) * pixelsPerMin, etichetta: corsia === activeCorsie[0] && ((ini >= fasciaStartMin && ini < fasciaStartMin + intervallo) || (ini < fasciaStartMin && fascia.id === fasce[0].id)) } : null;
                                              }).filter(Boolean);

                                              return (
                                                  <td 
                                                      key={corsia} 
                                                      className="min-w-[80px] border-b border-r border-slate-200 relative p-0 cursor-pointer hover:bg-blue-50/30 transition-colors" 
                                                      onDoubleClick={() => {
                                                          setNuovoCorso(prev => ({...prev, vasca: vascaSelezionata, giorni: [gIdx], oraInizio: fascia.id, corsie: [corsia]}));
                                                          setIsAddModalOpen(true);
                                                      }}
                                                  >
                                                      {fondiLibero.map(f => (
                                                          <div key={'nl' + f.id} className="absolute left-0 right-0 z-0 pointer-events-none" style={{ top: `${f.top}px`, height: `${f.h}px`, backgroundColor: '#cbd5e1' }} title="Nuoto libero">
                                                              {f.etichetta && <span className="absolute top-2 left-0 right-0 text-center text-sm font-bold text-slate-800 leading-tight truncate px-0.5">Nuoto libero</span>}
                                                          </div>
                                                      ))}
                                                      {corsiInCella.map((corso, i) => {
                                                          const infoAttivita = attivita.find(a => a.id === corso.data.id);
                                                          const livelloInfoCella = infoAttivita?.levels?.find(l => l.val === corso.data.livello);
                                                          const nomeLivello = infoAttivita?.isFreeTextLevel ? corso.data.livello : livelloInfoCella?.name;
                                                          const senzaNumeroLivello = infoAttivita?.isFreeTextLevel || ['acquagym', 'propaganda'].includes(corso.data.id) || livelloInfoCella?.noNumero;
                                                          
                                                          const nomeBrev = abbrevia(infoAttivita ? infoAttivita.name : '');
                                                          const livelloBrev = abbrevia(nomeLivello);

                                                          // Modalità "evidenzia": i corsi non selezionati nel filtro restano visibili
                                                          // ma vengono attenuati (opacità ridotta e desaturati), invece di sparire.
                                                          const attenuato = modalitaFiltro === 'evidenzia' && fuoriFiltro(corso.data);

                                                          // Applicazione dello zoom dinamico sui box
                                                          const topOffset = (corso.startMin - fasciaStartMin) * pixelsPerMin;
                                                          const altezzaPX = corso.durata * pixelsPerMin;
                                                          const larghezzaCalc = `calc(${corso.corsie.length * 100}% + ${corso.corsie.length - 1}px)`;

                                                          return (
                                                              <div 
                                                                  key={i}
                                                                  onClick={(e) => handleClickCorso(e, corso)}
                                                                  className={`absolute z-10 left-0 rounded-lg flex flex-col shadow-md cursor-pointer hover:brightness-95 hover:shadow-lg transition-all overflow-hidden border border-white/20 ${infoAttivita?.color || 'bg-slate-500 text-white'} ${attenuato ? 'opacity-25 grayscale saturate-50' : ''}`}
                                                                  style={{ top: `${topOffset}px`, height: `${altezzaPX}px`, width: larghezzaCalc, minHeight: '24px' }}
                                                              >
                                                                  <span className="absolute top-1 left-1.5 text-[9px] font-bold opacity-80 leading-none tracking-tight">
                                                                    {corso.oraInizio}
                                                                  </span>
                                                                  <div className="flex-1 flex flex-col items-center justify-center w-full overflow-hidden p-0.5 text-center">
                                                                    {nomeLivello ? (
                                                                      <>
                                                                        <span className={`hide-on-pdf ${corso.durata <= 30 ? 'text-xs' : 'text-sm'} font-bold leading-tight truncate w-full px-0.5`}>
                                                                          {senzaNumeroLivello ? nomeLivello : `Liv. ${corso.data.livello} - ${nomeLivello}`}
                                                                        </span>
                                                                        <span className={`show-on-pdf ${corso.durata <= 30 ? 'text-[11px]' : 'text-xs'} font-bold leading-tight truncate w-full px-0.5`}>
                                                                          {senzaNumeroLivello ? livelloBrev : `L${corso.data.livello}-${livelloBrev}`}
                                                                        </span>
                                                                      </>
                                                                    ) : (
                                                                      <>
                                                                        <span className={`hide-on-pdf ${corso.durata <= 30 ? 'text-xs' : 'text-sm'} font-bold leading-tight truncate w-full px-0.5`}>
                                                                          {infoAttivita ? infoAttivita.name : ''}
                                                                        </span>
                                                                        <span className={`show-on-pdf ${corso.durata <= 30 ? 'text-[11px]' : 'text-xs'} font-bold leading-tight truncate w-full px-0.5`}>
                                                                          {nomeBrev}
                                                                        </span>

                                                                        {(corso.data.maxUtenti || (corso.data.partecipanti && corso.data.partecipanti.length > 0)) && (() => {

                                                                           const isOltre = corso.data.maxUtenti && pAttivi.length > Number(corso.data.maxUtenti);
                                                                           const isPieno = corso.data.maxUtenti && pAttivi.length === Number(corso.data.maxUtenti);
                                                                           return (
                                                                               <span className={`flex items-center gap-0.5 ${isOltre ? 'text-red-600' : isPieno ? 'text-yellow-300' : ''}`} title={`Iscritti in questa sett.: ${pAttivi.length}${corso.data.maxUtenti ? ` / Max ${corso.data.maxUtenti}` : ''}`}>

                                                                        <span className="shrink-0">{corso.durata}'</span>
                                                                      </div>
                                                                    </div>
                                                                  )}
                                                              </div>
                                                          )
                                                      })}
                                                  </td>

                                          })}
                                      </tr>
                                  );

                </div>
                <div className="p-5 border-b border-slate-200 bg-slate-50">

                    <SearchIcon size={20} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                    <input 
                      type="text" 
                      autoFocus
                      placeholder="Cerca per cognome o nome..." 
                      value={searchQuery} 
                      onChange={e => setSearchQuery(e.target.value)} 
                      className="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white outline-none shadow-sm text-lg" 
                    />
                  </div>
                  <div className="grid grid-cols-3 gap-3 mt-3">
                    <select value={filtroLivelloRic} onChange={e => setFiltroLivelloRic(e.target.value)} className="px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white outline-none cursor-pointer" title="Filtra per livello attuale della persona">
                      <option value="">Livello: tutti</option>
                      {attivita.filter(a => a.levels && a.levels.length > 0).map(a => (
                        <optgroup key={a.id} label={a.name}>
                          {a.levels.map(l => <option key={a.id + ':' + l.val} value={a.id + ':' + l.val}>{l.noNumero ? l.name : `Liv. ${l.val} - ${l.name}`}</option>)}
                        </optgroup>
                      ))}
                    </select>
                    <select value={filtroPeriodoRic} onChange={e => setFiltroPeriodoRic(e.target.value)} className="px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white outline-none cursor-pointer" title="Filtra per periodo di iscrizione">
                      <option value="">Periodo: tutti</option>
                      <option value="primo">Primo periodo</option>
                      <option value="secondo">Secondo periodo</option>
                      <option value="annuale">Annuale</option>
                    </select>
                    <select value={filtroCertRic} onChange={e => setFiltroCertRic(e.target.value)} className="px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white outline-none cursor-pointer" title="Filtra per certificato medico">
                      <option value="">Certificato: tutti</option>
                      <option value="scaduto">Scaduto</option>
                      <option value="scade30">In scadenza (30 giorni)</option>
                      <option value="mancante">Mancante</option>
                    </select>
                  </div>
                  {filtriRicAttivi && (

                </div>
                <div className="overflow-y-auto flex-1 bg-white" style={{ minHeight: '300px' }}>
                  {searchQuery.length > 0 && searchQuery.length < 2 && !filtriRicAttivi ? (

                  ) : searchResults.length > 0 ? (

                      {searchResults.slice(0, 300).map((res, i) => {

                        const scadCertRic = (inArchivioRic && inArchivioRic.scadCertificato) || res.partecipante.scadCertificato || '';

                              </div>
                            </div>
                            <div className="text-slate-300 group-hover:text-blue-500 transition-colors">
                              <ChevronRightIcon size={22} />

                          </li>

                      })}

                  ) : (searchQuery.length >= 2 || filtriRicAttivi) ? (
                    <div className="p-8 text-center text-slate-500">Nessun socio trovato{searchQuery.length >= 2 ? ` con "${searchQuery}"` : ''}{filtriRicAttivi ? ' con questi filtri' : ''}</div>

            const dn = arch.dataNascita || schedaSocio.dataNascita || '';
            const an = arch.anno || schedaSocio.anno || '';
            const cert = arch.scadCertificato || schedaSocio.scadCertificato || '';
            const card = arch.card || schedaSocio.card || '';

                    <div className="grid grid-cols-2 gap-4">
                      <div><div className={lbl}>Data di nascita</div><div className="text-sm text-slate-700">{dn ? formatDate(dn) : (an || '-')}</div></div>

                      <div><div className={lbl}>Livello attuale</div><div className="text-sm text-slate-700">{etichettaLivelloSocio(arch.livelloSocio || schedaSocio.livelloSocio, attivita) || '-'}</div></div>
                      <div><div className={lbl}>Documenti firmati</div><div className="text-sm text-slate-700">{schedaSocio.documentiFirmati === 'si' ? 'Sì' : schedaSocio.documentiFirmati === 'no' ? 'No' : 'Da verificare'}</div></div>
                      <div><div className={lbl}>Card</div><div className="text-sm text-slate-700">{card === 'si' ? 'Sì' : card === 'no' ? 'No' : '-'}</div></div>
                    </div>

                      <div className={lbl}>Telefono</div>

                          : <span title="Numero di telefono mancante" className={`${btn} text-slate-300 bg-slate-100 cursor-not-allowed`}><WhatsAppIcon size={16}/></span>}
                      </div>
                    </div>
                    <div>
                      <div className={lbl}>Email</div>
                      <div className="flex items-center gap-2 mt-1 flex-wrap">
                        <span className="text-sm text-slate-700 break-all">{mail || '-'}</span>
                        {mail
                          ? <a href={`mailto:${mail}`} title="Scrivi un'email (app di posta predefinita)" className={`${btn} text-blue-500 hover:text-blue-700 bg-blue-50 hover:bg-blue-100`}><MailIcon size={16}/></a>
                          : <span title="Email mancante" className={`${btn} text-slate-300 bg-slate-100 cursor-not-allowed`}><MailIcon size={16}/></span>}
                        <a href={mail ? `https://mail.federnuoto.it/modern/email/Drafts/message/new?full=true` : 'https://mail.federnuoto.it/modern/'} onClick={() => { try { if (mail && navigator.clipboard) navigator.clipboard.writeText(mail); } catch (e) {} }} target="_blank" rel="noopener noreferrer" title={mail ? "Nuovo messaggio nella posta federnuoto.it: l'indirizzo viene copiato negli appunti, basta incollarlo in A:" : "Apri la casella di posta federnuoto.it"} className="text-xs font-bold px-2 py-1.5 rounded-md text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">{mail ? 'Scrivi dalla mia posta' : 'Apri la mia posta'}</a>
                      </div>
                    </div>
                    {periodi.length > 0 && (
                      <div>
                        <div className={lbl}>Periodi di iscrizione</div>
                        <div className="text-sm text-slate-700 mt-1 flex flex-col gap-0.5">{periodi.map((i, k) => <span key={k}>{i.inizio ? formatDate(i.inizio) : '...'} - {i.fine ? formatDate(i.fine) : '...'}</span>)}</div>
                      </div>
                    )}
                    {(() => {
                      const key = (schedaSocio.nome || '').toLowerCase().trim();
                      const stag = [];
                      Object.keys(tuttiPiani).sort().reverse().forEach(st => {
                        const pi = tuttiPiani[st] || {};
                        const corsi = [];
                        Object.keys(pi).forEach(k => {
                          const cell = pi[k];
                          if (!cell || !Array.isArray(cell.partecipanti)) return;
                          const pp = cell.partecipanti.find(x => x && (x.nome || '').toLowerCase().trim() === key);
                          if (!pp) return;
                          const [vasca, giorno, ora] = k.split('-');
                          if (corsi.some(c => c.vasca === vasca && c.giorno === Number(giorno) && c.ora === ora && isSameCourse(c.cell, cell))) return;
                          const info = attivita.find(a => a.id === cell.id);
                          const nomeLiv = info?.isFreeTextLevel ? cell.livello : info?.levels?.find(l => l.val === cell.livello)?.name;
                          corsi.push({ vasca, giorno: Number(giorno), ora, cell, nome: nomeLiv ? `${info?.name} - ${nomeLiv}` : (info?.name || 'Corso'), istruttore: cell.istruttore || '', periodi: (pp.iscrizioni || []).filter(i => i.inizio || i.fine), colore: info?.color ? info.color.split(' ')[0] : 'bg-blue-600' });

                        corsi.sort((a, b) => a.giorno - b.giorno || a.ora.localeCompare(b.ora));
                        if (corsi.length) stag.push({ st, corsi });

                                      </div>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      );

                    {schedaSocio._daPrivate && <button onClick={() => modificaAnagraficaDaScheda(schedaSocio)} className="flex items-center gap-1.5 px-4 py-2 rounded-lg font-bold bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 transition-colors"><EditIcon size={15}/> Modifica anagrafica</button>}
                    <button onClick={() => setSchedaSocio(null)} className="px-4 py-2 rounded-lg font-bold text-slate-600 hover:bg-slate-200 transition-colors">Chiudi</button>
                  </div>
                </div>
              </div>
            );
          })()}

          {formAnagPriv && (() => {
            const lbl = "block text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-1";
            const inp = "w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white";
            return (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] flex items-center justify-center p-4" onClick={() => setFormAnagPriv(null)}>
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                  <div className="px-5 py-4 bg-[#1e3a5f] text-white flex justify-between items-center">
                    <h3 className="font-bold text-lg flex items-center gap-2"><EditIcon size={20}/> Modifica anagrafica</h3>
                    <button onClick={() => setFormAnagPriv(null)} className="hover:bg-white/20 p-1 rounded-full transition-colors"><XIcon size={20}/></button>
                  </div>
                  <div className="p-6 overflow-y-auto">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                      <div className="md:col-span-1"><label className={lbl}>Cognome e nome</label><input type="text" value={formAnagPriv.nome} readOnly className={inp + ' bg-slate-50 text-slate-500'} /></div>
                      <div><label className={lbl}>Data di nascita</label><input type="date" value={formAnagPriv.dataNascita} onChange={e => setFormAnagPriv({ ...formAnagPriv, dataNascita: e.target.value })} className={inp} /></div>
                      <div><label className={lbl}>Telefono</label><input type="text" value={formAnagPriv.telefono} onChange={e => setFormAnagPriv({ ...formAnagPriv, telefono: e.target.value })} className={inp} /></div>
                      <div><label className={lbl}>Email</label><input type="email" value={formAnagPriv.email} onChange={e => setFormAnagPriv({ ...formAnagPriv, email: e.target.value })} className={inp} /></div>
                      <div><label className={lbl}>Scadenza certificato</label><input type="date" value={formAnagPriv.scadCertificato} onChange={e => setFormAnagPriv({ ...formAnagPriv, scadCertificato: e.target.value })} className={inp} /></div>
                      <div><label className={lbl}>Documenti firmati</label><select value={formAnagPriv.documentiFirmati} onChange={e => setFormAnagPriv({ ...formAnagPriv, documentiFirmati: e.target.value })} className={inp}><option value="">Da verificare</option><option value="si">Sì</option><option value="no">No</option></select><div className="mt-1 text-[11px] text-slate-400">Stagione {stagioneSelezionata}</div></div>
                      <div><label className={lbl}>Card</label><select value={formAnagPriv.card} onChange={e => setFormAnagPriv({ ...formAnagPriv, card: e.target.value })} className={inp}><option value="">-</option><option value="si">Sì</option><option value="no">No</option></select></div>
                    </div>
                    <div className="mt-4 text-xs text-slate-500">Questa persona non è iscritta a corsi della stagione selezionata: qui modifichi i dati dell'anagrafica. Sono gli stessi usati in "Scadenze" e nel resto del gestionale.</div>
                  </div>
                  <div className="px-6 py-3 border-t border-slate-200 flex justify-end gap-2 bg-slate-50">
                    <button onClick={() => setFormAnagPriv(null)} className="px-4 py-2 rounded-lg font-bold text-slate-600 hover:bg-slate-200 transition-colors">Annulla</button>
                    <button onClick={salvaFormAnagPriv} className="px-4 py-2 rounded-lg font-bold bg-blue-600 hover:bg-blue-700 text-white transition-colors">Salva</button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* --- MENU AZIONI ISCRITTO --- */}
          {editModal && menuAzioniPart && (
            <div className="fixed inset-0 z-[70]" onClick={() => setMenuAzioniPart(null)}>
