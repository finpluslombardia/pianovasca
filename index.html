              const dataNasc = estraiDataCompletaDaData(riga[2]);

              if (!cognome && !nomeProprio) continue; // riga vuota: ignorata silenziosamente
              if (!cognome || !nomeProprio) { scartati++; continue; }

              const nomeCompleto = formattaNomeProprio(`${cognome} ${nomeProprio}`);
              const key = nomeCompleto.toLowerCase().trim();
              if (map[key]) continue; // doppione nel file stesso: teniamo la prima occorrenza

              const esisteGia = archivioSoci[key];
              map[key] = {
                  nome: esisteGia ? esisteGia.nome : nomeCompleto,
                  anno: anno || (esisteGia ? esisteGia.anno : ''),
                  dataNascita: dataNasc || (esisteGia ? (esisteGia.dataNascita || '') : ''),
                  scadCertificato: esisteGia ? esisteGia.scadCertificato : '',
                  card: esisteGia ? (esisteGia.card || '') : '',
                  telefono: esisteGia ? (esisteGia.telefono || '') : '',
                  email: esisteGia ? (esisteGia.email || '') : '',
                  livelloSocio: esisteGia ? (esisteGia.livelloSocio || '') : '',
                  certMsgScad: esisteGia ? (esisteGia.certMsgScad || '') : '',
                  rinnovoMsgFine: esisteGia ? (esisteGia.rinnovoMsgFine || '') : '',
                  auguriMsgData: esisteGia ? (esisteGia.auguriMsgData || '') : ''
              };

              if (esisteGia) aggiornati++; else nuovi++;
              if (esempi.length < 8) esempi.push({ nome: map[key].nome, anno: map[key].anno, dataNascita: map[key].dataNascita });
          }

          if (Object.keys(map).length === 0) {
              alert("Non ho trovato righe valide da importare in questo file. Controlla che le colonne siano nell'ordine Cognome, Nome, Data di nascita.");
              return;
          }

          setImportaSociPreview({ map, nuovi, aggiornati, scartati, esempi, totale: nuovi + aggiornati });
      }, [archivioSoci]);

      const gestisciFileSoci = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          const nomeFile = file.name.toLowerCase();
          const reader = new FileReader();

          if (nomeFile.endsWith('.csv')) {
              reader.onload = (e) => elaboraRigheImportazioneSoci(parseCSV(e.target.result));
              reader.readAsText(file, 'UTF-8');
          } else {
              reader.onload = (e) => {
                  try {
                      const wb = XLSX.read(e.target.result, { type: 'array' });
                      const foglio = wb.Sheets[wb.SheetNames[0]];
                      const righe = XLSX.utils.sheet_to_json(foglio, { header: 1, raw: true, defval: '' });
                      elaboraRigheImportazioneSoci(righe);
                  } catch (err) {
                      console.error("Errore lettura file soci:", err);
                      alert("Non riesco a leggere questo file. Assicurati che sia un file Excel (.xlsx/.xls) o CSV valido.");
                  }
              };
              reader.readAsArrayBuffer(file);
          }
          event.target.value = null;
      };

      const confermaImportazioneSoci = () => {
          if (!importaSociPreview) return;
          setArchivioSoci(prev => ({ ...prev, ...importaSociPreview.map }));
          mostraToast(`${importaSociPreview.totale} soci importati con successo!`);
          setImportaSociPreview(null);
          setIsExportMenuOpen(false);
      };

      const annullaImportazioneSoci = () => setImportaSociPreview(null);

      // --- LISTA D'ATTESA (contatti da ricontattare) ---
      const salvaContattoAttesa = (e) => {
        e.preventDefault();
        if (!nuovoContattoAttesa.nome.trim()) { alert("Inserisci il nominativo!"); return; }
        if (nuovoContattoAttesa.motivazione === 'corso' && !nuovoContattoAttesa.corsoRichiesto) {
          alert("Seleziona il corso di interesse!");
          return;
        }
        const nuovoContattoAttesa_ = nuovoContattoAttesa;
        const nuovoContattoPulito = { ...nuovoContattoAttesa_, nome: normalizzaNome(nuovoContattoAttesa_.nome), nomeGenitore: nuovoContattoAttesa_.nomeGenitore ? normalizzaNome(nuovoContattoAttesa_.nomeGenitore) : nuovoContattoAttesa_.nomeGenitore, email: normalizzaEmail(nuovoContattoAttesa_.email) };
        if (editandoContattoAttesaId) {
          setListaAttesa(prev => prev.map(c => c.id === editandoContattoAttesaId ? { ...nuovoContattoPulito, id: editandoContattoAttesaId } : c));
          mostraToast("Contatto aggiornato!");
        } else {
          setListaAttesa(prev => [...prev, { ...nuovoContattoPulito, id: Date.now() + Math.random() }]);
          mostraToast("Contatto aggiunto alla lista d'attesa!");
        }
        setNuovoContattoAttesa(creaContattoAttesaVuoto());
        setEditandoContattoAttesaId(null);
        setIsFormAttesaOpen(false);
      };

      const apriNuovoContattoAttesa = () => {
        setNuovoContattoAttesa(creaContattoAttesaVuoto());
        setEditandoContattoAttesaId(null);
        setIsFormAttesaOpen(true);
      };

      const avviaModificaContattoAttesa = (contatto) => {
        setNuovoContattoAttesa({ ...contatto });
        setEditandoContattoAttesaId(contatto.id);
        setIsFormAttesaOpen(true);
      };

      const eliminaContattoAttesa = (id) => {
        setListaAttesa(prev => prev.filter(c => c.id !== id));
        if (editandoContattoAttesaId === id) {
          setNuovoContattoAttesa(creaContattoAttesaVuoto());
          setEditandoContattoAttesaId(null);
          setIsFormAttesaOpen(false);
        }
        if (dettaglioContattoAttesa && dettaglioContattoAttesa.id === id) {
          setDettaglioContattoAttesa(null);
        }
        mostraToast("Contatto rimosso.");
      };

      const annullaModificaContattoAttesa = () => {
        setNuovoContattoAttesa(creaContattoAttesaVuoto());
        setEditandoContattoAttesaId(null);
        setIsFormAttesaOpen(false);
      };

      const segnaCompletatoContatto = (id) => {
        setListaAttesa(prev => prev.map(c => c.id === id ? { ...c, completato: true } : c));
        if (dettaglioContattoAttesa && dettaglioContattoAttesa.id === id) setDettaglioContattoAttesa(null);
        mostraToast("Contatto segnato come completato!");
      };

      const riattivaContatto = (id) => {
        setListaAttesa(prev => prev.map(c => c.id === id ? { ...c, completato: false } : c));
        if (dettaglioContattoAttesa && dettaglioContattoAttesa.id === id) setDettaglioContattoAttesa(null);
        mostraToast("Contatto riportato in lista d'attesa.");
      };

      const contattiAttesaAttivi = useMemo(() => listaAttesa.filter(c => !c.completato), [listaAttesa]);
      const contattiAttesaCompletati = useMemo(() => listaAttesa.filter(c => c.completato), [listaAttesa]);

      const [ordinamentoAttesa, setOrdinamentoAttesa] = useState('creazione');
      const [ricercaAttesa, setRicercaAttesa] = useState('');
      // Filtro per tipo di motivazione: ogni tipo è visibile (true) o nascosto (false).
      const [filtroMotivazioniAttesa, setFiltroMotivazioniAttesa] = useState({ private: true, corso: true, prova: true, altro: true });
      const [isFiltroMotivazioniOpen, setIsFiltroMotivazioniOpen] = useState(false);
      const OPZIONI_MOTIVAZIONE_ATTESA = [
        { id: 'private', label: 'Private' },
        { id: 'corso', label: 'Corso' },
        { id: 'prova', label: 'Prova' },
        { id: 'altro', label: 'Informazioni/Altro' }
      ];
      // Voci contate nel pulsante: tipi diversi da "Corso" + ogni singolo corso (sottocategorie)
      const voceFiltroNascosta = (k) => filtroMotivazioniAttesa[k] === false;
      const vociFiltroAttesa = [...OPZIONI_MOTIVAZIONE_ATTESA.filter(o => o.id !== 'corso').map(o => o.id), ...attivita.map(a => `corso:${a.id}`)];
      const motivazioniNascoste = vociFiltroAttesa.filter(voceFiltroNascosta).length;
      const toggleCorsoAttesa = (checked) => setFiltroMotivazioniAttesa(prev => { const n = { ...prev, corso: checked }; attivita.forEach(a => { n[`corso:${a.id}`] = checked; }); return n; });
      const toggleSottoCorsoAttesa = (id, checked) => setFiltroMotivazioniAttesa(prev => { const n = { ...prev, [`corso:${id}`]: checked }; n.corso = attivita.some(a => n[`corso:${a.id}`] !== false); return n; });
      const extraCorsoAttesa = (c) => {
          if (!c || c.motivazione !== 'corso') return '';
          const info = attivita.find(a => a.id === c.corsoRichiesto);
          const liv = info && c.livelloRichiesto ? (info.levels || []).find(l => l.val === c.livelloRichiesto) : null;
          const per = { primo: 'Primo periodo', secondo: 'Secondo periodo', annuale: 'Annuale' }[c.periodoRichiesto] || '';
          return [liv ? liv.name : '', per].filter(Boolean).join(' · ');
      };
      const etichettaMotivazioneAttesa = useCallback((c) => {
          if (c.motivazione === 'private') return 'Private';
          if (c.motivazione === 'corso') { const ex = extraCorsoAttesa(c); return `Corso: ${attivita.find(a => a.id === c.corsoRichiesto)?.name || '-'}${ex ? ' · ' + ex : ''}`; }
          if (c.motivazione === 'prova') return 'Prova';
          if (c.motivazione === 'altro') return 'Informazioni/Altro';
          return '';
      }, [attivita]);
      const ordinaContattiAttesa = useCallback((lista) => {
          const arr = [...lista];
          if (ordinamentoAttesa === 'motivazione') {
              arr.sort((a, b) => etichettaMotivazioneAttesa(a).localeCompare(etichettaMotivazioneAttesa(b)));
          } else if (ordinamentoAttesa === 'scadenza') {
              // Le schede senza data di scadenza vanno sempre in fondo
              arr.sort((a, b) => {
                  if (!a.dataScadenza && !b.dataScadenza) return 0;
                  if (!a.dataScadenza) return 1;
                  if (!b.dataScadenza) return -1;
                  return new Date(a.dataScadenza) - new Date(b.dataScadenza);
              });
          } else {
              // Default: data di creazione, dalla più recente
              arr.sort((a, b) => new Date(b.dataCreazione || 0) - new Date(a.dataCreazione || 0));
          }
          return arr;
      }, [ordinamentoAttesa, etichettaMotivazioneAttesa]);

      const contattiAttesaScaduti = useMemo(() => {
        const oggi = new Date();
        oggi.setHours(0,0,0,0);
        return listaAttesa.filter(c => !c.completato && c.dataScadenza && new Date(c.dataScadenza) < oggi).length;
      }, [listaAttesa]);

      const tuttiCorsiSelect = useMemo(() => {
          const list = [];
          Object.keys(piano).forEach(k => {
              const cell = piano[k];
              const parts = k.split('-');
              const vasca = parts[0];
              const giorno = Number(parts[1]);
              const oraInizio = parts[2];
              const corsia = parts[3];
              
              const existing = list.find(c => c.vasca === vasca && c.giorno === giorno && c.oraInizio === oraInizio && isSameCourse(c.data, cell));
              if (existing) {
                  if (!existing.corsie.includes(corsia)) existing.corsie.push(corsia);
                  if (!existing.keys.includes(k)) existing.keys.push(k);
              } else {
                  list.push({ vasca, giorno, oraInizio, corsie: [corsia], keys: [k], data: cell });
              }
          });
          list.sort((a, b) => a.giorno - b.giorno || a.oraInizio.localeCompare(b.oraInizio));
          return list;
      }, [piano]);

      // --- DISPONIBILITÀ RESIDUA PER CATEGORIA DI CORSO ---
      // Periodi selezionabili: settimana visualizzata, primo/secondo periodo, annuale (date della stagione selezionata,
      // ricavate dai periodi di iscrizione preimpostati e spostate sull'anno della stagione).
      const intervalliDisp = useMemo(() => {
          const m = String(stagioneSelezionata).match(/(\d{4})/);
          const shift = (m ? Number(m[1]) : 2026) - 2026;
          const sh = (ymd) => `${Number(ymd.slice(0, 4)) + shift}${ymd.slice(4)}`;
          const iniSet = new Date(inizioSettimana); iniSet.setHours(0, 0, 0, 0);
          const fineSet = new Date(iniSet.getTime() + 6 * 24 * 60 * 60 * 1000);
          return {
              settimana: { label: 'Settimana corrente', inizio: toYMD(iniSet), fine: toYMD(fineSet) },
              primo: { label: 'Primo periodo', inizio: sh(PRESET_ISCRIZIONI[0].inizio), fine: sh(PRESET_ISCRIZIONI[0].fine) },
              secondo: { label: 'Secondo periodo', inizio: sh(PRESET_ISCRIZIONI[2].inizio), fine: sh(PRESET_ISCRIZIONI[2].fine) },
              annuale: { label: 'Annuale', inizio: sh(PRESET_ISCRIZIONI[1].inizio), fine: sh(PRESET_ISCRIZIONI[1].fine) }
          };
      }, [stagioneSelezionata, inizioSettimana]);

      const disponibilita = useMemo(() => {
          if (!isDisponibilitaOpen || periodoDisp === 'rinnovi') return [];
          const iv = intervalliDisp[periodoDisp] || intervalliDisp.settimana;
          const ms = (ymd, fineGiorno) => { const [y, mo, d] = ymd.split('-').map(Number); return fineGiorno ? new Date(y, mo - 1, d, 23, 59, 59, 999).getTime() : new Date(y, mo - 1, d, 0, 0, 0, 0).getTime(); };
          const startRange = ms(iv.inizio, false), endRange = ms(iv.fine, true);
          // settimane (lunedì-domenica) comprese nel periodo, ritagliate sul periodo stesso
          const settimane = [];
          let cur = new Date(startRange);
          cur.setDate(cur.getDate() - ((cur.getDay() + 6) % 7)); cur.setHours(0, 0, 0, 0);
          while (cur.getTime() <= endRange) {
              const fineSett = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 6, 23, 59, 59, 999).getTime();
              settimane.push([Math.max(cur.getTime(), startRange), Math.min(fineSett, endRange)]);
              cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 7);
          }
          const intervalliPersona = (p) => {
              let lista = [];
              if (p.iscrizioni && p.iscrizioni.length > 0) lista = p.iscrizioni.filter(i => i.inizio || i.fine);
              else if (p.scadIscrizione) lista = [{ inizio: '', fine: p.scadIscrizione }];
              if (lista.length === 0) return null; // nessun periodo indicato = sempre attivo
              return lista.map(i => [i.inizio ? ms(i.inizio, false) : -Infinity, i.fine ? ms(i.fine, true) : Infinity]);
          };
          const cat = {};
          tuttiCorsiSelect.forEach(c => {
              const info = attivita.find(a => a.id === c.data.id);
              if (!info) return;
              const cS = c.data.dataInizio ? ms(c.data.dataInizio, false) : -Infinity;
              const cE = c.data.dataFine ? ms(c.data.dataFine, true) : Infinity;
              // il corso conta solo nelle settimane in cui è effettivamente attivo (date di inizio/fine del corso)
              const sAttive = settimane.filter(([s0, e0]) => cS <= e0 && cE >= s0);
              if (sAttive.length === 0) return;
              const max = Number(c.data.maxUtenti) || 0;
              const pIv = (c.data.partecipanti || []).map(intervalliPersona);
              // iscritti = il PICCO di presenze nelle settimane del periodo (chi si iscrive per tutto il periodo ha i posti rimasti al picco)
              let attivi = 0;
              sAttive.forEach(([s0, e0]) => {
                  const n = pIv.filter(iv2 => iv2 === null || iv2.some(([a0, b0]) => a0 <= e0 && b0 >= s0)).length;
                  if (n > attivi) attivi = n;
              });
              const lv = c.data.livello || '';
              let etichetta = 'Generale';
              if (lv) {
                  if (info.isFreeTextLevel) etichetta = lv;
                  else {
                      const li = info.levels && info.levels.find(l => l.val === lv);
                      etichetta = li ? (li.noNumero ? li.name : `Liv. ${lv} - ${li.name}`) : lv;
                  }
              }
              if (!cat[info.id]) cat[info.id] = { info, posti: 0, iscritti: 0, liberi: 0, corsi: 0, senzaLimite: 0, livelli: {} };
              const k = cat[info.id];
              if (!k.livelli[etichetta]) k.livelli[etichetta] = { etichetta, ordine: lv, posti: 0, iscritti: 0, liberi: 0, elenco: [] };
              const L = k.livelli[etichetta];
              if (max > 0) {
                  const liberi = Math.max(0, max - attivi);
                  k.posti += max; k.iscritti += attivi; k.liberi += liberi; k.corsi++;
                  L.posti += max; L.iscritti += attivi; L.liberi += liberi;
                  L.elenco.push({ giorno: c.giorno, ora: c.oraInizio, vasca: c.vasca, corsie: c.corsie, istruttore: c.data.istruttore || '', max, attivi, liberi, dal: c.data.dataInizio || '', al: c.data.dataFine || '' });
              } else { k.senzaLimite++; }
          });
          const ordineAtt = attivita.map(a => a.id);
          return Object.values(cat)
              .filter(k => k.corsi > 0)
              .sort((a, b) => ordineAtt.indexOf(a.info.id) - ordineAtt.indexOf(b.info.id))
              .map(k => ({ ...k, livelli: Object.values(k.livelli).filter(L => L.elenco.length > 0).sort((a, b) => String(a.ordine).localeCompare(String(b.ordine), 'it', { numeric: true })) }));
      }, [isDisponibilitaOpen, periodoDisp, intervalliDisp, tuttiCorsiSelect, attivita]);

      // --- ELENCO ISCRITTI PER PERIODO (primo / secondo / annuale) della stagione selezionata ---
      const iscrittiPerPeriodo = useMemo(() => {
          if (!iscrittiPeriodo) return [];
          const iv = intervalliDisp[iscrittiPeriodo];
          const giorniAbb = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
          const mappa = {};
          tuttiCorsiSelect.forEach(c => {
              const info = attivita.find(a => a.id === c.data.id);
              (c.data.partecipanti || []).forEach(p => {
                  const ok = (p.iscrizioni || []).some(i => i.inizio === iv.inizio && i.fine === iv.fine);
                  if (!ok) return;
                  const key = String(p.nome || '').toLowerCase().trim();
                  if (!key) return;
                  if (!mappa[key]) mappa[key] = { nome: p.nome, telefono: p.telefono || '', corsi: [] };
                  if (!mappa[key].telefono && p.telefono) mappa[key].telefono = p.telefono;
                  const etichetta = `${info ? info.name : 'Corso'} · ${giorniAbb[c.giorno]} ${c.oraInizio}`;
                  if (!mappa[key].corsi.includes(etichetta)) mappa[key].corsi.push(etichetta);
              });
          });
          return Object.values(mappa).sort((a, b) => a.nome.localeCompare(b.nome, 'it'));
      }, [iscrittiPeriodo, intervalliDisp, tuttiCorsiSelect, attivita]);

      // --- ISCRITTI DI UN GIORNO DELLA SETTIMANA VISUALIZZATA ---
      const iscrittiGiorno = useMemo(() => {
          if (!isIscrittiGiornoOpen) return { data: '', corsi: [], totale: 0 };
          const dataG = new Date(inizioSettimana.getTime() + giornoIscritti * 24 * 60 * 60 * 1000);
          const ymd = toYMD(dataG);
          const persone = new Set();
          const corsi = tuttiCorsiSelect
              .filter(c => c.giorno === giornoIscritti)
              .filter(c => (!c.data.dataInizio || c.data.dataInizio <= ymd) && (!c.data.dataFine || c.data.dataFine >= ymd) && !(Array.isArray(c.data.dateEscluse) && c.data.dateEscluse.includes(ymd)))
              .map(c => {
                  const info = attivita.find(a => a.id === c.data.id);
                  const att = (c.data.partecipanti || []).filter(pp => isAttivoInSettimana(pp, inizioSettimana));
                  att.forEach(pp => persone.add(String(pp.nome || '').toLowerCase().trim()));
                  const lv = c.data.livello || '';
                  const li = info && !info.isFreeTextLevel && info.levels ? info.levels.find(l => l.val === lv) : null;
                  const nomeLv = lv ? (info && info.isFreeTextLevel ? lv : (li ? li.name : lv)) : '';
                  return {
                      ora: c.oraInizio, vasca: c.vasca, corsie: c.corsie,
                      titolo: `${info ? info.name : 'Corso'}${nomeLv ? ' - ' + nomeLv : ''}`,
                      info, istruttore: c.data.istruttore || '', max: Number(c.data.maxUtenti) || 0,
                      partecipanti: [...att].sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'it'))
                  };
              });
          return { data: formatDate(ymd), corsi, totale: persone.size };
      }, [isIscrittiGiornoOpen, giornoIscritti, inizioSettimana, tuttiCorsiSelect, attivita]);

      // --- RINNOVI: chi ha il primo periodo (che finisce a fine gennaio) e va ricontattato per il secondo ---
      const statoRinnovi = useMemo(() => {
          const prim = intervalliDisp.primo;
          const giorniAbb = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
          const mappa = {};
          tuttiCorsiSelect.forEach(c => {
              const info = attivita.find(a => a.id === c.data.id);
              (c.data.partecipanti || []).forEach(p => {
                  if (!p || !p.nome) return;
                  const per = (p.iscrizioni || []).filter(i => i.fine);
                  if (per.length === 0) return;
                  const key = String(p.nome).toLowerCase().trim();
                  if (!mappa[key]) mappa[key] = { key, nome: p.nome, telefono: '', corsi: [], haPrimo: false, rinnovato: false };
                  const m = mappa[key];
                  if (!m.telefono && p.telefono) m.telefono = p.telefono;
                  per.forEach(i => { if (i.fine === prim.fine) m.haPrimo = true; if (i.fine > prim.fine) m.rinnovato = true; });
                  const lab = `${giorniAbb[c.giorno]} ${c.oraInizio} · ${info ? info.name : 'Corso'}`;
                  if (!m.corsi.includes(lab)) m.corsi.push(lab);
              });
          });
          const lista = Object.values(mappa).filter(m => m.haPrimo).map(m => {
              const arc = archivioSoci[m.key] || {};
              return { ...m, nome: arc.nome || m.nome, telefono: arc.telefono || m.telefono, inviato: arc.rinnovoMsgFine === prim.fine };
          });
          lista.sort((a, b) => (a.rinnovato - b.rinnovato) || a.nome.localeCompare(b.nome, 'it'));
          const giorniAlla = Math.round((new Date(prim.fine + 'T00:00:00') - new Date(new Date().setHours(0, 0, 0, 0))) / 86400000);
          return { lista, daRinnovare: lista.filter(r => !r.rinnovato), rinnovati: lista.filter(r => r.rinnovato), fine: prim.fine, giorniAlla, inFinestra: giorniAlla >= -7 && giorniAlla <= 30 };
      }, [tuttiCorsiSelect, attivita, archivioSoci, intervalliDisp]);

      const segnaAuguriInviati = (key, nome, inviato) => {
          setArchivioSoci(prev => {
              const esistente = prev[key] || { nome: nome };
              return { ...prev, [key]: { ...esistente, auguriMsgData: inviato ? toYMD(new Date()) : '' } };
          });
      };
      const segnaRinnovoInviato = (key, nome, inviato) => {
          setArchivioSoci(prev => {
              const esistente = prev[key] || { nome: nome };
              return { ...prev, [key]: { ...esistente, rinnovoMsgFine: inviato ? intervalliDisp.primo.fine : '' } };
          });
      };
      const messaggioRinnovo = (r) => {
          const sec = intervalliDisp.secondo;
          return `Ciao ${soloNomeProprio(r.nome)}! 👋\nIl tuo periodo di iscrizione ai corsi del Centro Federale Lampugnano termina il ${formatDate(intervalliDisp.primo.fine)}.\nVuoi rinnovare per il secondo periodo (${formatDate(sec.inizio)} - ${formatDate(sec.fine)})?\n\nDal 09/12 aprono le iscrizioni con precedenza fino al 06/01/2027. Per confermare il posto ti aspettiamo in segreteria 🏊\nGrazie!`;
      };
      const renderRigaRinnovo = (r) => {
          const num = numeroPerWhatsapp(r.telefono);
          return (
              <li key={r.key} className={`flex items-center gap-3 px-4 py-2.5 ${r.rinnovato || r.inviato ? 'bg-slate-50' : ''}`}>
                  <button onClick={() => segnaRinnovoInviato(r.key, r.nome, !r.inviato)} title={r.inviato ? 'Messaggio inviato: clicca per togliere la spunta' : 'Spunta quando il messaggio è stato inviato'} className={`shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${r.inviato ? 'bg-emerald-500 border-emerald-500' : 'border-slate-300 bg-white hover:border-emerald-400'}`}>
                      {r.inviato && <CheckIcon size={14} className="text-white"/>}
                  </button>
                  <div className="flex-1 min-w-0">
                      <div className={`font-semibold text-sm ${r.inviato || r.rinnovato ? 'text-slate-400' : 'text-slate-800'} ${r.inviato ? 'line-through' : ''}`}>{r.nome}</div>
                      <div className="flex flex-wrap gap-1.5 mt-1">{r.corsi.map((c, i) => <span key={i} className="bg-slate-100 px-2 py-0.5 rounded text-slate-700 font-bold border border-slate-200 text-xs">{c}</span>)}</div>
                  </div>
                  <span className={`shrink-0 text-[11px] font-bold uppercase px-2 py-1 rounded-full ${r.rinnovato ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>{r.rinnovato ? 'Già rinnovato' : 'Da rinnovare'}</span>
                  {num
                      ? <a href={`whatsapp://send?phone=${num}&text=${encodeURIComponent(messaggioRinnovo(r))}`} title="Proponi il rinnovo su WhatsApp" className="shrink-0 p-2 rounded-md text-[#25D366] hover:text-[#1ebe57] bg-green-50 hover:bg-green-100"><WhatsAppIcon size={18}/></a>
                      : <span title="Numero di telefono mancante" className="shrink-0 p-2 rounded-md text-slate-300 bg-slate-100 cursor-not-allowed"><WhatsAppIcon size={18}/></span>}
              </li>
          );
      };

      // Formatta il/i periodo/i di iscrizione di un partecipante (es. "dal 01/09/2026 al 30/06/2027")
      const formattaPeriodoIscrizione = (iscrizioni) => {
          const validi = (iscrizioni || []).filter(isc => isc && (isc.inizio || isc.fine));
          if (validi.length === 0) return '';
          return validi.map(isc => {
              const inizioStr = isc.inizio ? formatDate(isc.inizio) : '...';
              const fineStr = isc.fine ? formatDate(isc.fine) : '...';
              return `dal ${inizioStr} al ${fineStr}`;
          }).join(', ');
      };

      // --- "INSERITI OGGI": chi è stato aggiunto a un corso nella data odierna, per generare
      // un messaggio di conferma iscrizione pronto da copiare e inviare su WhatsApp. Attenzione:
      // "dataAggiunta" viene impostata SOLO quando una persona viene inserita per la prima volta in
      // un corso (vedi aggiungiPartecipante / salvaModificheModal / salvaUtenteRapido) — una modifica
      // alla sua anagrafica (certificato, documenti, tessera) non la tocca e quindi non la fa comparire qui.
      const inseritiOggi = useMemo(() => {
          const oggiStr = toYMD(new Date());
          const mapPersone = new Map();
          tuttiCorsiSelect.forEach(c => {
              const infoAtt = attivita.find(a => a.id === c.data.id);
              const nomeLiv = infoAtt?.isFreeTextLevel ? c.data.livello : infoAtt?.levels?.find(l => l.val === c.data.livello)?.name;
              const nomeCorsoStr = nomeLiv ? `${infoAtt?.name} - ${nomeLiv}` : (infoAtt?.name || 'Corso');
              (c.data.partecipanti || []).forEach(p => {
                  if (!p || !p.nome || p.dataAggiunta !== oggiStr) return;
                  const pKey = p.nome.toLowerCase().trim();
                  let voce = mapPersone.get(pKey);
                  if (!voce) {
                      const inArch = archivioSoci[pKey];
                      voce = { nome: p.nome, corsi: [], inviato: true, telefono: (inArch && inArch.telefono) || p.telefono || '' };
                      mapPersone.set(pKey, voce);
                  } else if (!voce.telefono && p.telefono) {
                      voce.telefono = p.telefono;
                  }
                  // "inviato" è vero solo se TUTTE le iscrizioni odierne di questa persona sono
                  // state spuntate come messaggio inviato (così il pallino resta coerente anche
                  // se è stata inserita oggi in più corsi contemporaneamente).
                  if (!p.messaggioInviato) voce.inviato = false;
                  const giaPresente = voce.corsi.some(co => co.nomeCorso === nomeCorsoStr && co.oraInizio === c.oraInizio && co.giorno === c.giorno);
                  if (!giaPresente) {
                      voce.corsi.push({ nomeCorso: nomeCorsoStr, giorno: c.giorno, oraInizio: c.oraInizio || '', periodo: formattaPeriodoIscrizione(p.iscrizioni) });
                  }
              });
          });
          const lista = Array.from(mapPersone.values());
          lista.forEach(v => v.corsi.sort((a, b) => a.giorno - b.giorno || a.oraInizio.localeCompare(b.oraInizio)));
          lista.sort((a, b) => a.nome.localeCompare(b.nome));
          return lista;
      }, [tuttiCorsiSelect, attivita, archivioSoci]);

      // --- SPOSTAMENTI DI OGGI (persone spostate da un corso a un altro) ---
      // Turni dei tirocinanti di oggi (dal calendario tirocinanti)
      const tirocinantiOggi = useMemo(() => {
        const oggi = toYMD(new Date());
        const conf = trovaConflitti(tirocinanti);
        const lista = [];
        tirocinanti.forEach(p => (p.presenze || []).forEach(x => { if (x.data === oggi) lista.push({ p, x, conflitto: conf.has(x.id) }); }));
        lista.sort((a, b) => (a.x.inizio || '99:99').localeCompare(b.x.inizio || '99:99') || nomeTiro(a.p).localeCompare(nomeTiro(b.p), 'it'));
        return lista;
      }, [tirocinanti]);
      const spostamentiOggi = useMemo(() => {
          const oggiStr = toYMD(new Date());
          const mappa = new Map();
          tuttiCorsiSelect.forEach(c => {
              const infoAtt = attivita.find(a => a.id === c.data.id);
              const nomeLiv = infoAtt?.isFreeTextLevel ? c.data.livello : infoAtt?.levels?.find(l => l.val === c.data.livello)?.name;
              const nomeCorsoStr = nomeLiv ? `${infoAtt?.name} - ${nomeLiv}` : (infoAtt?.name || 'Corso');
              (c.data.partecipanti || []).forEach(p => {
                  if (!p || !p.nome || p.dataSpostamento !== oggiStr) return;
                  const key = p.nome.toLowerCase().trim();
                  let voce = mappa.get(key);
                  if (!voce) {
                      const arc = archivioSoci[key] || {};
                      voce = { key, nome: p.nome, telefono: arc.telefono || p.telefono || '', da: p.spostatoDa || '', a: [], inviato: true };
                      mappa.set(key, voce);
                  }
                  if (!p.spostamentoInviato) voce.inviato = false;
                  if (!voce.a.some(x => x.nomeCorso === nomeCorsoStr && x.oraInizio === c.oraInizio && x.giorno === c.giorno)) {
                      voce.a.push({ nomeCorso: nomeCorsoStr, giorno: c.giorno, oraInizio: c.oraInizio || '', periodo: formattaPeriodoIscrizione(p.iscrizioni) });
                  }
              });
          });
          const lista = Array.from(mappa.values());
          lista.sort((x, y) => x.nome.localeCompare(y.nome));
          return lista;
      }, [tuttiCorsiSelect, attivita, archivioSoci]);

      // --- CHIUSURE: lezioni e persone coinvolte da una chiusura della vasca ---
      const corsiColpiti = useCallback((ch) => {
          const lezioni = [];
          const persone = new Map();
          const ini = new Date(ch.dal + 'T12:00:00'), fine = new Date((ch.al || ch.dal) + 'T12:00:00');
          for (let d = new Date(ini), n = 0; d <= fine && n < 400; d.setDate(d.getDate() + 1), n++) {
              const ymd = toYMD(d);
              const wd = (d.getDay() + 6) % 7;
              tuttiCorsiSelect.forEach(c => {
                  if (c.giorno !== wd) return;
                  if (ch.vasca !== 'tutte' && c.vasca !== ch.vasca) return;
                  if (c.data.dataInizio && c.data.dataInizio > ymd) return;
                  if (c.data.dataFine && c.data.dataFine < ymd) return;
                  if (Array.isArray(c.data.dateEscluse) && c.data.dateEscluse.includes(ymd)) return;
                  const infoAtt = attivita.find(a => a.id === c.data.id);
                  const nomeLiv = infoAtt?.isFreeTextLevel ? c.data.livello : infoAtt?.levels?.find(l => l.val === c.data.livello)?.name;
                  const nomeCorso = nomeLiv ? `${infoAtt?.name} - ${nomeLiv}` : (infoAtt?.name || 'Corso');
                  const lez = { ymd, giorno: wd, ora: c.oraInizio, vasca: c.vasca, nomeCorso };
                  lezioni.push(lez);
                  (c.data.partecipanti || []).forEach(p => {
                      if (!p || !p.nome || !attivoInData(p, ymd)) return;
                      const key = p.nome.toLowerCase().trim();
                      let voce = persone.get(key);
                      if (!voce) { const arc = archivioSoci[key] || {}; voce = { key, nome: p.nome, telefono: arc.telefono || p.telefono || '', email: arc.email || p.email || '', lezioni: [] }; persone.set(key, voce); }
                      if (!voce.lezioni.some(x => x.ymd === ymd && x.ora === lez.ora && x.nomeCorso === nomeCorso)) voce.lezioni.push(lez);
                  });
              });
          }
          const lista = Array.from(persone.values()).sort((a, b) => a.nome.localeCompare(b.nome, 'it'));
          lista.forEach(v => v.lezioni.sort((a, b) => a.ymd.localeCompare(b.ymd) || a.ora.localeCompare(b.ora)));
          return { lezioni, persone: lista };
      }, [tuttiCorsiSelect, attivita, archivioSoci]);
      // Chiusure che toccano la settimana visualizzata (per l'avviso sopra la griglia)
      const chiusureSettimana = useMemo(() => {
          const ini = toYMD(inizioSettimana), fin = toYMD(new Date(new Date(inizioSettimana).getTime() + 6 * 86400000));
          return chiusure.filter(c => c.al >= ini && c.dal <= fin && (c.vasca === 'tutte' || c.vasca === vascaSelezionata)).sort((a, b) => a.dal.localeCompare(b.dal));
      }, [chiusure, inizioSettimana, vascaSelezionata]);

      const messaggioSpostamento = (v) => {
          const dest = v.a.map(x => `${x.nomeCorso} il ${GIORNI[x.giorno]} alle ore ${x.oraInizio}${x.periodo ? `, nel periodo ${x.periodo}` : ''}`).join('; ');
          return `Ciao ${soloNomeProprio(v.nome)}, ti confermiamo lo spostamento dal corso ${v.da || 'precedente'} al nuovo corso: ${dest}.\n\nA presto in vasca! 🏊\nCentro Federale Lampugnano`;
      };
      const aggiornaSpostamentoOggi = (nomePersona, patch) => {
          const pKey = nomePersona.toLowerCase().trim();
          const oggiStr = toYMD(new Date());
          setTuttiPiani(prevTutti => {
              const prevSeason = prevTutti[stagioneSelezionata] || {};
              const nuovoPiano = { ...prevSeason };
              Object.keys(nuovoPiano).forEach(k => {
                  const cell = nuovoPiano[k];
                  if (!cell.partecipanti || cell.partecipanti.length === 0) return;
                  let cambiata = false;
                  const nuovi = cell.partecipanti.map(pp => {
                      if (pp && pp.nome && pp.nome.toLowerCase().trim() === pKey && pp.dataSpostamento === oggiStr) { cambiata = true; return { ...pp, ...patch }; }
                      return pp;
                  });
                  if (cambiata) nuovoPiano[k] = { ...cell, partecipanti: nuovi };
              });
              return { ...prevTutti, [stagioneSelezionata]: nuovoPiano };
          });
      };
      const segnaSpostamentoInviato = (nome, inviato) => aggiornaSpostamentoOggi(nome, { spostamentoInviato: !!inviato });
      const rimuoviSpostamentoOggi = (nome) => aggiornaSpostamentoOggi(nome, { dataSpostamento: '', spostatoDa: '', spostamentoInviato: false });

      // Messaggio di auguri per i compleanni (Oggi → Compleanni). I nomi sono salvati come "Cognome Nome":
      // per il saluto si usa solo il nome (si salta il cognome, anche se composto da particelle come "Dal Lago").
      const soloNomeProprio = (nomeCompleto) => {
          const parti = String(nomeCompleto || '').trim().split(/\s+/).filter(Boolean);
          if (parti.length <= 1) return parti[0] || '';
          const particelle = ['da', 'dal', 'dalla', 'dallo', 'dai', 'dei', 'del', 'della', 'delle', 'dello', 'di', 'de', 'des', 'la', 'le', 'lo', 'li', 'van', 'von', 'mc', 'san', 'santa', 'ben', 'el', 'al'];
          let idx = 1;
          while (idx < parti.length - 1 && particelle.includes(parti[idx - 1].toLowerCase())) idx++;
          return parti.slice(idx).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
      };
      const messaggioCompleanno = (nomeCompleto, eta) => {
          const nome = soloNomeProprio(nomeCompleto);
          const promo = eta > 16
              ? "🏊 1 ingresso omaggio per il nuoto libero\n👥 Un secondo ingresso a soli 4,50 € per portare con te chi vuoi"
              : "🎟 Con l'acquisto di 20 crediti, ne ricevi 10 in omaggio";
          return `🎂 Buon compleanno ${nome}! Tanti auguri dal Centro Federale Lampugnano 🎉\n\nPer festeggiare ti regaliamo:\n${promo}\n\nValido per 14 giorni dal tuo compleanno. Ti aspettiamo in piscina e ti auguriamo una splendida giornata! ☀️🥳`;
      };

      // --- COMPLEANNI DI OGGI: persone iscritte ai corsi della stagione la cui data di nascita completa cade oggi.
      const compleanniOggi = useMemo(() => {
          const oggi = new Date();
          const mmdd = toYMD(oggi).slice(5);
          const mappa = new Map();
          tuttiCorsiSelect.forEach(c => {
              const infoAtt = attivita.find(a => a.id === c.data.id);
              const nomeLiv = infoAtt?.isFreeTextLevel ? c.data.livello : infoAtt?.levels?.find(l => l.val === c.data.livello)?.name;
              const nomeCorsoStr = nomeLiv ? `${infoAtt?.name} - ${nomeLiv}` : (infoAtt?.name || 'Corso');
              (c.data.partecipanti || []).forEach(p => {
                  if (!p || !p.nome) return;
                  const key = p.nome.toLowerCase().trim();
                  const arch = archivioSoci[key] || {};
                  const dn = arch.dataNascita || p.dataNascita || '';
                  if (!dn || String(dn).slice(5) !== mmdd) return;
                  let voce = mappa.get(key);
                  if (!voce) {
                      voce = { key, nome: p.nome, eta: oggi.getFullYear() - parseInt(String(dn).slice(0, 4), 10), telefono: arch.telefono || p.telefono || '', corsi: [], inviato: arch.auguriMsgData === toYMD(oggi) };
                      mappa.set(key, voce);
                  }
                  if (!voce.corsi.some(co => co.nomeCorso === nomeCorsoStr && co.oraInizio === c.oraInizio && co.giorno === c.giorno)) {
                      voce.corsi.push({ nomeCorso: nomeCorsoStr, giorno: c.giorno, oraInizio: c.oraInizio || '' });
                  }
              });
          });
          const lista = Array.from(mappa.values());
          lista.forEach(v => v.corsi.sort((a, b) => a.giorno - b.giorno || a.oraInizio.localeCompare(b.oraInizio)));
          lista.sort((a, b) => a.nome.localeCompare(b.nome));
          return lista;
      }, [tuttiCorsiSelect, attivita, archivioSoci]);

      // Normalizza un numero per i link WhatsApp (solo cifre, con prefisso internazionale):
      // per i numeri italiani scritti senza prefisso aggiunge 39.
      const numeroPerWhatsapp = (tel) => {
          let d = String(tel || '').trim();
          if (!d) return '';
          const conPiu = d.startsWith('+');
          d = d.replace(/\D/g, '');
          if (!d) return '';
          if (d.startsWith('00')) d = d.slice(2);
          else if (!conPiu && d.length <= 10) d = '39' + d;
          return d;
      };

      // Tasto WhatsApp (solo pittogramma) per i solleciti del certificato medico nel pannello Scadenze.
      const bottoneWhatsappCertificato = (u, scaduto) => {
          const num = numeroPerWhatsapp(u.telefono);
          const base = "shrink-0 w-8 h-8 rounded-full flex items-center justify-center transition-colors";
          if (!num) {
              return <span title="Numero di telefono mancante: aggiungilo nella scheda della persona" className={`${base} bg-slate-100 text-slate-300 cursor-not-allowed`}><WhatsAppIcon size={16}/></span>;
          }
          const testo = scaduto
              ? `Ciao ${u.nome}, ti scriviamo dal Centro Federale Lampugnano.\nIl tuo certificato medico risulta scaduto il ${formatDate(u.scadCertificato)}.\nTi chiediamo di farci avere il certificato aggiornato appena possibile: puoi inviarcelo scansionato direttamente in questa chat oppure consegnarne una copia presso la segreteria.\nTi ricordiamo che senza certificato medico valido non è in alcun modo possibile partecipare al corso.\nRestiamo a disposizione per qualsiasi necessità o chiarimento.\n\nGrazie e a presto!\nCentro Federale Lampugnano`
              : `Ciao ${u.nome}, ti scriviamo dal Centro Federale Lampugnano.\nIl tuo certificato medico scadrà il ${formatDate(u.scadCertificato)}.\nTi chiediamo di farci avere il certificato aggiornato prima della scadenza: puoi inviarcelo scansionato direttamente in questa chat oppure consegnarne una copia presso la segreteria.\nTi ricordiamo che senza certificato medico valido non è in alcun modo possibile partecipare al corso.\nRestiamo a disposizione per qualsiasi necessità o chiarimento.\n\nGrazie e a presto!\nCentro Federale Lampugnano`;
          return <a href={`whatsapp://send?phone=${num}&text=${encodeURIComponent(testo)}`} title="Invia messaggio WhatsApp" className={`${base} bg-emerald-500 hover:bg-emerald-600 text-white`}><WhatsAppIcon size={16}/></a>;
      };

      // Spunta "messaggio certificato inviato". Memorizziamo nell'archivio soci la DATA DI SCADENZA
      // a cui si riferisce il messaggio: la spunta resta visibile finché il certificato è lo stesso,
      // e si azzera da sola quando viene inserito un nuovo certificato (nuova data).
      const segnaCertMsgInviato = (u, inviato) => {
          setArchivioSoci(prev => {
              const esistente = prev[u.key] || { nome: u.nome, anno: u.anno || '', dataNascita: u.dataNascita || '', scadCertificato: u.scadCertificato || '', card: u.card || '', telefono: u.telefono || '', email: u.email || '' };
              return { ...prev, [u.key]: { ...esistente, certMsgScad: inviato ? u.scadCertificato : '' } };
          });
      };
      const spuntaCertMsg = (u) => (
          <button type="button" onClick={() => segnaCertMsgInviato(u, !u.certMsgInviato)}
              title={u.certMsgInviato ? "Messaggio inviato (clicca per togliere la spunta)" : "Segna il messaggio come inviato"}
              className={`shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${u.certMsgInviato ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white border-slate-300 text-transparent hover:border-emerald-400'}`}>
              <CheckIcon size={14} />
          </button>
      );

      // Compila il testo del messaggio di conferma iscrizione, raggruppando per corso+orario
      // e unendo i giorni (utile se la persona è stata iscritta oggi a più giorni/corsi insieme),
      // includendo il periodo di iscrizione e un saluto finale.
      // "Cognome Nome" (come sono salvati) -> "Nome Cognome", gestendo cognomi e nomi composti.
      const nomePoiCognome = (nomeCompleto) => {
          const parti = String(nomeCompleto || '').trim().split(/\s+/).filter(Boolean);
          if (parti.length <= 1) return parti[0] || '';
          const nome = soloNomeProprio(nomeCompleto);
          const nNome = nome.split(/\s+/).filter(Boolean).length;
          const cognome = parti.slice(0, parti.length - nNome).join(' ');
          return cognome ? `${nome} ${cognome}` : nome;
      };
      const generaMessaggioOggi = (persona) => {
          const gruppi = [];
          persona.corsi.forEach(c => {
              let g = gruppi.find(x => x.nomeCorso === c.nomeCorso && x.oraInizio === c.oraInizio);
              if (!g) { g = { nomeCorso: c.nomeCorso, oraInizio: c.oraInizio, giorni: [], periodo: c.periodo || '' }; gruppi.push(g); }
              const giornoNome = GIORNI[c.giorno];
              if (giornoNome && !g.giorni.includes(giornoNome)) g.giorni.push(giornoNome);
              if (!g.periodo && c.periodo) g.periodo = c.periodo;
          });
          const frasiCorsi = gruppi.map(g => {
              const giorniStr = g.giorni.length > 1
                  ? g.giorni.slice(0, -1).join(', ') + ' e ' + g.giorni[g.giorni.length - 1]
                  : (g.giorni[0] || '');
              const periodoStr = g.periodo ? `, ${g.periodo.includes(', dal') ? 'nei periodi' : 'nel periodo'} ${g.periodo}` : '';
              return `${g.nomeCorso} il ${giorniStr} alle ore ${g.oraInizio}${periodoStr}`;
          });
          const corsiTesto = frasiCorsi.length > 1
              ? frasiCorsi.slice(0, -1).join('; ') + '; e ' + frasiCorsi[frasiCorsi.length - 1]
              : (frasiCorsi[0] || '');
          return `Ciao ${nomePoiCognome(persona.nome)}, grazie per esserti iscritto/a oggi presso il Centro Federale Lampugnano.\nTi confermiamo la tua iscrizione al corso ${corsiTesto}.\n\nA presto in vasca! 🏊\nCentro Federale Lampugnano`;
      };

      const copiaMessaggioOggi = (testo) => {
          if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(testo).then(() => mostraToast("Messaggio copiato negli appunti!")).catch(() => mostraToast("Impossibile copiare il messaggio.", 'error'));
          } else {
              mostraToast("Copia non supportata su questo browser.", 'error');
          }
      };

      // Toglie "dataAggiunta" da tutte le iscrizioni odierne di una persona (in tutti i corsi),
      // così da farla sparire dall'elenco "Inseriti Oggi" senza toccare nient'altro della sua scheda.
      // Serve sia per i casi in cui una persona viene segnata per errore (dato vecchio/corrotto),
      // sia per "spuntare" chi è già stato contattato.
      const rimuoviDaInseritiOggi = (nomePersona) => {
          const pKey = nomePersona.toLowerCase().trim();
          setTuttiPiani(prevTutti => {
              const prevSeason = prevTutti[stagioneSelezionata] || {};
              const nuovoPiano = { ...prevSeason };
              let qualcosaCambiato = false;
              Object.keys(nuovoPiano).forEach(k => {
                  const cell = nuovoPiano[k];
                  if (!cell.partecipanti || cell.partecipanti.length === 0) return;
                  let cellCambiata = false;
                  const nuoviPartecipanti = cell.partecipanti.map(p => {
                      if (p && p.nome && p.nome.toLowerCase().trim() === pKey && p.dataAggiunta) {
                          cellCambiata = true;
                          const { dataAggiunta, ...resto } = p;
                          return resto;
                      }
                      return p;
                  });
                  if (cellCambiata) {
                      nuovoPiano[k] = { ...cell, partecipanti: nuoviPartecipanti };
                      qualcosaCambiato = true;
                  }
              });
              return qualcosaCambiato ? { ...prevTutti, [stagioneSelezionata]: nuovoPiano } : prevTutti;
          });
          setPersonaOggiEspansa(null);
          mostraToast(`${nomePersona} rimosso/a dall'elenco "Inseriti Oggi".`);
      };

      // Svuota l'intero elenco "Inseriti Oggi" in un colpo solo (utile per ripulire voci vecchie/errate).
      const svuotaInseritiOggi = () => {
          if (inseritiOggi.length === 0) return;
          const chiavi = new Set(inseritiOggi.map(p => p.nome.toLowerCase().trim()));
          setTuttiPiani(prevTutti => {
              const prevSeason = prevTutti[stagioneSelezionata] || {};
              const nuovoPiano = { ...prevSeason };
              Object.keys(nuovoPiano).forEach(k => {
                  const cell = nuovoPiano[k];
                  if (!cell.partecipanti || cell.partecipanti.length === 0) return;
                  let cellCambiata = false;
                  const nuoviPartecipanti = cell.partecipanti.map(p => {
                      if (p && p.nome && chiavi.has(p.nome.toLowerCase().trim()) && p.dataAggiunta) {
                          cellCambiata = true;
                          const { dataAggiunta, ...resto } = p;
                          return resto;
                      }
                      return p;
                  });
                  if (cellCambiata) nuovoPiano[k] = { ...cell, partecipanti: nuoviPartecipanti };
              });
              return { ...prevTutti, [stagioneSelezionata]: nuovoPiano };
          });
          setPersonaOggiEspansa(null);
          mostraToast("Elenco \"Inseriti Oggi\" svuotato.");
      };

      // Spunta/togli la spunta "messaggio inviato" su tutte le iscrizioni odierne di una persona
      // (può essere stata inserita oggi in più corsi insieme): serve solo a non confondersi su chi
      // è già stato contattato, non tocca nient'altro della sua scheda.
      const segnaMessaggioInviato = (nomePersona, inviato) => {
          const pKey = nomePersona.toLowerCase().trim();
          const oggiStr = toYMD(new Date());
          setTuttiPiani(prevTutti => {
              const prevSeason = prevTutti[stagioneSelezionata] || {};
              const nuovoPiano = { ...prevSeason };
              let qualcosaCambiato = false;
              Object.keys(nuovoPiano).forEach(k => {
                  const cell = nuovoPiano[k];
                  if (!cell.partecipanti || cell.partecipanti.length === 0) return;
                  let cellCambiata = false;
                  const nuoviPartecipanti = cell.partecipanti.map(p => {
                      if (p && p.nome && p.nome.toLowerCase().trim() === pKey && p.dataAggiunta === oggiStr) {
                          cellCambiata = true;
                          return { ...p, messaggioInviato: !!inviato };
                      }
                      return p;
                  });
                  if (cellCambiata) {
                      nuovoPiano[k] = { ...cell, partecipanti: nuoviPartecipanti };
                      qualcosaCambiato = true;
                  }
              });
              return qualcosaCambiato ? { ...prevTutti, [stagioneSelezionata]: nuovoPiano } : prevTutti;
          });
      };

      const utentiConScadenze = useMemo(() => {
          const oggi = new Date();
          oggi.setHours(0,0,0,0);
          const tra30Giorni = new Date(oggi);
          tra30Giorni.setDate(oggi.getDate() + 30);
          const annoRif = parseInt(String(stagioneSelezionata).slice(0, 4), 10) || oggi.getFullYear();

          const mapUtenti = new Map();

          // Raccogliamo TUTTI i corsi di ogni persona in un solo passaggio, indipendentemente dal
          // valore del certificato salvato in quello specifico corso (che potrebbe essere superato
          // se quel corso non è stato più riaperto/salvato dopo un aggiornamento fatto altrove).
          tuttiCorsiSelect.forEach(c => {
              const infoAtt = attivita.find(a => a.id === c.data.id);
              const nomeLiv = infoAtt?.isFreeTextLevel ? c.data.livello : infoAtt?.levels?.find(l => l.val === c.data.livello)?.name;
              const nomeCorsoStr = nomeLiv ? `${infoAtt?.name} - ${nomeLiv}` : (infoAtt?.name || 'Corso');
              const giornoStr = (typeof GIORNI !== 'undefined' && GIORNI[c.giorno]) ? GIORNI[c.giorno].substring(0,3) : '';
              const corsoDettaglio = `${nomeCorsoStr} (${giornoStr} ${c.oraInizio || ''})`.trim();

              (c.data.partecipanti || []).forEach(p => {
                  if (!p || !p.nome) return;
                  const pKey = p.nome.toLowerCase().trim();

                  let utenteMap = mapUtenti.get(pKey);
                  if (!utenteMap) {
                      // scadCertificatoCorso/annoCorso sono solo un ripiego, usati esclusivamente
                      // se la persona non si trovasse nell'archivio soci (caso raro/di sicurezza).
                      utenteMap = { nome: p.nome, scadCertificatoCorso: p.scadCertificato || '', annoCorso: p.anno || '', dataNascitaCorso: p.dataNascita || '', corsi: [] };
                      mapUtenti.set(pKey, utenteMap);
                  }

                  if (!utenteMap.corsi.some(co => co.testo === corsoDettaglio)) {
                      utenteMap.corsi.push({ testo: corsoDettaglio, giorno: c.giorno, attivitaId: c.data.id, oraInizio: c.oraInizio || '', nomeCorso: nomeCorsoStr });
                  }
              });
          });

          const scaduti = [];
          const inScadenza = [];

          mapUtenti.forEach((u, pKey) => {
              // BUGFIX: usiamo SEMPRE il certificato più aggiornato conosciuto dal sistema
              // (l'archivio soci centralizzato) invece del valore trovato nel primo corso
              // incontrato. Senza questo, se una persona è iscritta a più corsi e solo uno di
              // questi viene riaperto/salvato dopo un aggiornamento del certificato, gli ALTRI
              // corsi continuano a mostrare il dato vecchio — e il pannello Scadenze poteva
              // pescare proprio quel valore superato, segnalando come "scaduto" un certificato
              // in realtà già rinnovato e in regola.
              const inArchivio = archivioSoci[pKey];
              const scadCertificatoEffettivo = (inArchivio && inArchivio.scadCertificato) || u.scadCertificatoCorso;
              const annoEffettivo = (inArchivio && inArchivio.anno) || u.annoCorso;

              const dataNascitaEffettiva = (inArchivio && inArchivio.dataNascita) || u.dataNascitaCorso || '';
              if (!scadCertificatoEffettivo || !certificatoObbligatorio(annoEffettivo, annoRif, dataNascitaEffettiva)) return;

              const dataScad = new Date(scadCertificatoEffettivo);
              dataScad.setHours(0,0,0,0);

              const voce = { nome: u.nome, anno: annoEffettivo, scadCertificato: scadCertificatoEffettivo, corsi: u.corsi, telefono: (inArchivio && inArchivio.telefono) || '', key: pKey, card: (inArchivio && inArchivio.card) || '', certMsgInviato: !!(inArchivio && inArchivio.certMsgScad && inArchivio.certMsgScad === scadCertificatoEffettivo) };

              if (dataScad < oggi) {
                  scaduti.push(voce);
              } else if (dataScad <= tra30Giorni) {
                  inScadenza.push(voce);
              }
          });

          scaduti.sort((a, b) => new Date(a.scadCertificato) - new Date(b.scadCertificato));
          inScadenza.sort((a, b) => new Date(a.scadCertificato) - new Date(b.scadCertificato));

          return { scaduti, inScadenza };
      }, [tuttiCorsiSelect, attivita, archivioSoci, stagioneSelezionata]);

      // Per "Oggi": certificati SCADUTI di chi ha un corso nel giorno della settimana di oggi (mostrati solo i corsi di oggi).
      const certificatiScadutiOggi = useMemo(() => {
          const giornoOggi = (new Date().getDay() + 6) % 7;
          return utentiConScadenze.scaduti
              .map(u => ({ ...u, corsiOggi: (u.corsi || []).filter(c => c.giorno === giornoOggi).sort((a, b) => String(a.oraInizio).localeCompare(String(b.oraInizio))) }))
              .filter(u => u.corsiOggi.length > 0);
      }, [utentiConScadenze]);

      // Elenco di chi non ha "documentiFirmati" a "sì" (quindi "no" oppure ancora da verificare),
      // indipendentemente dal certificato medico. Stessa logica di raccolta corsi delle scadenze.
      const utentiConDocumentiMancanti = useMemo(() => {
          const mapUtenti = new Map();

          tuttiUtentiUnici.forEach(u => {
              if (!u || !u.nome || u.documentiFirmati === 'si') return;
              const pKey = u.nome.toLowerCase().trim();
              mapUtenti.set(pKey, { ...u, corsi: [] });
          });

          tuttiCorsiSelect.forEach(c => {
              const infoAtt = attivita.find(a => a.id === c.data.id);
              const nomeLiv = infoAtt?.isFreeTextLevel ? c.data.livello : infoAtt?.levels?.find(l => l.val === c.data.livello)?.name;
              const nomeCorsoStr = nomeLiv ? `${infoAtt?.name} - ${nomeLiv}` : (infoAtt?.name || 'Corso');
              const giornoStr = (typeof GIORNI !== 'undefined' && GIORNI[c.giorno]) ? GIORNI[c.giorno].substring(0,3) : '';
              const corsoDettaglio = `${nomeCorsoStr} (${giornoStr} ${c.oraInizio || ''})`.trim();

              (c.data.partecipanti || []).forEach(p => {
                  if (!p || !p.nome || p.documentiFirmati === 'si') return;
                  const pKey = p.nome.toLowerCase().trim();

                  let utenteMap = mapUtenti.get(pKey);
                  if (!utenteMap) {
                      utenteMap = { ...p, corsi: [] };
                      mapUtenti.set(pKey, utenteMap);
                  }
                  if (!utenteMap.corsi) utenteMap.corsi = [];
                  if (!utenteMap.corsi.some(co => co.testo === corsoDettaglio)) {
                      utenteMap.corsi.push({ testo: corsoDettaglio, giorno: c.giorno, attivitaId: c.data.id, oraInizio: c.oraInizio || '', nomeCorso: nomeCorsoStr });
                  }
              });
          });

          const lista = Array.from(mapUtenti.values()).filter(u => u.corsi && u.corsi.length > 0);
          lista.sort((a, b) => a.nome.localeCompare(b.nome));
          return lista;
      }, [tuttiCorsiSelect, attivita, tuttiUtentiUnici]);


      // Applica i filtri per giorno della settimana e/o tipo di corso al pannello scadenze:
      // un utente resta in elenco se ALMENO UNO dei suoi corsi soddisfa i filtri selezionati.
      const filtraPerScadenze = useCallback((lista) => {
          if (!filtroScadenzeGiorno && !filtroScadenzeAttivita) return lista;
          return lista.filter(u => (u.corsi || []).some(co =>
              (!filtroScadenzeGiorno || String(co.giorno) === filtroScadenzeGiorno) &&
              (!filtroScadenzeAttivita || co.attivitaId === filtroScadenzeAttivita)
          ));
      }, [filtroScadenzeGiorno, filtroScadenzeAttivita]);


      const oraInizioInMinuti = (str) => {
          if (!str) return 9999;
          const [h, m] = str.split(':').map(Number);
          return (h || 0) * 60 + (m || 0);
      };

      // Individua il corso "rilevante" di un utente da usare per l'ordinamento per orario/corso:
      // se sono attivi dei filtri, usa il corso che li soddisfa; tra più corsi rilevanti, prende
      // quello con l'orario più presto.
      const corsoRilevantePerOrdinamento = useCallback((u) => {
          const corsi = u.corsi || [];
          const corsiFiltrati = corsi.filter(co =>
              (!filtroScadenzeGiorno || String(co.giorno) === filtroScadenzeGiorno) &&
              (!filtroScadenzeAttivita || co.attivitaId === filtroScadenzeAttivita)
          );
          const listaDaUsare = corsiFiltrati.length > 0 ? corsiFiltrati : corsi;
          return listaDaUsare.reduce((migliore, co) =>
              (!migliore || oraInizioInMinuti(co.oraInizio) < oraInizioInMinuti(migliore.oraInizio)) ? co : migliore
          , null);
      }, [filtroScadenzeGiorno, filtroScadenzeAttivita]);

      // Ordina l'elenco secondo il criterio scelto (per cognome, per orario del corso, per nome
      // del corso, o di default per data di scadenza come in origine).
      const ordinaScadenze = useCallback((lista) => {
          const arr = [...lista];
          if (ordinamentoScadenze === 'cognome') {
              arr.sort((a, b) => a.nome.localeCompare(b.nome));
          } else if (ordinamentoScadenze === 'orario') {
              arr.sort((a, b) => oraInizioInMinuti(corsoRilevantePerOrdinamento(a)?.oraInizio) - oraInizioInMinuti(corsoRilevantePerOrdinamento(b)?.oraInizio));
          } else if (ordinamentoScadenze === 'corso') {
              arr.sort((a, b) => (corsoRilevantePerOrdinamento(a)?.nomeCorso || '').localeCompare(corsoRilevantePerOrdinamento(b)?.nomeCorso || ''));
          } else {
              arr.sort((a, b) => new Date(a.scadCertificato) - new Date(b.scadCertificato));
          }
          return arr;
      }, [ordinamentoScadenze, corsoRilevantePerOrdinamento]);

      // Anche l'elenco dei documenti non firmati rispetta "Ordina Per". Qui non esiste una data di
      // scadenza, quindi con l'ordinamento "Data di Scadenza" si mantiene l'ordine alfabetico.
      const documentiMancantiFiltrati = useMemo(() => {
          const filtrati = filtraPerScadenze(utentiConDocumentiMancanti);
          if (ordinamentoScadenze === 'scadenza') return [...filtrati].sort((a, b) => a.nome.localeCompare(b.nome));
          return ordinaScadenze(filtrati);
      }, [utentiConDocumentiMancanti, filtraPerScadenze, ordinaScadenze, ordinamentoScadenze]);

      const scadenzeScadutiFiltrati = useMemo(() => ordinaScadenze(filtraPerScadenze(utentiConScadenze.scaduti)), [utentiConScadenze, filtraPerScadenze, ordinaScadenze]);
      const scadenzeInScadenzaFiltrati = useMemo(() => ordinaScadenze(filtraPerScadenze(utentiConScadenze.inScadenza)), [utentiConScadenze, filtraPerScadenze, ordinaScadenze]);

      // Esporta il pannello scadenze (con i filtri correnti applicati) in una finestra di stampa,
      // dalla quale è possibile salvare in PDF tramite la finestra di dialogo di stampa del browser.
      const esportaScadenzePDF = () => {
        const printWindow = window.open('', '_blank');
        if (!printWindow) {
          alert("Attenzione: Abilita i popup nel browser per visualizzare e stampare le scadenze.");
          return;
        }

        const nomeGiornoFiltro = filtroScadenzeGiorno ? GIORNI[Number(filtroScadenzeGiorno)] : '';
        const nomeAttivitaFiltro = filtroScadenzeAttivita ? (attivita.find(a => a.id === filtroScadenzeAttivita)?.name || '') : '';
        const sottotitoloFiltri = [nomeGiornoFiltro, nomeAttivitaFiltro].filter(Boolean).join(' · ') || 'Tutti i corsi, tutti i giorni';

        const includeCertificati = tipoEsportazioneScadenze === 'certificati' || tipoEsportazioneScadenze === 'entrambi';
        const includeDocumenti = tipoEsportazioneScadenze === 'documenti' || tipoEsportazioneScadenze === 'entrambi';

        const rigaCertificato = (u) => `
          <tr>
            <td>${u.nome}</td>
            <td>${(u.corsi || []).map(co => co.testo).join(', ')}</td>
            <td style="text-align:right; font-weight:bold; color:#dc2626;">Scaduto il ${formatDate(u.scadCertificato)}</td>
          </tr>
        `;
        const rigaDocumento = (u) => `
          <tr>
            <td>${u.nome}</td>
            <td>${(u.corsi || []).map(co => co.testo).join(', ')}</td>
            <td style="text-align:right; font-weight:bold; color:#7e22ce;">${u.documentiFirmati === 'no' ? 'Non firmati' : 'Da verificare'}</td>
          </tr>
        `;

        const sezioneCertificati = includeCertificati ? `
          <h2 class="sez-certificati">Certificati Medici Scaduti (${scadenzeScadutiFiltrati.length})</h2>
          ${scadenzeScadutiFiltrati.length > 0 ? `
            <table>
              <thead><tr><th style="width:25%;">Nominativo</th><th style="width:45%;">Corsi</th><th style="width:30%;">Scadenza</th></tr></thead>
              <tbody>${scadenzeScadutiFiltrati.map(rigaCertificato).join('')}</tbody>
            </table>
          ` : `<div class="empty">Nessun certificato scaduto.</div>`}
        ` : '';

        const sezioneDocumenti = includeDocumenti ? `
          <h2 class="sez-documenti">Documenti Non Firmati / Da Verificare (${documentiMancantiFiltrati.length})</h2>
          ${documentiMancantiFiltrati.length > 0 ? `
            <table>
              <thead><tr><th style="width:25%;">Nominativo</th><th style="width:45%;">Corsi</th><th style="width:30%;">Stato</th></tr></thead>
              <tbody>${documentiMancantiFiltrati.map(rigaDocumento).join('')}</tbody>
            </table>
          ` : `<div class="empty">Nessun documento mancante.</div>`}
        ` : '';

        const titoloPagina = tipoEsportazioneScadenze === 'entrambi' ? 'Certificati e Documenti' : (includeDocumenti ? 'Documenti Non Firmati / Da Verificare' : 'Certificati Medici Scaduti');

        printWindow.document.write(`
          <html>
            <head>
              <title>${titoloPagina}</title>
              <style>
                @page { size: A4 landscape; margin: 15mm; }
                body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 0; margin: 0; color: #1e293b; font-size: 10pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                h1 { margin: 0 0 4px 0; font-size: 18pt; color: #0f172a; }
                h3 { margin: 0 0 16px 0; color: #64748b; font-weight: 500; font-size: 10pt; text-transform: uppercase; letter-spacing: 0.5px; }
                h2 { font-size: 11pt; text-transform: uppercase; letter-spacing: 0.5px; margin: 24px 0 8px 0; padding-bottom: 6px; border-bottom: 2px solid #64748b; }
                h2.sez-certificati { color: #dc2626; }
                h2.sez-documenti { color: #7e22ce; }
                table { width: 100%; border-collapse: collapse; font-size: 10pt; margin-bottom: 8px; }
                th, td { border: 1px solid #64748b; padding: 6px 8px; text-align: left; font-size: 10pt; }
                th { background-color: #e2e8f0 !important; font-weight: 600; color: #475569; text-transform: uppercase; font-size: 9pt; }
                .empty { color: #94a3b8; font-style: italic; font-size: 10pt; margin-bottom: 8px; }
              </style>
            </head>
            <body>
              <h1>${titoloPagina}</h1>
              <h3>${sottotitoloFiltri}</h3>

              ${sezioneCertificati}
              ${sezioneDocumenti}

              <script>
                window.onload = () => { setTimeout(() => { window.print(); window.close(); }, 500); }
              <\/script>
            </body>
          </html>
        `);
        printWindow.document.close();
      };

      const giorniConCorsiPerUtenteRapido = useMemo(() => {
        return addUtenteRapido.attivitaId
          ? [...new Set(tuttiCorsiSelect.filter(c => c.data.id === addUtenteRapido.attivitaId).map(c => c.giorno))].sort((a, b) => a - b)
          : [];
      }, [tuttiCorsiSelect, addUtenteRapido.attivitaId]);

      const corsiPerUtenteRapido = useMemo(() => {
        return addUtenteRapido.attivitaId
          // BUGFIX: usiamo un id stabile basato sulle chiavi reali del corso (c.keys) invece
          // della posizione nell'array (originalIndex). La posizione può cambiare se la lista
          // dei corsi viene ricalcolata (es. corso aggiunto/modificato altrove) mentre questa
          // finestra è aperta, causando la selezione del corso sbagliato o un blocco dell'app.
          ? tuttiCorsiSelect.filter(c => c.data.id === addUtenteRapido.attivitaId).map(c => ({...c, selId: c.keys.join('|')}))
          : [];
      }, [tuttiCorsiSelect, addUtenteRapido.attivitaId]);

      const privatoUI = (() => { const a = attivita.find(x => x.id === addUtenteRapido.attivitaId); return !!a && (a.id === 'privato' || /privat/i.test(a.name || '')); })();

      const salvaUtenteRapido = (e) => {
        e.preventDefault();
        const attSel = attivita.find(a => a.id === addUtenteRapido.attivitaId);
        const soloAnagrafica = !!attSel && (attSel.id === 'privato' || /privat/i.test(attSel.name || ''));
        if (!soloAnagrafica && (!addUtenteRapido.corsiSelezionati || addUtenteRapido.corsiSelezionati.length === 0)) return alert("Seleziona almeno un corso!");
        if (!addUtenteRapido.nome.trim()) return alert("Inserisci il Cognome e Nome!");
        
        const iscrizioniPulite = (addUtenteRapido.iscrizioni || []).filter(i => i.inizio || i.fine);
        const nomeNormRapido = addUtenteRapido.nome.trim().toLowerCase();
        let corsiNonPiuDisponibili = 0;

        // Archivio soci permanente: memorizziamo/aggiorniamo questo socio così non andrà
        // ridigitato da capo la prossima volta (anche in un'altra stagione).
        aggiornaArchivioSoci(addUtenteRapido.nome, addUtenteRapido.anno, addUtenteRapido.scadCertificato, addUtenteRapido.card, addUtenteRapido.telefono, addUtenteRapido.dataNascita, addUtenteRapido.email, addUtenteRapido.sesso, addUtenteRapido.livelloSocio);
        if (soloAnagrafica) {
            // Lezione privata: si crea solo l'anagrafica (nessun corso). Il pacchetto si crea poi da "Lezioni private".
            const keyAn = addUtenteRapido.nome.trim().toLowerCase();
            const docF = addUtenteRapido.documentiFirmati || '';
            if (docF) setArchivioSoci(prev => ({ ...prev, [keyAn]: { ...(prev[keyAn] || {}), docStagioni: { ...((prev[keyAn] && prev[keyAn].docStagioni) || {}), [stagioneSelezionata]: docF } } }));
            const nomeNuovo = addUtenteRapido.nome.trim();
            setIsAddUserModalOpen(false);
            setAddUtenteRapido({ attivitaId: '', corsiSelezionati: [], nome: '', anno: '', dataNascita: '', scadCertificato: '', documentiFirmati: '', card: '', telefono: '', email: '', iscrizioni: [{inizio: '', fine: ''}] });
            mostraToast(`${nomeNuovo}: anagrafica creata. Ora puoi creare il pacchetto da "Lezioni private".`);
            return;
        }

        setTuttiPiani(prevTutti => {
            const prevSeason = prevTutti[stagioneSelezionata] || {};
            const nuovoPiano = { ...prevSeason };

            // BUGFIX: usiamo direttamente le chiavi salvate al momento della selezione
            // (sel.keys), invece di recuperare il corso tramite un indice nella lista
            // tuttiCorsiSelect. Se quella lista era cambiata nel frattempo (es. un altro
            // corso aggiunto o modificato), l'indice poteva puntare al corso sbagliato o
            // non esistere più, bloccando l'inserimento con un errore.
            addUtenteRapido.corsiSelezionati.forEach(sel => {
                const keys = sel && sel.keys ? sel.keys : [];
                keys.forEach(k => {
                    if (!nuovoPiano[k]) {
                        // Il corso non esiste più (rimosso o spostato nel frattempo): saltiamo
                        // in sicurezza invece di far crashare il salvataggio.
                        corsiNonPiuDisponibili++;
                        return;
                    }
                    const cell = { ...nuovoPiano[k] };
                    const partecipanti = [...(cell.partecipanti || [])];
                    const arcRapido = archivioSoci[nomeNormRapido] || {};
                    const datiPartecipante = {
                        nome: normalizzaNome(addUtenteRapido.nome),
                        anno: addUtenteRapido.anno || arcRapido.anno || '',
                        dataNascita: addUtenteRapido.dataNascita || arcRapido.dataNascita || '',
                        scadCertificato: addUtenteRapido.scadCertificato,
                        documentiFirmati: addUtenteRapido.documentiFirmati || '',
                        card: addUtenteRapido.card || arcRapido.card || '',
                        telefono: addUtenteRapido.telefono || arcRapido.telefono || '',
                        email: normalizzaEmail(addUtenteRapido.email || arcRapido.email || ''),
                        sesso: addUtenteRapido.sesso || arcRapido.sesso || rilevaSesso(normalizzaNome(addUtenteRapido.nome)),
                        livelloSocio: addUtenteRapido.livelloSocio !== undefined ? addUtenteRapido.livelloSocio : (arcRapido.livelloSocio || ''),
                        iscrizioni: iscrizioniPulite
                    };
                    // BUGFIX: se la persona è già iscritta a questo corso (es. lo si usa per
                    // aggiornare certificato/documenti/tessera di qualcuno già presente),
                    // aggiorniamo la sua scheda invece di crearne una seconda duplicata — e la
                    // data di primo inserimento resta quella originale, non viene "ritimbrata".
                    const existingIndex = partecipanti.findIndex(p => p && p.nome && p.nome.toLowerCase().trim() === nomeNormRapido);
                    if (existingIndex !== -1) {
                        partecipanti[existingIndex] = { ...datiPartecipante, dataAggiunta: partecipanti[existingIndex].dataAggiunta || '' };
                    } else {
                        // Nuovo inserimento vero e proprio: qui, e solo qui, registriamo la data
                        // odierna (usata dal pannello "Inseriti Oggi" per il messaggio WhatsApp).
                        partecipanti.push({ ...datiPartecipante, dataAggiunta: toYMD(new Date()) });
                    }
                    partecipanti.sort((a, b) => a.nome.localeCompare(b.nome));
                    cell.partecipanti = partecipanti;
                    nuovoPiano[k] = cell;
                });
            });
            return { ...prevTutti, [stagioneSelezionata]: nuovoPiano };
        });

        const nomeAggiunto = addUtenteRapido.nome.trim();
        setIsAddUserModalOpen(false);
        setAddUtenteRapido({ attivitaId: '', corsiSelezionati: [], nome: '', anno: '', dataNascita: '', scadCertificato: '', documentiFirmati: '', card: '', telefono: '', email: '', iscrizioni: [{inizio: '', fine: ''}] });

        if (corsiNonPiuDisponibili > 0) {
            mostraToast("Alcuni corsi selezionati non erano più disponibili e sono stati saltati.", 'error');
        } else {
            mostraToast(`${nomeAggiunto} aggiunto con successo!`);
        }
      };

      // --- LOGICA RICERCA SOCIO ---
      const filtriRicAttivi = !!(filtroLivelloRic || filtroPeriodoRic || filtroCertRic);
      const searchResults = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          const usaTesto = q.length >= 2;
          if (!usaTesto && !filtriRicAttivi) return [];
          const oggiYMD = toYMD(new Date());
          const tra30YMD = toYMD(new Date(Date.now() + 30 * 24 * 60 * 60 * 1000));
          const ivP = filtroPeriodoRic ? intervalliDisp[filtroPeriodoRic] : null;
          const results = [];
          const visti = new Set();
          tuttiCorsiSelect.forEach(c => {
              (c.data.partecipanti || []).forEach(p => {
                  if (!p || !p.nome) return;
                  const key = p.nome.toLowerCase().trim();
                  if (usaTesto && !key.includes(q)) return;
                  const arc = archivioSoci[key] || {};
                  if (filtroLivelloRic && !livelliSocioArray(arc.livelloSocio || p.livelloSocio || '').includes(filtroLivelloRic)) return;
                  if (ivP && !(p.iscrizioni || []).some(i => i.inizio === ivP.inizio && i.fine === ivP.fine)) return;
                  if (filtroCertRic) {
                      const sc = arc.scadCertificato || p.scadCertificato || '';
                      if (filtroCertRic === 'mancante' && sc) return;
                      if (filtroCertRic === 'scaduto' && !(sc && sc < oggiYMD)) return;
                      if (filtroCertRic === 'scade30' && !(sc && sc >= oggiYMD && sc <= tra30YMD)) return;
                  }
                  if (!usaTesto) { if (visti.has(key)) return; visti.add(key); }
                  results.push({ partecipante: p, corso: c });
              });
          });
          results.sort((a, b) => a.partecipante.nome.localeCompare(b.partecipante.nome));
          return results;
      }, [searchQuery, tuttiCorsiSelect, archivioSoci, filtroLivelloRic, filtroPeriodoRic, filtroCertRic, intervalliDisp]);

      // Quando si apre un corso dalla ricerca, la persona cercata viene evidenziata nell'elenco
      // iscritti (e l'elenco scorre fino a lei). L'informazione vive dentro editModal: quando il
      // box del corso viene chiuso (editModal torna null) l'evidenziazione sparisce da sola.
      const socioEvidenziatoKey = editModal && editModal.socioEvidenziato ? editModal.socioEvidenziato : null;
      useEffect(() => {
          if (!socioEvidenziatoKey) return;
          const t = setTimeout(() => {
              const el = document.getElementById('riga-socio-evidenziato');
              if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 150);
          return () => clearTimeout(t);
      }, [socioEvidenziatoKey]);

      const apriCorsoDaRicerca = (c, nomeSocio, apriModifica = false) => {
          setIsSearchModalOpen(false);
          const info = attivita.find(a => a.id === c.data.id);
          const vascaOriginale = c.vasca;
          // BUGFIX: stessa correzione di handleClickCorso — rinfreschiamo anno/certificato con
          // l'archivio soci permanente, per non ripropagare dati superati (vedi nota lì per il dettaglio).
          const partecipantiOrdinati = [...(c.data.partecipanti || [])]
            .map(p => {
                if (!p || !p.nome) return p;
                const inArchivio = archivioSoci[p.nome.toLowerCase().trim()];
                if (!inArchivio) return p;
                return {
                    ...p,
                    anno: inArchivio.anno || p.anno,
                    dataNascita: inArchivio.dataNascita || p.dataNascita || '',
                    sesso: inArchivio.sesso || p.sesso || '',
                    livelloSocio: inArchivio.livelloSocio || p.livelloSocio || '',
                    scadCertificato: inArchivio.scadCertificato || p.scadCertificato,
                  card: inArchivio.card || p.card || '',
                  telefono: inArchivio.telefono || p.telefono || '',
                  email: inArchivio.email || p.email || ''
                };
            })
            .sort((a, b) => a.nome.localeCompare(b.nome));

          setEditModal({
              corsoOriginale: c,
              vasca: vascaOriginale,
              attivitaId: c.data.id,
              giorno: c.giorno,
              oraInizio: c.oraInizio,
              durata: c.data.durata || 45,
              maxUtenti: c.data.maxUtenti || '',
              corsie: [...c.corsie],
              istruttore: c.data.istruttore || '',
              livello: c.data.livello || '',
              dataInizio: c.data.dataInizio || '',
              dataFine: c.data.dataFine || '',
              dateEscluse: [...(c.data.dateEscluse || [])],
              dataOccorrenza: toYMD(new Date(inizioSettimana.getTime() + c.giorno * 24 * 60 * 60 * 1000)),
              infoAttivita: info,
              partecipanti: partecipantiOrdinati,
              socioEvidenziato: nomeSocio ? nomeSocio.toLowerCase().trim() : null,
              tab: apriModifica ? 'partecipante' : 'iscritti'
          });
          // Dalla finestra Scadenze: apre direttamente il modulo di modifica della persona.
          const idxModifica = apriModifica && nomeSocio ? partecipantiOrdinati.findIndex(p => p && p.nome && p.nome.toLowerCase().trim() === nomeSocio.toLowerCase().trim()) : -1;
          if (idxModifica >= 0) {
              const pm = partecipantiOrdinati[idxModifica];
              const iscrizioniM = pm.iscrizioni && pm.iscrizioni.length > 0 ? [...pm.iscrizioni] : (pm.scadIscrizione ? [{ inizio: '', fine: pm.scadIscrizione }] : [{ inizio: '', fine: '' }]);
              setNuovoPartecipante({ ...pm, iscrizioni: iscrizioniM });
              setEditingPartecipanteIndex(idxModifica);
              setShowAddForm(true);
          } else {
              setNuovoPartecipante({ nome: '', anno: '', dataNascita: '', scadCertificato: '', documentiFirmati: '', card: '', telefono: '', email: '', iscrizioni: [{inizio: '', fine: ''}] });
              setEditingPartecipanteIndex(null);
              setShowAddForm(false);
          }
      };

      // Dalla finestra Scadenze: apre il primo corso della persona direttamente in modifica anagrafica.
      const modificaAnagraficaDaScadenza = (u) => {
          const key = String(u.nome || '').toLowerCase().trim();
